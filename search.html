 "I'm in. Я в деле", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Just say when. Скажи только когда", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "I could use one. Мне бы не помешало", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Twist my arm. Ну если настаиваешь", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "It is what it is. Ну что поделать", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Bit of both. И то, и другое", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Nothing out of the ordinary. Ничего особенного", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Can't complain. Не жалуюсь", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Same circus. Всё тот же цирк", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "born and raised родился и вырос здесь", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Not the place — the people. Скучаю не по месту, по людям", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "She's gonna love hearing that. Она это оценит (сарказм)", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Should've listened to her. Надо было её послушать", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "I fought it for a year. Я год сопротивлялся", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Good catching up. Рад был поболтать", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Anyway... Ладно, а вот...", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Формат: короткое занятие — разминка, блиц, упражнение. Без диалога.", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "Задача: сломать шестидневную линию «личный вопрос → общий ответ» .", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "☀️ Разминка", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "✅ Четыре вчерашние карточки подряд, все к месту: Can't complain · slept like a baby · First up · I'll take it from there", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "⚠️ Главная правка: duty → call", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "❌ ✅ Почему", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "The duty was okay The call was okay. · Quiet night. · It was an easy one. Duty = долг, обязанность ( duty to your country ). Дежурство врача = call", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "📌 Калька с русского «дежурство» — ловушка ровно для русскоязычных. Помни вчерашнее `I'm on call` — та же семья слов.", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "💡 Единственное живое: `the doctor on duty` — «дежурный врач». Само дежурство — call .", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "Остальные правки", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "No phones during the night No calls overnight. · Phone didn't ring once.", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "Yesterday, I fell asleep at midnight I got to bed around midnight. · I crashed at midnight.", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "practicing English, checking emails and morning meeting Coffee, English, emails, morning meeting. (один формат!)", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "📌 `overnight` — одно слово вместо during the night . Врачи говорят только так: three episodes overnight , stable overnight .", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "📌 `fell asleep` = «заснул незаметно» (в кресле, на лекции). Лёг намеренно → went to bed / got to bed .", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "⚡ Блиц — 10/12", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "✅ Вчерашняя болячка закрывается: вопросительный порядок слов 4 из 5.", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "✅ Верно", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "Could you do it? Could you see yourself doing it? глагол вперёд, обе формы", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "Where was he transferred? пассив + порядок в вопросе", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "The call was quiet call , не duty — через 10 минут после разбора", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "No calls overnight. Phone didn't ring once.", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "I crashed at midnight · Three calls in a row артикль a на месте", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "not that simple · I'm in, just say when · Good catching up", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "⚠️ Две ошибки", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "№1 `When did she arrive?` — грамматика безупречна, не тот глагол .", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "№5 `How long are you working here?` ⚠️ — важная ошибка.", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "📌 Правило: «сколько времени уже...» → have been + -ing . Всегда.", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "❌ Are you working = «чем занят прямо сейчас».", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "💡 Механика та же, что с «when she admitted»: утверждение знаешь ( I've been here for three years — сказал вчера верно), в вопросе форма не собирается.", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "🎯 УПРАЖНЕНИЕ «ОДНА ДЕТАЛЬ»", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "Зачем: пятый день подряд держалась линия — на личный вопрос идёт общая формулировка. Вчера пик: Том спросил «чья была идея переехать», ответ — both → not so simple → easier said than done . Три способа сказать «сложно», ни одной детали.", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "Правило:", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "Вопросы: Was moving here your idea, or your wife's? · What was the hardest part of the first year? · Do you ever regret it?", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "🔴 ЗАХОД 1 — ушёл в общее", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "Ответ Что произошло", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "1 ✅ деталь есть — «через год она согласилась»", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "2 ⚠️ начал с детали → ушёл в безличное you → bottleneck (слово из бизнес-презентации)", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "3 ⚠️ прямой ответ → сразу лозунг + we там, где спросили тебя", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "📌 ЗАКОНОМЕРНОСТЬ: первое предложение всегда честное. Уход начинается со второго. Как только надо развернуть — включается общая формулировка.", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "💡 Практический вывод: задача не в первом предложении, а во ВТОРОМ. Сказал «идея была моя» — дальше не объясняй, приведи случай .", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "🟢 ЗАХОД 2 — с ограничением «второе предложение = конкретная сцена»", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "⚠️ Запрещено: we · безличное you · opportunities · doors · decision · bottleneck", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "📊 Что изменилось за один заход", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "Заход 1 Заход 2", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "1 «it was my idea» и стоп друг из США, разговор, поворотная точка", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "2 bottleneck , безличное you 💎 «understood everything in the ICU, but froze»", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "3 «opens us new doors» дети говорят на двух языках", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "✅ Ноль `we`. Ноль безличного `you`. Шестидневная линия сломана — под ограничением.", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "💡 Вывод: механизм работает, когда правило названо вслух. Задача — чтобы срабатывал без напоминания. Это вопрос повторов, не понимания.", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "💎 Лучшее предложение недели", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "Контраст + сцена + конкретика. По нему видно человека .", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "📌 Рядом стояло `It was challenging` (пусто) — и живая сцена. Второе сильнее в десять раз, первое можно просто выкинуть.", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "🔧 Правки захода 2", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "looked at all around me looked around me", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "I' ve shared it with my wife and told her about it I told my wife. (Perfect не туда + повтор одного и того же)", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "It was only my idea It was my idea, all mine. ( only = «всего лишь»)", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "every time when I needed every time I needed (без when )", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "to talk to families and to have conversations with colleagues with families, with colleagues", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "It was challenging — убрать, сцена скажет сама", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "my kids talking two languages my kids speaking two languages (⚠️ speak = владеть языком)", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "I think moving here was a good decision — убрать, фраза про детей говорит это сама", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "My wife should have more time My wife needed more time. · It took her longer to come around.", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "opens us new doors opened doors for us (порядок + предлог + время)", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "📌 Новые фразы", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "Фраза Перевод", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "The call was okay. Дежурство прошло нормально", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "Quiet night. Спокойная ночь", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "No calls overnight. Ночью не дёргали", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "Phone didn't ring once. Телефон ни разу не зазвонил", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "I crashed at midnight. Вырубился в полночь", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "How long have you been working here? Сколько ты здесь работаешь?", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "The thing that changed my mind was... Что меня переубедило — это...", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "That was the starting point. С этого всё началось", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "She speaks two languages. Говорит на двух языках", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "It took her longer to come around. Ей понадобилось больше времени согласиться", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "You got lucky. Тебе повезло", "s": "Модуль 4 · Работа/Медицина · урок 22", "u": "lesson-04-22.html", "ti": "Урок 22 (Модуль 4) — 🎯 Упражнение «Одна деталь» (27.08)"}, {"t": "Сцена: суббота, выходной. Родительское собрание в школе дочери закончилось. У выхода — Michelle , мама одноклассницы Эллы. Здороваетесь у школы, но толком не разговаривали.", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Задача: small talk с малознакомым человеком о своих детях . Лёгкий регистр + вчерашнее правило: второе предложение — конкретная сцена, не общая мысль.", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "🎬 Полн обрания (29.08)"}, {"t": "Мишель трижды давала конкретную сцену. Трижды получала обобщение.", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Она сказала Ты ответил", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "«Элла спорит со мной каждый вечер из-за чтения» «поколение TikTok, не книг»", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "«Иногда сдаюсь, включаю мультик, потом час чувствую вину » «that's not so simple» + «мы с женой тоже»", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "«Дочь спросила, почему я всё время уставшая . Ответа не было» «это у всех нас» → «может, однажды они нас поймут»", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "📌 СЕДЬМОЙ ДЕНЬ. И самый чистый случай: собеседница открывалась первой каждый раз , без давления, в лёгком регистре. Более благоприятных условий не будет.", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "⚠️ Что при этом потерялось: она спросила «как у Майи?» — ты не ответил . Про Майю сказано только «то же самое», дальше сразу про TikTok. Мишель узнала про твою дочь ровно ноль.", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "🚩 Сигнальный маячок", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "`That's not so simple` вышло автоматически на личный вопрос — та же фраза, что вчера в ответе Тому.", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "📌 Когда изо рта выходит «not so simple» — значит вопрос попал в живое, и включилась защита. Ловить себя на ней.", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "⛔ Под запретом в личных разговорах до конца недели. Заменитель: пауза, потом факт.", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Разбор последнего ответа по шагам", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Что сказал Что оно делает", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "It's not just you. ✅ добрая фраза, правильное начало", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "It's all of us. я → все родители", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "It's hard to find a good answer. её случай → общее правило", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Maybe one day they will understand us. взрослые vs дети, философия", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "📌 К третьей фразе ты говоришь уже не с Мишель, а о человечестве.", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "✍️ Что просилось — три места", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "1. Про чтение (она: «спорит каждый вечер»):", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "📌 «Поколение TikTok» — с этим нечего делать, разговор закончен. «Она вдруг очень хочет пить» — Мишель засмеётся и расскажет своё.", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "2. Про вину (она первая призналась в слабости):", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "💡 У тебя была готовая честная деталь — дежурства, поздние возвращения. Одна фраза сделала бы разговор настоящим.", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "3. Про «почему ты всё время уставшая»:", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "🎯 ГЛАВНЫЙ ВЫВОД ДНЯ", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Вчера с ограничением — все три ответа с деталью. Сегодня без ограничения — ни одного.", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "💡 Дело не в умении, а в автоматизме. Механизм срабатывает, когда правило названо вслух за секунду до. Задача — довести до рефлекса.", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "💡 Формула small talk", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Ты присоединился к жалобе про собрание ✅, но не добавил своего :", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "📌 Согласился → добавь свою деталь → она ответит своей. Без детали разговор держится на ней одной.", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "🔧 Языковые правки", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "❌ ✅ Почему", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Yes, I'm Maya's dad. Eduard. Eduard — yeah, Maya's dad. в английском знакомстве имя идёт ПЕРВЫМ", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Yeap Yep", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "They focused on the other things other things · everything except that the other things = «те самые», которых не было", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Maya, that the same thing Maya's the same. · Same with Maya. потерялся глагол", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "That's not so simple not that simple (и лучше вообще убрать) правили позавчера", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Maybe one day they will understand us Maybe when she's thirty she'll get it. подпись под открыткой → конкретика с юмором", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "три фразы согласия подряд ( I'm in → I'd be glad → Let's do it ) хватает двух: I'm in. Just say when.", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Из разминки", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "the sleep was all right Slept all right. · I slept fine. ( sleep несчитаемое, артикль не берёт)", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "It's a weekend It's the weekend. (⚠️ всегда the )", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "I don't have any plans for today No plans. That's the plan. 💎", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "💊 Грамматика т.16 — дрилл 12/12 🏆", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Второй чистый прогон за утро (блиц тоже 12/12).", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Взято с первого раза", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "I have few minutes / I have a few minutes обе формы, оба смысла — самое тонкое в теме", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "He lost a lot of blood не much в утверждении", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Would you like some coffee? исключение на предложение/просьбу", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "There's little chance · There's little we can do тяжёлые фразы для семьи", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Call me anytime any = «любой»", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Have you known him long? ⚠️ know не идёт в Continuous — обошёл ловушку интуитивно", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "📌 Новые фразы", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Фраза Перевод", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Tell me about it. И не говори", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Same here. У нас то же самое", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "I didn't get much either. Я тоже мало что понял", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Is it just me, or...? Это только мне кажется, или...?", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "I nodded a lot. Я много кивал", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "I've done that. Я тоже так делал", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "I'm the one who caves. Это я первый сдаюсь", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "That part I know very well. Вот это мне знакомо", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "It's not just you. Не только у тебя", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "No plans. That's the plan. Никаких планов — в этом и смысл", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Have a good one. Хорошего дня", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Catch you tomorrow. До завтра", "s": "Модуль 4 · Работа/Медицина · урок 23", "u": "lesson-04-23.html", "ti": "Урок 23 (Модуль 4) — 🏫 Мама одноклассницы после собрания (29.08)"}, {"t": "Сцена: воскресенье, вечер. Ты дома — редкий случай, моешь посуду. Maya , дочь, 10 лет, заходит на кухню.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Почему эта сцена: вчера Мишель сказала «Ella asked me why I'm always tired. I didn't have a good answer» — и ты ответил философией про поколения. Восемь дней держится линия «личное → общая формулировка». Ребёнок — единственный собеседник, с которым взрослые уходы не работают .", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "⚠️ Три правила сцены", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "1. Она не примет взрослые уходы. «Это сложно», «такая работа», «вырастешь — поймёшь» = «не хочу говорить».", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "2. Не оправдывайся и не обещай. «Постараюсь приходить раньше» она уже слышала.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "3. Правило недели: дала конкретное — верни конкретное.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "💡 Язык проще. С десятилетней говорят короткими предложениями. Простота ≠ бедность.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "🎬 Полный диалог", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "✅ Что сделал правильно", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Ход Почему важно", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "That's really nice of him не защитился, признал факт", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Не сказал «у меня работа» самый частый уход — прошёл мимо", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Не соврал про «все выздоравливают» главная развилка урока, взята верно", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Не сказал `try` в финале вчерашняя правка сработала", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Согласился сразу без условий и оговорок", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "⚠️ ЛИНИЯ ДНЯ — ЧЕТВЁРТЫЙ РАЗ ЗА ТРИ ДНЯ", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Майя ни разу не задала прямой вопрос до самого конца. Она приносила факты и замолкала. Каждый раз — приглашение поговорить.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Она сказала Ты ответил", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "«Папа Сары забирает её каждый день» предложил решение («хочешь, буду забирать?»)", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "«Я не знала, что сказать про твою работу» вопрос-о-вопросе («хочешь узнать?»)", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "«Они все выздоравливают?» правда ✅, но семь слов и точка", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "📌 Том → инструкция. Мишель → прогноз. Майя → решение.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Три дня, три человека, один механизм: разговор без явной задачи → надо придать ему задачу.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "🔍 Разбор по ходам", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Ход 1 — «Sarah's dad picks her up every day»", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Это не просьба . Это проверка : заметит папа или нет.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "⚠️ `try` ослабляет обещание до того, как оно прозвучало. Ребёнок слышит: «наверное, вряд ли» .", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Ход 2 — «I didn't know what kind of doctor you are»", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "⚠️ Она не знает, чем занимается её отец , и ей было неловко перед подругой. Это стоило ей усилия признать.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "⚠️ Would you like to know that? — формально для десятилетней (так спрашивает лектор) + переложил решение на неё. Она уже сказала, что ей было неловко — это и есть ответ.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "📌 Ключевое — взять на себя. Не «а ты и не спрашивала», а «я не рассказал» . Ей десять, она не обязана была догадаться.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "💡 ICU по-детски: «People come to me when they're so sick the other doctors can't help.» · «I work in the part of the hospital where the sickest people are.»", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Ход 3 — «Do they all get better?» ⭐ самый трудный момент курса", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Она спросила тихо , опустила голову. Вопрос страшный — она уже поняла, что ответ может быть «нет», и проверяет, скажешь ли ты правду .", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "✅ Ты не соврал. Но получила правду без опоры — семь слов и точка.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "📌 Десятилетнему после такого нужно куда встать . Не утешение — понимание, что ты рядом с этим справляешься .", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "💡 Третий вариант — лучший, и вот почему: это ответ и на её ПЕРВЫЙ вопрос тоже. Почему папа поздно приходит и почему уставший — становится понятно без единого слова оправдания.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Ход 4 — финал", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "⚠️ `Why not` = «ну ладно, почему бы и нет». Согласие без энтузиазма (так отвечают на «пойдём выпьем кофе»).", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Майя весь разговор шла к этой фразе. Долго молчала. Дала тебе выход («if you want»). Услышала: папа не против. Не «папа рад».", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "⚠️ `Tuesday` вместо `Thursday` — она сказала четверг. В разговоре это звучит так, будто ты не слушал — в самом конце, после всего. Она поправила одним словом, без обиды.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "⚠️ Yes, I want — после «if you want» английский требует `I do` .", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "📌 Назвать время и место — вот что превращает «да» в обещание.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "💡 Отдельно: тело говорит громче слов", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Ты стоял у раковины весь разговор. С ребёнком сесть, вытереть руки, повернуться — она видит это раньше, чем слышит фразу.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "🔧 Языковые правки", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Do you want me to try picking you up ⛔ try в обещаниях ребёнку — либо делаешь, либо не обещай", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Would you like to know that? Does it bother you? · Do you wish I did that?", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "but not for all not all of them · not everyone · Not always", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "I help them feel better I help them get better (выздороветь)", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Yes, I want Yes, I do. · I'd love to.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "why not ⛔ I'll be there.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "☀️ Из разминки и упражнения", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Разминка", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "you absolutely right You're absolutely right.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "reading the book reading a book · просто reading", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "working on the laptop working on my laptop ( work on the laptop = чинить его 🙂)", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "I have a day off today Another day off today. · the day off (конкретный)", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "💡 «Stayed home, reading, working, watching TV» — список действий, не рассказ. ✅ Stayed home. Finally finished a book I started in March.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "⚡ Блиц 11/12", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "✅ He's lost a lot of blood — Present Perfect , сильнее вчерашнего Past Simple (кровопотеря актуальна сейчас)", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "✅ I nodded a lot, understood maybe half — просил «мало понял», дал сцену вместо оценки", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "🎯 Упражнение «Верни сцену» — 1 из 3", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Реплика Твой ответ", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Коллега: «третий вечер до девяти, жена звонит в отделение проверить, жив ли я» ✅ Same here + 💎 «My wife always says I'm the only doctor in the ICU» — конкретная фраза жены", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Соседка: «сыну 16, перестал со мной разговаривать, не знаю что случилось» ⚠️ Don't worry about it → «у моих было так же» → прогноз «скоро пройдёт»", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Друг: «всё собираюсь позвонить, проходит месяц, я ужасен» ⚠️ Tell me about it ✅ → безличное you («you feel like you're on a racing track»), и не снял с него вину", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "📌 Закономерность: сработало там, где была готовая конкретная фраза (слова жены). Не сработало там, где деталь надо было вспомнить .", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "💡 Практический вывод: не отвечай первой мыслью — первая мысль всегда общая. Секунда паузы, и вспоминается случай.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "💊 Грамматика на запрос: won't / wouldn't = ОТКАЗ, не время", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Will в отрицании часто передаёт ВОЛЮ, упрямство, а не время:", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Форма Смысл", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "He won't come out. не выходит — и это его выбор , упирается", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "He doesn't come out. не выходит — просто факт", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "He didn't come out. не вышел (один раз)", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "He wouldn't come out. не выходил — упирался , сколько ни зови", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "🩺 Очень употребительно в медицине — короче, чем refuses to , и мягче:", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "The patient won't take his meds. · She wouldn't let us examine her. · The family wouldn't agree to intubation.", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "И с вещами («не хочет», как про упрямый предмет):", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "The door won't close. · The IV won't run. · My car wouldn't start this morning. 💎", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "📌 Новые фразы", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Фраза Перевод", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Does it bother you? Тебя это огорчает?", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Do you wish I did that? Ты бы хотела, чтобы я так делал?", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "That's on me — I never told you. Это я виноват, я не рассказал", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "That's my fault, not yours. Это моя вина, не твоя", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Most of them do. Not all of them. Большинство — да. Не все", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "That's the hardest part of my job. Это самое трудное в моей работе", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "I think about it for a long time. Я потом долго об этом думаю", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "I'll be there. Я приду", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "I'd love to. С удовольствием", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "You're not terrible. Да брось ты", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "I'm on a treadmill. Я как белка в колесе", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "It passes. Это проходит", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "the only doctor единственный врач (не single !)", "s": "Модуль 4 · Работа/Медицина · урок 24", "u": "lesson-04-24.html", "ti": "Урок 24 (Модуль 4) — 👨‍👧 «Почему ты никогда не дома» (30.08)"}, {"t": "Сцена: четверг, 15:00. Ты забираешь Майю — как обещал в уроке 24 . Рядом David , отец Ноа из четвёртого класса.", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "⚠️ Ты здесь впервые. Все родители друг друга знают, ты — новое лицо.", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "Задача: small talk на чужой территории + правило недели (дал сцену — верни сцену).", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "🏆 ГЛАВНОЕ: ЛИНИЯ СЛОМАНА БЕЗ НАПОМИНАНИЯ", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "Девять дней подряд на личное шло обобщение. Сегодня — конкретная фраза про свою жену , без ограничения, без подсказки, в живом разговоре .", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "📌 Первый раз за курс.", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "🎬 Полный диалог", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "✅ Сильные ходы", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "Ход Почему", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "Eduard. Nice to meet you. I'm Maya's dad. имя ВПЕРЁД — вчерашняя правка сработала", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "the sickest patients вчерашняя карточка из разговора с дочерью, теперь со взрослым", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "Sometimes she takes it hard 💎💎💎 линия сломана", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "What about you? How are you handling this? мяч вернулся, вопрос точный — он сказал про жену, ты спросил про него", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "Wait, two years? S 08)"}, {"t": "That's the hardest part of my job That's the part that costs the most at home. David говорил про ДОМ, не про работу", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "things improve things got better время", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "Would be nice to get out It'd be nice to get out. потерялось подлежащее", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "hash out the details ⛔ — из переговоров", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "Let's touch base soon ⛔ I'll text you. корпоративный жаргон", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "📌 Контраст в финале: «I'm dying to know» (живое, тёплое) и «touch base» (из рабочей почты) — две фразы в одном абзаце .", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "✍️ Как звучал бы финал", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "Или:", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "📌 Новые фразы", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "Фраза Перевод", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "You're not wrong. Не поспоришь", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "I'm the new guy. Я тут новенький", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "I'm an ICU doctor. Я врач-реаниматолог", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "It never lets up. Не отпускает", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "Feels like it never stops. Ощущение, что это не кончается", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "I'd take that trade some days. Иногда я бы поменялся", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "She takes it hard. Ей это тяжело даётся", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "We talk about it a lot. Мы много об этом говорим", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "Then you already know. Значит, ты и так понимаешь", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "What did you change? Что вы поменяли?", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "Okay, I have to ask. Так, не могу не спросить", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "I'm dying to know. Умираю, как хочу узнать", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "What do you say we grab a pizza? Может, сходим за пиццей?", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "Pizza it is. Значит, пицца", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "I'll text you. Напишу тебе", "s": "Модуль 4 · Работа/Медицина · урок 25", "u": "lesson-04-25.html", "ti": "Урок 25 (Модуль 4) — 🚸 У школьных ворот (31.08)"}, {"t": "Сцена: 16:00, кабинет завотделением. Плановая встреча «о нагрузке». Твоя цель — сказать про сокращение дежурств (репетировал неделю назад в «Скажи это трижды»).", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Поворот: Новак начинает первым — Бергман уходит в октябре, и он просит тебя взять два лишних дежурства . Ты пришёл просить меньше — он просит больше.", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Задачи: деловой регистр · просьба без извинений · конкретика · не отступить .", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "🎬 Полный диалог", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Результат: ты получил декабрь. Он получил октябрь и Каца. Обе стороны с результатом — это и есть хорошие переговоры.", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "🏆 ГЛАВНОЕ — НЕ ОТСТУПИЛ. НИ РАЗУ.", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Четыре круга давления:", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Ход Новака Ответ", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Комплимент + просьба («ты единственный, кому доверяю») сказал «нет» и назвал свою цель ✅", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Вина («две дыры вместо одной») признал его позицию, не сдал свою ✅", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "«Шесть месяцев, это же справедливо?» не согласился на воздух ✅", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "«Ну хотя бы февраль» «I can't do it» ✅", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "📌 Сравни с уроком 19 (тесть): тогда просьба о меньшей нагрузке жила только в репетиции. Сегодня прошла через реальное давление — и выжила.", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "💎 Личная ставка от «я»: «I'll lose my kids and my wife» . Не «work-life balance», не «мы с женой». Двенадцать дней назад это было невозможно.", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "💎 «If I were you, I'd do the same» — признал его позицию, не сдав свою (и чистый Second Conditional).", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "⚠️ Что ослабляло позицию", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Момент Что не так Как надо", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "«I promised that to my wife» отдал решение жене → Новак может «передоговорить» через неё That's my decision. · I'm missing my kids growing up.", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "«This is my final word» ультиматум — захлопывает дверь человеку, с которым работать дальше I can't wait six months. · Six months turns into twelve.", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "«I've got you» = «я тебя прикрою» — могло прозвучать как согласие закрыть дыры! I hear you. · I get it.", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Момент плана Новак попросил цифры → «let's take a look»; план появился со второго захода формула: что даю → до какой даты → что потом", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Дата поплыла «from December I drop» → «December will be the last month» — подарил месяц, отказывая No. December. That's the date. — та же дата теми же словами", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "📌 ОБЩАЯ НИТЬ: позицию держит отлично, а точность формулировок под давлением плывёт — даты, отрепетированные фразы ( cut back не всплыло — сказал decrease ), двусмысленности.", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "✍️ Опорные конструкции переговоров", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Отказ шефу:", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Личная ставка с цифрой (приём Дэвида из урока 25):", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Встречное предложение:", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Ответ на сдвиг даты:", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "🔧 Языковые правки", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "❌ ✅ Почему", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "I'm afraid I have to refuse I can't take them. refuse — ответ на письменный запрос", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Moreover Actually, it's the opposite. письменное слово + «более того» перед «хочу меньше» 🙂", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "decrease my calls cut back on my calls репетировал неделю назад — не всплыло", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "thank you for your trust and the appreciation of my work I appreciate that. I do. тяжеловесно, как из характеристики", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "I think a lot about it I've thought a lot about this процесс позади → Perfect", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "The job never ends There will never be a good month for this. обобщение → конкретика", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "whether you have hired by then whether you've hired someone by then hired просит объект", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "through October... from December + through November I keep my current load ноябрь провис", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "☀️ Утро: блиц 11/12 + грамматика т.18 (дрилл 10/12)", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "✅ Т.17 держится второй день: stopped taking · Remember to check · Try turning · used to working · looking forward to meeting — без единой ошибки.", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "✅ «New day, same shit» — живой casual, регистр чувствует (📌 только со своими!).", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "✅ «The phone didn't stop ringing» — stop+ing применён в жизни, не в дрилле.", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "⚠️ I have some planned meetings during this week → I've got a few meetings lined up this week (planned за существительное; this week БЕЗ предлога).", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "⚠️ Третий раз: arrived вместо was admitted .", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "⚠️ map → chart (map = географическая карта).", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "📌 Новые фразы", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Фраза Перевод", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "I appreciate that. I do. Я это ценю. Правда", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "I can't take them. Я не могу их взять", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Actually, it's the opposite. Вообще-то наоборот", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "That's my decision. Это моё решение", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Here's my proposal. Вот моё предложение", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Here's what I can do. Вот что я могу предложить", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Hire or no hire. Наймёте или нет", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Six months turns into twelve. Полгода превращаются в год", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "Pace yourself. Распределяй силы", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": "Урок 26 (Модуль 4) — 🤝 Переговоры с Dr. Novak: сократить дежурства (01.09)"}, {"t": "I've got a few meetings lined up. Запланировано несколько встреч", "s": "Модуль 4 · Работа/Медицина · урок 26", "u": "lesson-04-26.html", "ti": ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "You've got a point. В этом есть смысл = частично согласен", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Good point. Дельное замечание ✅ уже знаешь", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "I'm fine with that. / Works for me. Меня устраивает", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Same here. / Me too. Я тоже Same here — на любую фразу; Me too — только на «I + глагол»", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Why not? Почему бы и нет", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Let's do it. Давай сделаем", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Go for it! Дерзай! Вперёд!", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "2. Несогласие, сомнение, отказ", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Фраза Перевод ⚠️ Нюанс", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Not really. Не совсем / Да не особо мягкое «нет»", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "I doubt it. Сомневаюсь", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "I don't think so. Не думаю", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "I'm not sure. Я не уверен", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "No chance. / Not a chance. Ни за что / Без шансов", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "No way! Да ладно! / Ни за что! 💡 два значения : удивление ИЛИ категорический отказ", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Whatever. Да как угодно / Пофиг ⚠️ часто звучит грубо — «мне всё равно, отстань». С коллегами лучше не надо", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Give me a break. Ну хватит / Да брось ⚠️ раздражение, не нейтральное", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Come on! Да ладно! / Ну же! недоверие или подбадривание", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "3. Реакция на новость", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Фраза Перевод ⚠️ Нюанс", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "What's up? Как дела? / Что случилось? очень неформально; ответ обычно «Not much»", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson
