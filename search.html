ок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "I'm calling about my appointment. — «Я звоню по поводу...» — формула цели звонка: I'm calling about... / I'm calling to confirm...", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "I'd like to make an appointment with Dr. Smith. — «Хочу записаться на приём» — запись = make an appointment", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Could you put me through to the billing department? — «Соедините меня с...» — put through = соединить", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Во время разговора", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Hold on a second. / Please hold. — «Подождите секунду» / «Оставайтесь на линии» — вам скажут: Thanks for holding!", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Sorry, you're breaking up. — «Вы прерываетесь» — плохая связь!", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "The line is really bad. Could you speak up? — «Связь плохая, погромче» — знакомая фраза в новом месте", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Could you spell that for me? — имена и адреса по телефону ВСЕГДА по буквам: E as in Echo...", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Если человека нет", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Could I leave a message? — «Можно оставить сообщение?»", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Could you tell him I called? — «Передайте, что я звонил»", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Could he call me back? My number is... — «Пусть перезвонит» — call back = перезвонить", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Sorry, I think you've got the wrong number. — «Вы ошиблись номером» (или вам так скажут 🙂)", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Дела и записи", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "I'm calling to confirm / cancel / reschedule my appointment. — подтвердить / отменить / перенести — три глагола, которые экономят часы!", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "What are your hours? — «Какой у вас график работы?» — или: When are you open?", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Мини-диалог (запись к врачу)", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Ловушки для русскоговорящих", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "«Это Алекс» = This is Alex — сказать I am Alex по телефону — как представиться по паспорту 🙂 А «это я» = Speaking!", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Номера телефонов диктуют по одной цифре: 212-555-0134 = two-one-two, five-five-five, oh-one-three-four . 0 = «oh» (или zero), сдвоенные цифры = double five .", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "call back = перезвонить, hang up = положить трубку, hang on = подождать. Не путать hang up и hang on — одна буква, а бросили трубку 😄", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Время: 2:15 = two fifteen или quarter past two ; 2:30 = half past two ; 2:45 = quarter to three . И всегда переспрашивайте: Did you say 2:15 or 2:50?", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Задание", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Прочитайте фразы вслух 2 раза, диалог — 3 раза.", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Напишите «диалог» — телефонный квест: позвоните в клинику записаться к врачу. Я — регистратор. Внимание: связь будет прерываться, имя попросят по буквам, а время назовут неразборчиво. Всё как в жизни! 📞", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Тема: ты дозвонился и записался (урок 11) — теперь пришёл на приём. Это один из самых важных навыков за границей: объяснить, что болит, понять врача и не растеряться. Хорошая новость — тут тоже есть каркас из шаблонов.", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Фразы дня", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Что случилось (жалоба)", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "I have a headache / a sore throat / a stomachache. — «У меня болит голова / горло / живот» — формула I have a + недомогание. ⚠️ болезни через have , НЕ my head hurts me !", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "My back hurts. / It hurts here. — «Спина болит» / «Болит здесь» — hurt = болеть (о части тела). Без me : НЕ it hurts me , просто it hurts .", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "I've had a cough for three days. — «Кашель уже три дня» — сколько длится: for + срок (знакомый Present Perfect из урока 3!).", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "I feel dizzy / nauseous / weak. — «Кружится голова / тошнит / слабость» — состояние через I feel + прилагательное.", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Детали (врач спросит)", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "It started a few days ago. — «Началось пару дней назад» — когда началось.", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "It's a sharp / dull pain. — «Острая / тупая боль» — какая боль. ⚠️ Два верных варианта: It's sharp (прилагательное, без a ) ИЛИ It's a sharp pain (с существительным). Не смешивать в « It's a sharp »!", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "И само слово pain с местом — без артикля : chest pain, back pain, joint pain (не a chest pain ). А headache / stomachache — уже готовые существительные, с a .", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "On a scale of one to ten, it's about a seven. — «По шкале от 1 до 10 — где-то 7» — врачи реально так спрашивают!", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "I'm allergic to penicillin. — «У меня аллергия на пенициллин» — жизненно важная фраза (уже знаешь allergic to из ресторана!).", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Лечение и аптека", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Do I need a prescription for this? — «Нужен рецепт на это?» — prescription = рецепт (на лекарство).", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Do I have to take any medication? — «Обязательно ли принимать лекарство?» — have to = быть обязанным. ⚠️ НЕ «Is it must to take...» — must без глагола не стоит!", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "How often should I take it? — «Как часто это принимать?» — take лекарство (не drink !).", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Are there any side effects? — «Есть побочные эффекты?»", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Can I get something over the counter? — «Можно что-то без рецепта?» — over the counter = безрецептурное.", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Do you think I'll need it for long? — «Думаете, это надолго?» — ⚠️ полное предложение с глаголом: I'll need it (не « Do you think that it for a long time » — глагол выпадать не должен!).", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Мини-диалог (на приёме)", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Ловушки для русскоговорящих", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "«У меня болит голова» ≠ My head hurts me — по-английски либо I have a headache , либо My head hurts (БЕЗ me !). Hurt уже значит «причинять боль», добавлять me не нужно.", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "take, не drink — лекарства take (принимают), даже если это сироп или капли. Drink medicine — калька, звучит странно.", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "a headache / a fever — с артиклем a ! I have a headache , a fever , a cough . Но: I feel sick / dizzy — тут прилагательное, без артикля.", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "sick vs ill — в США чаще sick (I feel sick = мне плохо / тошнит). Но осторожно: I'm sick = болею; в британском sick = тошнит. Контекст!", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "prescription (рецепт на лекарство) ≠ recipe (кулинарный рецепт)! — классическая ловушка. Врач даёт prescription , а recipe — это как приготовить борщ 🥣.", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Разбор диалога 18.07 — твои поправки (оценка 4,5/5)", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Диалог «боль в груди» прошёл сильно: живая спонтанная речь, I've had...for three days , it hurts when I breathe , allergic to penicillin , сборка recommend Ø + over the counter , идеальное закрытие ( by the way + I appreciate it + nearest pharmacy ). Вот что доработать:", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Было у тебя Правильно Почему", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "I have a chest pain I have chest pain pain с местом — без артикля", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "It's a sharp It's sharp (или It's a sharp pain ) к прилагательному a не цепляется — не смешивать (гибрид!)", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "I forgot to notice I forgot to mention notice = заметить; mention = упомянуть в разговоре", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Is it must to take...? Do I have to take...? must без глагола не стоит; have to = обязан", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Do you think that it for a long time? Do you think I'll need it for long? 🔴 ВЫПАЛ ГЛАГОЛ — твоя системная тема (ср. «I swamped»)", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "I was wondering about my heart (тревога) I was worried about my heart wondering = «мне интересно»; worried = тревога", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "🔴 Главное на завтра: выпадающий глагол. Русский разрешает «Думаете, это надолго?» без глагола — английский требует I'll need it . Тот же почерк, что I'm swamped , everything is expensive . Правило: в каждом английском предложении обязан быть глагол.", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "📝 Новые полезные слова из диалога: related (связанный: Is it related? ), worried (встревоженный), mention (упомянуть).", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Задание", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Прочитай фразы вслух 2 раза, диалог — 3 раза.", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Напиши «диалог»: ты на приёме у врача за границей. Я — доктор. Тебя что-то беспокоит (выбери сам или я подкину симптом), я буду расспрашивать про детали, аллергии и назначу лечение. Твоя цель — объяснить проблему и всё понять про лекарство. 🩺", "s": "Модуль 3 · Быт за границей · урок 12", "u": "lesson-03-12.html", "ti": "Урок 12 — У врача (Модуль 3 «Быт за границей»)"}, {"t": "Тема: снять наличные, обменять валюту, разобраться с картой, которую «съел» банкомат или заблокировал банк. Деньги за границей — стресс, но язык тут снова шаблонный. Выучи каркас — и не растеряешься у окошка.", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "Фразы дня", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "Обмен и снятие", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "I'd like to exchange some money. — «Хочу обменять деньги» — exchange = обмен валюты. Курс = exchange rate .", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "What's the exchange rate for dollars? — «Какой курс доллара?» — важный вопрос перед обменом.", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "Is there a fee for that? — «Есть ли комиссия?\" — ⚠️ fee = комиссия/сбор (не tax , не price !). Жизненно важный вопрос в банке.", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "Where's the nearest ATM? — «Где ближайший банкомат?» — ATM /эй-ти-эм/ = банкомат (в Британии cash machine ).", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "Проблемы с картой 💳", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "My card was declined. — «Мою карту отклонили» — declined = отклонена (частая ситуация за границей).", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "The ATM ate my card. — «Банкомат съел мою карту» — да, так и говорят ( ate / swallowed )!", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "I think my card is blocked. — «Кажется, карту заблокировали»", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "Could you check my balance? — «Проверьте баланс, пожалуйста»", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "В банке (у окошка)", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "I'd like to open an account. — «Хочу открыть счёт» — account /экАунт/ = счёт.", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "Do I need an appointment? — «Нужна ли запись?\" — знакомое appointment из урока 11!", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "Could you break a hundred? — «Разменяете сотню?» — break = разменять крупную купюру. Или: Can you give me smaller bills?", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "In small bills, please. — «Мелкими купюрами, пожалуйста» — bills = купюры (US), coins = монеты.", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "Мини-диалог (обмен валюты + проблема с картой)", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "Ловушки для русскоговорящих", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "fee ≠ tax ≠ fine. Fee = комиссия/сбор (за услугу); tax = налог; fine = штраф. В банке спрашивай про fee : Is there a fee?", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "account /экАунт/ — ударение на второй слог, «к» чёткое. Счёт в банке = account , счёт в ресторане = check/bill (не путать!).", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "bill = и купюра, и счёт. A ten-dollar bill = купюра 10$; the bill в отеле = счёт. Контекст решает.", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "«Снять деньги» = withdraw / take out , не remove . I'd like to withdraw 200 dollars. «Положить» = deposit .", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "cash ≠ гроши. Cash = наличные: Can I pay in cash? Карта = card , безнал = by card .", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "Задание", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "Прочитай фразы вслух 2 раза, диалог — 3 раза.", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "Напиши «диалог»: ты в банке за границей. Я — сотрудник. Тебе надо обменять валюту и разобраться с картой, которую заблокировали (или банкомат съел!). Спрашивай про курс, комиссию и проси мелкие купюры. 💳", "s": "Модуль 3 · Быт за границей · урок 13", "u": "lesson-03-13.html", "ti": "Урок 13 — Банк и деньги (Модуль 3 «Быт за границей»)"}, {"t": "Тема: снять квартиру надолго (не отель!) и решать бытовые проблемы — потёк кран, сломался замок, шумные соседи. Отличие от урока 7 (отель): тут ты арендатор (tenant), у тебя договор (lease), а чинит всё арендодатель (landlord).", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "Фразы дня", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "Поиск и договор", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "I'm looking for a one-bedroom apartment. — «Ищу однокомнатную квартиру» — ⚠️ one-bedroom = одна спальня (+ гостиная). US: apartment , UK: flat .", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "How much is the rent per month? — «Сколько аренда в месяц?» — rent = арендная плата; per month = в месяц.", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "Are utilities included? — «Коммунальные включены?» — utilities /ютИлитиз/ = вода, свет, газ. Ключевой вопрос!", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "Is there a deposit? — «Есть залог?» — deposit = залог (вернут при выезде); lease = договор аренды.", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "How long is the lease? — «На какой срок договор?» — обычно a one-year lease .", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "Бытовые проблемы 🔧", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "The sink is leaking. — «Кран/раковина течёт» — leak = протекать. Шаблон проблемы: The [X] is leaking / is broken / won't work .", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "The toilet is clogged. — «Туалет засорился» — clogged = засорён.", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "The heating is broken. — «Отопление сломано» — heating = отопление; AC = кондиционер.", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "Could you send someone to fix it? — «Пришлите кого-нибудь починить» — знакомо из отеля! Мастер = a plumber (сантехник), an electrician (электрик).", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "There's a leak in the ceiling. — «Течёт с потолка» — ceiling /сИлинг/ = потолок.", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "Общение с арендодателем", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "When can you come by? — «Когда сможете зайти?» — come by = заглянуть, зайти.", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "It's urgent. — «Это срочно» — когда нельзя ждать (потоп!). urgent /Ёрджент/.", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "Could you give me a hand with...? — «Поможете мне с...?» — give a hand = помочь (идиома).", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "Мини-диалог (проблема в квартире)", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "Ловушки для русскоговорящих", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "rent = и «аренда», и «арендовать». The rent is high (сущ.) / I want to rent (глагол). А «сдавать» (со стороны хозяина) = rent out .", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "landlord ≠ хозяин по имени. Landlord = арендодатель (муж.), landlady (жен.). Обращаться можно просто по имени.", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "apartment (US) vs flat (UK). Оба поймут, но начни с американского. «Студия» = a studio .", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "leak /лик/ ≠ lick /лик/! Leak = протечка; lick = лизать 😄. Гласный длиннее в leak .", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "«Срочно» = urgent (не urgently как наречие в этой фразе): It's urgent. А «в срочном порядке» = as soon as possible / ASAP .", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "Задание", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "Прочитай фразы вслух 2 раза, диалог — 3 раза.", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "Напиши «диалог»: у тебя в съёмной квартире что-то сломалось (выбери — потёк кран, сломалось отопление, засорился туалет). Я — арендодатель. Объясни проблему, скажи что это срочно, договорись когда придёт мастер. 🔧", "s": "Модуль 3 · Быт за границей · урок 14", "u": "lesson-03-14.html", "ti": "Урок 14 — Аренда жилья и бытовые проблемы (Модуль 3 «Быт за границей»)"}, {"t": "Тема: самый нужный урок «на всякий случай»: потерял кошелёк, украли телефон, что-то случилось, нужна помощь или полиция. Дай бог не пригодится — но если пригодится, эти фразы бесценны. Финал Модуля 3!", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "Фразы дня", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "Потеря и кража", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "I lost my wallet / passport. — «Я потерял кошелёк / паспорт» — lost (потерял, случайно) ≠ stolen (украли).", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "My phone was stolen. — «У меня украли телефон» — ⚠️ пассив: was stolen (кем-то). Не someone stole в панике — короче и понятнее.", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "I need to report it. — «Мне нужно заявить об этом» — report = сообщить/заявить (в полицию).", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "Where's the nearest police station? — «Где ближайший полицейский участок?»", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "Просьба о помощи 🆘", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "Can you help me? It's an emergency. — «Помогите! Это срочный/экстренный случай» — emergency /имЁрдженси/ = ЧП.", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "Call an ambulance! — «Вызовите скорую!» — ambulance = скорая; the fire department = пожарные; the police = полиция.", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "Someone just took my bag! — «Кто-то только что схватил мою сумку!» — в моменте.", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "I don't feel safe here. — «Мне тут небезопасно» — важно уметь сказать прямо.", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "В полиции / после", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "I'd like to file a police report. — «Хочу подать заявление» — file a report = оформить заявление (нужно для страховки!).", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "It happened about an hour ago, near the station. — «Это случилось час назад, у вокзала» — когда и где.", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "Here's my ID. — «Вот мои документы» — ID /ай-ди/ = удостоверение личности.", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "Could you help me contact my embassy? — «Помогите связаться с посольством» — embassy /Эмбаси/ = посольство (если потерян паспорт).", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "Мини-диалог (потеря телефона)", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "Ловушки для русскоговорящих", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "lost vs stolen. I lost it = сам потерял (моя оплошность); It was stolen = украли (чужая вина). Полиция спросит именно это различие!", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "«Украли» — через пассив. My phone was stolen звучит естественнее и спокойнее, чем Someone stole my phone . В стрессе — короче лучше.", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "emergency /имЁрдженси/ — ударение на второй слог. Телефон экстренных служб в США — 911 , в Европе — 112 .", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "report ≠ рапорт. To report = заявить/сообщить; a (police) report = заявление/протокол. Не «репорт».", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "embassy (посольство) ≠ consulate (консульство) — оба помогут с паспортом, но посольство — главное представительство.", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "Задание", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "Прочитай фразы вслух 2 раза, диалог — 3 раза.", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "Напиши «диалог»: с тобой в чужом городе случилась неприятность (выбери — украли телефон/кошелёк, потерял паспорт, нужна помощь). Сначала я — прохожий, потом — полицейский. Объясни что случилось, попроси помощь, подай заявление. 🆘", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "📌 Это последний урок Модуля 3. Следующий шаг — экзамен модуля : одна большая история, где все ситуации «быта за границей» (телефон, врач, банк, аренда, ЧП) сплетаются в один день. После экзамена решим про повышение сложности.", "s": "Модуль 3 · Быт за границей · урок 15", "u": "lesson-03-15.html", "ti": "Урок 15 — Проблемные ситуации и экстренные случаи (Модуль 3 «Быт за границей»)"}, {"t": "Формат: новый — без «фраз дня» заранее, диалог вслепую, разбор в конце. Три трека: звучать как носитель, рабочие темы, аудирование.", "s": "Модуль 4 · Работа/Медицина · урок 1", "u": "lesson-04-01.html", "ti": "Урок 1 (Модуль 4 «Работа») — Переговоры и несогласие на работе"}, {"t": "Сцена (23.07): менеджер Dave предлагает сдвинуть дедлайн проекта. Задача — понять его (быстрая casual речь), не согласиться с частью плана и предложить конкретную альтернативу. Оценка 4/5 .", "s": "Модуль 4 · Работа/Медицина · урок 1", "u": "lesson-04-01.html", "ti": "Урок 1 (Модуль 4 «Работа») — Переговоры и несогласие на работе"}, {"t": "Разбор диалога — было → правильно → почему", "s": "Модуль 4 · Работа/Медицина · урок 1", "u": "lesson-04-01.html", "ti": "Урок 1 (Модуль 4 «Работа») — Переговоры и несогласие на работе"}, {"t": "Было у тебя Правильно Почему", "s": "Модуль 4 · Работа/Медицина · урок 1", "u": "lesson-04-01.html", "ti": "Урок 1 (Модуль 4 «Работа») — Переговоры и несогласие на работе"}, {"t": "I couldn't be agree more I couldn't agree more agree — глагол, be лишний (старая тема Модуля 1!)", "s": "Модуль 4 · Работа/Медицина · урок 1", "u": "lesson-04-01.html", "ti": "Урок 1 (Модуль 4 «Работа») — Переговоры и несогласие на работе"}, {"t": "to hold on the project to put the project on hold hold on = подождать; «поставить на паузу» = put on hold", "s": "Модуль 4 · Работа/Медицина · урок 1", "u": "lesson-04-01.html", "ti": "Урок 1 (Модуль 4 «Работа») — Переговоры и несогласие на работе"}, {"t": "if we 'll push now if we push now после if — без will (Present Simple)", "s": "Модуль 4 · Работа/Медицина · урок 1", "u": "lesson-04-01.html", "ti": "Урок 1 (Модуль 4 «Работа») — Переговоры и несогласие на работе"}, {"t": "all the project will be on the risk the whole project will be at risk at risk — устойчивое, без the", "s": "Модуль 4 · Работа/Медицина · урок 1", "u": "lesson-04-01.html", "ti": "Урок 1 (Модуль 4 «Работа») — Переговоры и несогласие на работе"}, {"t": "I offer an emergency meeting I suggest / propose a meeting offer = дать вещь/услугу; предложить идею = suggest", "s": "Модуль 4 · Работа/Медицина · урок 1", "u": "lesson-04-01.html", "ti": "Урок 1 (Модуль 4 «Работа») — Переговоры и несогласие на работе"}, {"t": "is the best thing we can do it's the best thing / that's the best move выпал subject (та самая тема выпадающих слов!)", "s": "Модуль 4 · Работа/Медицина · урок 1", "u": "lesson-04-01.html", "ti": "Урок 1 (Модуль 4 «Работа») — Переговоры и несогласие на работе"}, {"t": "Does it work for you? Does that work for you? о только что сказанном — that , не it", "s": "Модуль 4 · Работа/Медицина · урок 1", "u": "lesson-04-01.html", "ti": "Урок 1 (Модуль 4 «Работа») — Переговоры и несогласие на работе"}, {"t": "Native-варианты (звучать естественнее) 🗣️", "s": "Модуль 4 · Работа/Медицина · урок 1", "u": "lesson-04-01.html", "ti": "Урок 1 (Модуль 4 «Работа») — Переговоры и несогласие на работе"}, {"t": "Ты сказал (верно) Носитель скажет живее", "s": "Модуль 4 · Работа/Медицина · урок 1", "u": "lesson-04-01.html", "ti": "Урок 1 (Модуль 4 «Работа») — Переговоры и несогласие на работе"}, {"t": "From my perspective, it's the best thing Honestly, I think it's the best move right now", "s": "Модуль 4 · Работа/Медицина · урок 1", "u": "lesson-04-01.html", "ti": "Урок 1 (Модуль 4 «Рабо а») — Передача смены / обсуждение пациента с коллегой-врачом"}, {"t": "What's your take on this? — твоё мнение? · My main concern is... — главное опасение", "s": "Модуль 4 · Работа/Медицина · урок 4", "u": "lesson-04-04.html", "ti": "Урок 4 (Модуль 4 «Работа») — Передача смены / обсуждение пациента с коллегой-врачом"}, {"t": "to be on the same page — единое понимание · to loop in / to consult — подключить/консультировать", "s": "Модуль 4 · Работа/Медицина · урок 4", "u": "lesson-04-04.html", "ti": "Урок 4 (Модуль 4 «Работа») — Передача смены / обсуждение пациента с коллегой-врачом"}, {"t": "DNR (Do Not Resuscitate) — не реанимировать · to update the family — информировать семью", "s": "Модуль 4 · Работа/Медицина · урок 4", "u": "lesson-04-04.html", "ti": "Урок 4 (Модуль 4 «Работа») — Передача смены / обсуждение пациента с коллегой-врачом"}, {"t": "to bump up — увеличить (casual) · obs (observations) — наблюдение/мониторинг", "s": "Модуль 4 · Работа/Медицина · урок 4", "u": "lesson-04-04.html", "ti": "Урок 4 (Модуль 4 «Работа») — Передача смены / обсуждение пациента с коллегой-врачом"}, {"t": "Что отработать", "s": "Модуль 4 · Работа/Медицина · урок 4", "u": "lesson-04-04.html", "ti": "Урок 4 (Модуль 4 «Работа») — Передача смены / обсуждение пациента с коллегой-врачом"}, {"t": "🔴 не терять is : he is ventilated, condition is getting worse (системное!)", "s": "Модуль 4 · Работа/Медицина · урок 4", "u": "lesson-04-04.html", "ti": "Урок 4 (Модуль 4 «Работа») — Передача смены / обсуждение пациента с коллегой-врачом"}, {"t": "start someone on a drug · think of taking · fingers crossed", "s": "Модуль 4 · Работа/Медицина · урок 4", "u": "lesson-04-04.html", "ti": "Урок 4 (Модуль 4 «Работа») — Передача смены / обсуждение пациента с коллегой-врачом"}, {"t": "Native: intubated/on sedation, escalate pressors, My main concern is", "s": "Модуль 4 · Работа/Медицина · урок 4", "u": "lesson-04-04.html", "ti": "Урок 4 (Модуль 4 «Работа») — Передача смены / обсуждение пациента с коллегой-врачом"}, {"t": "Формат: гибрид. По специальности студента. Ключевое отличие от урока 4: с пациентом — ПРОСТОЙ язык + эмпатия, не жаргон.", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Сцена (25.07): пациент с болью в груди, встревожен («боюсь, это сердце»). Расспрос, успокоение, объяснение плана (ЭКГ), исключить инфаркт. Оценка 4,5/5 .", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Мини-подготовка (опора урока)", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "What brings you in today? — что вас беспокоит?", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Can you describe the pain? Is it sharp or dull? — опишите боль", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "On a scale of one to ten, how bad is it? — по шкале 1–10", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "I'm going to examine you now. — сейчас осмотрю", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "We need to run some tests. — нужны анализы (run tests)", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "There's nothing to worry about. — не о чем беспокоиться", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Do you have any questions for me? — есть вопросы?", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Разбор диалога — было → правильно → почему", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Было у тебя Правильно Почему", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Is it started after effort? Did it start after effort? вопрос past simple: Did + инфинитив", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "we'll make an ECG we'll do / run an ECG тест do/run, не make", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "The results are immediately are immediate / come immediately immediate = прилаг.; immediately = наречие", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "before we 'll move before we move после before — present, без will", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "🟢 Прогресс: выпадающий is сегодня почти не всплывал — вчерашняя отработка сработала. Ошибки стали тонкими (вопросы в прошедшем, immediate/immediately), не системными.", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Native — общение с пациентом 🗣️", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Ты сказал (верно) Носитель-врач скажет", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "There are many causes of chest pain Chest pain can have many causes", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "muscle cramps, breathing a muscle strain, acid reflux, or anxiety (несердечные причины)", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "The results are immediately The results come right away / are immediate", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Трофеи: you did the right thing to come here (эмпатия!), объяснил ЭКГ простым языком (stickers, electrical activity), run some tests + my main concern + rule out (вчерашний словарь!), переспрос-подтверждение.", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "📚 Словарь темы «разговор с пациентом» (для твоей работы)", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Расспрос (history taking) — простым языком", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "What brings you in? — что беспокоит? · When did it start? — когда началось?", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Does anything make it better or worse? — что облегчает/усиливает? · Have you had this before? — было раньше?", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Any allergies / medications? — аллергии / лекарства? · to run in the family — быть наследственным", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Осмотр и тесты — объяснять просто", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "I'm going to examine you. — я вас осмотрю · Take a deep breath. — глубокий вдох", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "We need to run some tests / bloodwork. — анализы · an ECG / X-ray / scan — ЭКГ/рентген/скан", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "The results come back / take about an hour. — результаты будут через... · to rule out — исключить", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Успокоить и объяснить (эмпатия)", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "There's nothing to worry about. / Try not to worry. — не переживайте", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "You did the right thing coming in. — правильно, что пришли · Let me explain what's going on. — объясню", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "It's very common / treatable. — частое / лечится · We'll take good care of you. — мы вами займёмся", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "in plain terms — простыми словами (vs жаргон)", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Плохие/серьёзные новости (тактично)", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "I'm afraid the results show... — к сожалению, результаты показывают · I know this is a lot to take in. — понимаю, это много", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Do you have any questions for me? — есть вопросы? · We'll go through this together. — разберёмся вместе", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Что отработать", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "вопросы past simple: Did it start? (не Is it started) · тест do/run (не make)", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "immediate (прилаг.) / immediately (наречие) · after before → present", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Native: chest pain can have many causes, acid reflux, come right away", "s": "Модуль 4 · Работа/Медицина · урок 5", "u": "lesson-04-05.html", "ti": "Урок 5 (Модуль 4 «Работа») — Разговор с пациентом"}, {"t": "Формат: гибрид. Прямо цель студента — интервью на позицию врача-реаниматолога.", "s": "Модуль 4 · Работа/Медицина · урок 6", "u": "lesson-04-06.html", "ti": "Урок 6 (Модуль 4 «Работа») — Медицинское собеседование в клинику"}, {"t": "Сцена (26.07): собеседование с Dr. Novak (мед. директор ICU). Само-презентация, презентация сложного случая (септический шок → VA-ECMO → выписка), мотивация + 5 лет. Оценка 4,5/5 — сильнейшее интервью!", "s": "Модуль 4 · Работа/Медицина · урок 6", "u": "lesson-04-06.html", "ti": "Урок 6 (Модуль 4 «Работа») — Медицинское собеседование в клинику"}, Сцена: мистер Alvarez, 71, ИТ 9 дней, тяжёлый инсульт, ИВЛ, прогноз плохой. Встреча о смене цели лечения.", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "Семья: Carmen — дочь, юрист, настроена агрессивно, гуглила протоколы. Luis — сын, молчит, растерян.", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "Задача урока: удержать эмпатию под давлением . Не защищаться, не уходить в терминологию.", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "🎬 Полный диалог — как он прошёл", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "✍️ Тот же диалог — как сказал бы носитель", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "⚠️ Три ошибки, которые меняют смысл", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "Сказал Что услышала семья ✅ Надо", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "He is not a pain. «Обещаю, ваш отец не зануда» 😳 He is not in pain. · He's not suffering.", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "It looks good, but it's a worse sign. «движение отца = плохой знак» (это неправда — рефлекс нейтрален) I know it looks like a good sign. I wish I could tell you it was.", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "Not every protocol from Google may fit your father. «вы дилетантка, начитались интернета» I'm glad you looked into it — that tells me how much you're fighting for him.", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "💡 in pain — запомнить навсегда. a pain = «заноза, достал».", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "🎯 Три системные находки", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "1. Купил время исследованиями", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "Под давлением Carmen назначил невролога и КТ. Для семьи это читается однозначно: «значит, не всё потеряно, ждём результатов» . Разговор отодвинут на три дня, дана ложная надежда.", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "Классическая ловушка family meeting: под напором семьи врач начинает покупать время назначениями .", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "2. Переложил решение на семью", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "Объяснил опции и оставил выбирать. Семья уйдёт с чувством, что они отключили отца.", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "3. Дважды забыл про Luis", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "Молчащий сын — и когда он впервые заговорил («I saw it too»), реакции не было. В реальной family meeting молчащий родственник опаснее кричащего: не спорит сейчас, но не согласен потом.", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "✅ Что сработало отлично", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "Ход Почему сработал", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "I hear you, Carmen. признание перед объяснением, точно вовремя", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "You didn't imagine it. не стал отрицать увиденное — спасло доверие", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "I saw the same thing on my exam this morning. встал на их сторону фактом, а не утешением", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "You can take his files for a second opinion. снимает подозрение в укрывательстве лучше любых слов", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "If I were you, I'd do the same. лучший ответ на её извинение — снимает вину", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family
