"🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's a million-dollar question. — Вопрос на миллион", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I had no idea. — Я понятия не имел", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Does that work? — Тебя устроит?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's what I can do right now. — Это всё, что я могу сейчас", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It's 2026, not 2005. — Сейчас 2026-й (⚠️ НЕ \"we are in 2026\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Yeah... maybe it is. — Да... возможно (мягкий ответ на горькое признание)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Somebody's got to. — Кто-то же должен (подхват шутки)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to put off — отложить (= postpone)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to put up with — терпеть, мириться (= tolerate)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to look into — разобраться, изучить (= investigate)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to go over / go through — просмотреть, пройтись по (= review)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to go downhill — ухудшаться (= deteriorate, но живее)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to come around / come to — прийти в себя после наркоза", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to pass out — потерять сознание", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to pick up an infection — подхватить инфекцию", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to follow up — наблюдать в динамике", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to back off on the pressors — снизить дозу вазопрессоров", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to keep an eye on — приглядывать за", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to cut back on — сократить, урезать", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to sort out — уладить, разрулить", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Let's rule it out. — Исключим это (местоимение — ТОЛЬКО в середину!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I was on call. — Я был на дежурстве (⚠️ НЕ \"on call duty\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I didn't get any calls. — Мне не звонили (отрицание + any)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "the Q-word (quiet) — «тихая смена» — плохая примета в ICU 😄", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I think you're wrong on this one. — Думаю, тут ты неправ (не \"out of line\"!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's not how it works. — Это так не работает", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Let me get back to you tomorrow. — Вернусь к тебе завтра с ответом", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "a time-limited trial — терапия с оговорённым сроком (снимает страх «навсегда»)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "an advance directive — предварительное распоряжение пациента", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to come off the tube — сняться с ИВЛ", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's your call. — Это ваше решение (⚠️ НЕ \"it's fair enough\"!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "What's behind the \"no\"? — Что стоит за отказом?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm not going to give you the speech. — Я не буду читать вам лекцию", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "You've clearly thought about it. — Вы явно всё обдумали", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "This is fixable. — Это поправимо", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "can turn this around — может переломить ситуацию", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Now it makes sense. — Теперь понятно (не \"now I see a whole picture\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to talk someone out of something — отговорить кого-то", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm asking you. — Я спрашиваю вас (прямой ответ на прямой вопрос)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Yes. Even if I think you're wrong. — Да. Даже если я считаю иначе (об автономии)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Whatever you decide, I'll respect it. — Что бы вы ни решили, я приму (не \"every your decision\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I didn't know your father. — Я не знал вашего отца (⚠️ НЕ \"your father's case\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "You have no idea. — Ты не представляешь", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I owe you one. / big time. — Я твой должник", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "You're a lifesaver. — Ты меня спас", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I just wanted to say thanks. — Хотел сказать спасибо (НЕ \"say you thanks\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to go out for dinner — пойти поужинать", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "We had a good time. — Хорошо провели время (⚠️ НЕ голое \"we enjoyed\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to go to bed ≠ to fall asleep — лечь спать ≠ заснуть", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "just the usual — как обычно", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to deal with — справиться, разобраться (≠ put up with!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to cope with — справляться с нагрузкой", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "as head of (без артикля) — в должности главы — after \"as\" должность без артикля", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "the ICU / the OR / the ER — места — всегда THE", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Sepsis is dangerous. — явление вообще — без артикля", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "The sepsis resolved. — тот самый, у этого пациента — THE", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "how important it is — ⚠️ НЕ \"how it is important\" (вопрос внутри)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "a good chance OF helping — шанс помочь (предлог of, не to)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "You're not wrong. — Ты не то чтобы неправ (согласие с зазором)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's the part that scares me. — Вот это меня и пугает (на чужое сожаление)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Something's got to give. — Чем-то приходится жертвовать", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "You can't have it all. — Всего сразу не бывает", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'll drink to that. — За это выпью (ответ на тост)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's rough. — Тяжело (сочувствие, коротко)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Show me the machine that does that. — Покажи мне машину, которая это умеет", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It's not going anywhere. — Никуда это не денется", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to sleep in — поспать подольше", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to catch up (with someone) — пообщаться, обменяться новостями", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Everything checked out fine. — Всё в порядке (проверка прошла успешно)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I've made up my mind. — Я принял решение", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I get where you're coming from. — Понимаю твою логику", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I didn't get home until... — Я попал домой только в...", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm missing out on a lot. — Я многое упускаю", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "⚠️ I couldn't agree more — ТОЛЬКО энтузиазм! НЕ на чужую боль (4 промаха!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He told me / He said — tell SOMEONE / say something (⚠️ НЕ \"said me\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "She asked if I had checked. — Косвенный вопрос: if + прямой порядок, БЕЗ кавычек", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He said he would call me. — will → would в косвенной речи", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "They said they had started. — past → had + V3 в косвенной речи", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "tomorrow → the next day — указатели времени в косвенной речи", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "The patient is refusing the tube. — Пациент отказывается (актив! не \"was refused\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to come up (a topic) — всплывать, подниматься (о теме)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I shouldn't have transferred him. — Не надо было переводить (should have + V3!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'd push back on one thing. — Тут я поспорю (не \"let me disagree\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I see it a bit differently. — Я вижу это немного иначе", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's on me, not on them. — Это моя вина, не их", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's a pattern, not a one-off. — Это система, а не единичный случай", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "My door is open. Always. — Моя дверь всегда открыта", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'd rather be woken up for nothing. — Лучше разбудите зря, чем пропустим", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Thanks for coming to me. — Спасибо, что подошла (не \"I appreciate your openness\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's the harder part to hear. — Вот это слышать труднее", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "They take their cue from you. — Они берут с тебя пример", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to get waved through — пройти без возражений, «махнули рукой»", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "For what it's worth... — Как бы то ни было / если это важно", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Life is passing me by. — Жизнь проходит мимо", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It's been eating at me. — Это меня грызёт", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to recharge — перезарядиться, восстановиться", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "take it from there — дальше по ситуации", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It would make a real difference. — Это бы серьёзно помогло (не \"game-changer\"!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "important TO me (не for) — важно для меня — о человеке предлог to", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "the sooner, the better — чем раньше, тем лучше", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "The longer we wait, the worse it gets. — ⚠️ worse (не worst) + подлежащее it обязательно", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "twice as long as we expected — вдвое дольше, чем ожидали", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "not nearly as bad — далеко не так плохо", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "the best doctor I've ever worked with — лучший врач, с которым я работал (перфект + ever)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "more better ❌ — двойное сравнение — только \"better\"", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It's worse than I thought. — Хуже, чем я думал", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "No better, no worse. — Без динамики (о состоянии)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "His pressure is running lower. — Давление держится ниже, чем хотелось бы", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "She asked if I had called. — Косвенный вопрос: if + сдвиг времени + Я (не you!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He told me he had talked to... — told me / said (⚠️ НЕ \"said to me\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Same old, same old. — Всё по-старому (casual ответ на how's it going)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I slept like a baby. — Спал как убитый (⚠️ like, не as)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I slept like a log. — Спал как бревно (ещё разговорнее)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I got stuck at work. — Застрял на работе", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Then we'll see. — Дальше посмотрим", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "the night doctor — тот, кто был на ночной смене", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I had a quick handover. — Была быстрая передача (⚠️ НЕ \"I've got\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He hasn't picked up in two days. — Он не берёт трубку уже два дня", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He hasn't answered my calls. — Он не отвечает на мои звонки", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I talked to the family last night. — Говорил с семьёй вчера вечером (⚠️ last night, не yesterday evening)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "When did you last see him? — Когда ты его видел в последний раз? ⚠️ WHEN → всегда Past Simple!", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "When have you seen him? ❌ — НИКОГДА. When выключает Present Perfect", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Have you seen the CT yet? — Ты уже смотрел КТ? (yet в вопросе, the обязателен)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I talked to him yesterday morning. — Говорил вчера утром (без \"in the\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "at 2 a.m. / at two in the morning — в два часа ночи (не \"at 2 at night\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Когда именно? Ответ есть → Past Simple — Главный вопрос темы 15", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Когда именно? Ответа нет → Present Perfect — Важен факт, не время", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "yesterday / ago / last week / in 2015 — ВЫКЛЮЧАТЕЛИ Present Perfect → Past Simple", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "ever / never / already / yet / just / so far — ВКЛЮЧАТЕЛИ Present Perfect", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Past Perfect нужен только со второй точкой — By the time he crashed, I had already talked", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I had talked to him last night ❌ — → I talked. Нет второй точки — нет Past Perfect", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I've worked here for three years. — Работаю здесь три года (и сейчас)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I worked there for three years. — Работал там три года (и ушёл)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He's had three episodes overnight. — Было три эпизода за ночь (счёт до сейчас)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "We've started him on norepinephrine. — Начали норадреналин (и он на нём сейчас)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "His creatinine has come down. — Креатинин снизился (и держится)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "She hasn't passed urine since midnight. — Не мочилась с полуночи", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He's been admitted to the ICU. — Он в ИТ сейчас (результат)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He was admitted yesterday. — Поступил вчера (факт + дата)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I work AS a doctor / sleep LIKE a baby — as = в качестве · like = похоже на", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Same as always — Как обычно", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm on call today. — Сегодня я дежурю (⚠️ не \"on call date\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "three calls in a row — три дежурства подряд (⚠️ артикль a!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "three nights running — три ночи подряд (по-врачебному)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "First up... — Первым делом", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "admin — администрация (в больнице)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It's going to be a long one. — Будет длинный день", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "doing my English — занимаюсь английским (не \"learning\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "When was she admitted? — Когда она поступила? (пассив + was)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "How was your day? — только вечером — Утром: How's it going? / How was your night?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Not a thing. — Ничего вообще (ответ на \"знаешь что-нибудь про X?\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Less than you, probably. — Меньше твоего, наверное", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I could use one. — Мне бы не помешало (a coffee/a break/some help)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Twist my arm. — Ну если настаиваешь (шутка о согласии)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Beer sounds good. — Пиво — это дело (без артикля the!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It is what it is. — Ну что поделать", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Easier said than done. — Легче сказать, чем сделать", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Nothing out of the ordinary. — Ничего особенного", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Can't complain. — Не жалуюсь", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Same circus. — Всё тот же цирк", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Anyway... — Ладно, а вот... (смена темы)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "What about you? — А ты как? (вернуть мяч)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "She's gonna love hearing that. — Она это оценит (сарказм)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Should've listened to her. — Надо было её послушать", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "They're usually right, aren't they. — Они обычно правы, да?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Are we pretending this never happened? — Делаем вид, что этого не было?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Bit of both. — И то, и другое", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It's not that simple. — Не так всё просто (⚠️ that, не so)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Could you see yourself doing it? — А ты бы смог? (⚠️ глагол вперёд!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I took a year to come around. — Мне год понадобился, чтобы согласиться", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I fought it for a year. — Я год сопротивлялся", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Not the place — the people. — Скучаю не по месту, по людям", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "friends and family — друзья и родные (не \"relatives\"!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "my folks — мои родители", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "You from around here? — Ты местный?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "born and raised — родился и вырос здесь", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm in. — Я в деле", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Just say when. — Скажи только когда", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Bring the wives next time. — В следующий раз с жёнами (the, не our)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Good catching up. — Рад был поболтать", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Say hi to Rachel for me. — Передавай привет (⚠️ предлог for!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "take it to a mechanic — отвезти в сервис (не \"auto shop\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "if you're not sure what you're doing — ⚠️ внутри предложения обычный порядок слов", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "The call was okay. — Дежурство прошло нормально (⚠️ call, НЕ duty!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "duty ❌ для дежурства врача — duty = долг/обязанность. Дежурство = call", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "the doctor on duty — дежурный врач (тут on duty работает)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Quiet night. — Спокойная ночь", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "No calls overnight. — Ночью не дёргали", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Phone didn't ring once. — Телефон ни разу не зазвонил", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "overnight — за ночь (одно слово, не \"during the night\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I crashed at midnight. — Вырубился в полночь", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I got to bed around midnight. — Лёг где-то в полночь", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "fell asleep vs went to bed — fell asleep = заснул незаметно · went to bed = лёг спать", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "How long have you been working here? — Сколько ты здесь работаешь? ⚠️ НЕ \"are you working\"", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "How long have you been waiting? — Сколько уже ждёшь? (have been + ing)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "She arrived at 3 vs She was admitted at 3 — пришла сама vs её госпитализировали", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Where was he transferred? — Куда его перевели? (пассив в вопросе)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "The thing that changed my mind was... — Что меня переубедило — это...", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That was the starting point. — С этого всё началось", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I looked around me. — Я огляделся (без at, без all)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "She speaks two languages. — Говорит на двух языках ⚠️ speak, НЕ talk", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "every time I needed to... — каждый раз, когда мне надо было (без when!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It took her longer to come around. — Ей понадобилось больше времени согласиться", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "My wife needed more time. — Жене нужно было больше времени", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It opened doors for us. — Это открыло нам двери (порядок + for)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It was challenging ❌ — HR-слово. Убери — сцена скажет сама", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I understood everything in the ICU, but froze in the corridor. — 💎 Модель ответа: контраст вместо оценки", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "You got lucky. — Тебе повезло", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Get through the call. — Продержись дежурство", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Good catching up (не great) — В усечённой форме приживается good", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Slept all right. — Спал нормально (⚠️ не \"the sleep was all right\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I didn't get much sleep. — Мало поспал", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It's the weekend. — Выходные (⚠️ артикль the обязателен)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I have the day off. — У меня выходной", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "No plans. That's the plan. — Никаких планов — в этом и смысл", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Tell me about it. — И не говори (согласие с жалобой)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Same here. / Same with Maya. — У нас то же самое", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I didn't get much either. — Я тоже мало что понял", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Is it just me, or...? — Это только мне кажется, или...?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I nodded a lot. — Я много кивал (самоирония)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "The only thing I wrote down was... — Единственное, что я записал — это...", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "everything except that — всё, кроме этого", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I've done that. — Я тоже так делал", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm the one who caves. — Это я первый сдаюсь", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That part I know very well. — Вот это мне знакомо", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Twice this week. — Дважды на этой неделе", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Every page is a separate deal. — Каждая страница — отдельные переговоры", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It's not just you. — Не только у тебя", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's not so simple ⛔ — СИГНАЛЬНЫЙ МАЯЧОК: вопрос попал в живое, включилась защита", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Собеседник дал сцену → верни сцену — Не мысль, не утешение, не «у всех так»", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "many patients / much blood — считаемые → many · несчитаемые → much", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I have a lot of time. — ⚠️ НЕ \"much time\" в утверждении!", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I don't have much time. — much живёт в отрицаниях и вопросах", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "a few minutes = несколько (хватает) — few minutes = мало (не хватает)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "There's a little hope. — Надежда есть", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "There's little hope. — ⚠️ Надежды почти нет — другой разговор с семьёй", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Would you like some coffee? — ⚠️ В предложении и просьбе — SOME, не any", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Can I have some water? — Можно воды? (просьба → some)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Call me anytime. — Звони в любое время (any = любой)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He has no family here. — = He doesn't have any family here", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Output's low. — Мочи мало (по-врачебному)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Have you known him long? — ⚠️ know НЕ идёт в Continuous", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Take it easy. / Catch you tomorrow. — Пока, до завтра (разговорнее see you)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Have a good one. — Хорошего дня (в обе стороны)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "You're absolutely right. — Ты абсолютно прав (не забыть глагол!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I slept in till nine. — Поспал до девяти (sleep in = дольше обычного)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Another day off today. — Сегодня опять выходной", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I was in the same chair all day. — Весь день просидел в одном кресле", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He won't take his meds. — Отказывается принимать лекарства (won't = упирается)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "She wouldn't let us examine her. — Не давала себя осмотреть", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "The family wouldn't agree to intubation. — Семья не соглашалась на интубацию", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "The door won't close. — Дверь не закрывается", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "My car wouldn't start. — Машина не завелась", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He wouldn't come out of his room. — Не выходил из комнаты (упирался)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "won't/wouldn't = отказ, упрямство — Не время, а ВОЛЯ. He won't vs He doesn't", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "the only doctor — единственный врач (⚠️ НЕ single = холостой!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It passes. / It gets better. — Это проходит (не \"shortly\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm on a treadmill. — Я как белка в колесе", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Same loop every day. — Каждый день одно и то же", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "You're not terrible. — Да брось ты (снять вину с друга)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Did something happen, or did it just stop? — Что-то случилось, или просто прекратилось?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Does it bother you? — Тебя это огорчает?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Do you wish I did that? — Ты бы хотела, чтобы я так делал?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Every single day, huh? — Прямо каждый день, да?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That must be nice. — Наверное, здорово", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's on me — I never told you. — Это я виноват, я не рассказал", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's my fault, not yours. — Это моя вина, не твоя", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "the sickest people in the hospital — самые тяжёлые больные (ICU для ребёнка)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "so sick they can't breathe on their own — настолько тяжёлые, что сами не дышат", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Most of them do. Not all of them. — Большинство — да. Не все", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's the hardest part of my job. — Это самое трудное в моей работе", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I think about it for a long time. — Я потом долго об этом думаю", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'll be there. — Я приду (обещание)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'd love to. — С удовольствием", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Yes, I do. — Да, хочу (⚠️ НЕ \"yes, I want\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "why not ⛔ — «ну ладно» — согласие БЕЗ тепла, не для важного", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "try ⛔ в обещаниях ребёнку — «I'll try» = «вряд ли». Либо делаешь, либо не обещай", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Назвать время и место = обещание — I'll be at the gate at three", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "reading a book (не the book) — the = «та самая, о которой говорили»", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm in my office right now. — Я сейчас в кабинете (right now — в конец!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Just a regular day. — Обычный день (не \"usual day\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "All good. — Всё нормально", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "How'd it end up? — Чем в итоге закончилось?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "We ended up staying late. — В итоге задержались", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "После ЛЮБОГО предлога → -ing — thanks for coming, without saying, before starting", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Подставь «это» — помещается? Значит предлог → -ing — look forward to IT ✅ → looking forward to seeING", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "look forward to / be used to / get used to — ⚠️ ТРИ места, где to — ПРЕДЛОГ → -ing", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm looking forward to seeing you. — Жду встречи (⚠️ НЕ \"to see\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm used to working nights. — Привык работать по ночам", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to смотрит ВПЕРЁД, -ing НАЗАД или на процесс — Главное правило выбора формы", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "stop smoking vs stop to smoke — бросил курить · остановился ради сигареты", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He stopped taking his meds. — Перестал принимать лекарства", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He stopped to catch his breath. — Остановился отдышаться", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "remember calling vs remember to call — помню, что звонил · не забудь позвонить", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I forgot to tell you. — Забыл сказать (и не сказал)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "try giving fluids vs try to reach him — попробуй способ · старайся, прилагай усилия", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Try turning him on his side first. — Попробуй сначала повернуть его на бок", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "The dressing needs changing. — Повязку надо поменять (= needs to be changed)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "The wound needs cleaning. — Рану надо обработать", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I enjoy working nights. — Мне нравится работать по ночам (⚠️ НЕ to work)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "We considered transferring him. — Мы рассматривали перевод", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "She kept asking the same thing. — Она всё спрашивала одно и то же", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He avoided answering my question. — Он уклонился от ответа", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He suggested calling the family first. — Он предложил сначала позвонить семье", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I managed to get home by eight. — Удалось попасть домой к восьми", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He refuses to be intubated. — Отказывается от интубации", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "They made him wait. / She let me go. — ⚠️ make и let — БЕЗ to", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He left without saying anything. — Ушёл, ничего не сказав", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Thanks for letting me know. — Спасибо, что дали знать", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I regret to inform you... vs I regret telling her. — с сожалением сообщаю · жалею, что сказал", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "You're not wrong. — Не поспоришь", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm the new guy. — Я тут новенький", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "First time at the gate. — Первый раз у ворот", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I don't usually make it out by three. — Обычно я к трём не освобождаюсь", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm an ICU doctor. — Я врач-реаниматолог", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It never lets up. — Не отпускает", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Feels like it never stops. — Ощущение, что это не кончается (не \"it seems that\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "it will never stop — ⚠️ never ПОСЛЕ вспомогательного (не \"never will stop\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Some weeks are worse than others. — Бывают недели тяжелее", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'd take that trade some days. — Иногда я бы поменялся", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "She takes it hard. — Ей это тяжело даётся", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's what costs the most at home. — Вот что дороже всего обходится дома", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "We talk about it a lot. — Мы много об этом говорим (привычка = Simple!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Then you already know. — Значит, ты и так понимаешь", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "What did you change? — Что вы поменяли? (спроси, когда дверь открыли!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Okay, I have to ask. — Так, не могу не спросить", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm dying to know. — Умираю, как хочу узнать", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Now I have to know. — Теперь точно надо узнать", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "What do you say we grab a pizza? — Может, сходим за пиццей?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It'd be nice to get out. — Было бы неплохо выбраться", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Things got better. — Стало лучше", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Pizza it is. — Значит, пицца", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'll text you. — Напишу тебе", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "touch base ⛔ — корпоративный жаргон — не в живом разговоре", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "hash out the details ⛔ — из переговоров — не за пиццей", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Реагируй в тоне, не оценивай — Шутку не хвалят — на неё отвечают", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Pace yourself. — Распределяй силы, не гони", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I've got a few meetings lined up. — У меня запланировано несколько встреч", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "this week / last Monday / next month — ⚠️ БЕЗ предлога! this/last/next/every убивают предлог", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "on Thursday morning — в четверг утром (⚠️ день победил утро → on)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "at night / in the middle of the night — ночью · посреди ночи", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "at — точка, on — день/поверхность, in — период/объём — Матрёшка предлогов", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "in the car / on the bus — в машине сидишь · по автобусу ходят", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "go home / get home — ⚠️ без to!", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "the chart — медкарта (⚠️ map = географическая)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Let's go home. — Поехали домой (Go home = приказ «иди домой»)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I appreciate that. I do. — Я это ценю. Правда", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I can't take them. — Я не могу их взять (не \"I refuse\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Actually, it's the opposite. — Вообще-то наоборот (не \"Moreover\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'd like to cut back on my calls. — Хочу сократить дежурства", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's my decision. — Это моё решение (⚠️ не \"I promised my wife\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I've thought a lot about this. — Я много об этом думал (Perfect!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I can't wait six months. — Полгода я ждать не могу", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Six months turns into twelve. — Полгода превращаются в год", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Here's what I can do. — Вот что я могу предложить", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Here's my proposal. — Вот моё предложение", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "whether you've hired someone by then or not — наймёте кого-то к тому времени или нет", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Hire or no hire. — Наймёте или нет", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": const FILTERS=['Всё','Уроки','💊 Грамматика','🃏 Карточка'];
let filter='Всё';
const chips=document.getElementById('chips');
FILTERS.forEach(f=>{const b=document.createElement('div');b.className='chip'+(f===filter?' on':'');
 b.textContent=f;b.onclick=()=>{filter=f;[...chips.children].forEach(c=>c.classList.toggle('on',c.textContent===f));run();};
 chips.appendChild(b);});
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(text,q){const i=text.toLowerCase().indexOf(q);if(i<0)return esc(text);
 return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));}
function run(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 const out=document.getElementById('out'),cnt=document.getElementById('count');
 if(q.length<2){out.innerHTML='';cnt.textContent='';return;}

 if(filter==='Уроки')res=res.filter(d=>d.s.startsWith('Модуль'));
 else if(filter!=='Всё')res=res.filter(d=>d.s===filter);
 cnt.textContent=res.length?`Найдено: ${res.length}`+(res.length>80?' (показаны первые 80)':''):'Ничего не найдено';
 out.innerHTML=res.slice(0,80).map(d=>
  `<div class="res"><div class="src">${esc(d.s)} — ${esc(d.ti||'')}</div>

}
