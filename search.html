": "⚠️ WHEN — самый жёсткий выключатель. Вопрос when сам требует Past Simple: ❌ When have you seen him? → ✅ When did you last see him?", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "✅ Слова-ВКЛЮЧАТЕЛИ Present Perfect", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "Слово Пример", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "ever / never Have you ever worked with that?", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "already / yet Has he woken up yet ?", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "just She's just called.", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "so far / up to now No response so far .", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "for / since unresponsive for two days / since Monday", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "🩺 Где это ломается у врача", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "1. Передача смены — Present Perfect почти везде (говоришь про состояние СЕЙЧАС):", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "He' s had three episodes overnight. We' ve started him on norepinephrine. — и он на нём сейчас His creatinine has come down . — и держится She hasn't passed urine since midnight.", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "2. Назвал время — переключился: We started him on norepinephrine at two this morning . ← Past Simple!", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "3. Одно событие, две формы: He' s been admitted to the ICU. — он в ИТ сейчас, важен результат He was admitted yesterday. — факт из прошлого, с датой", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "⚠️ Три личные ловушки", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "Ловушка 1 — «I've got» для прошлого события ❌ I've got a quick handover from the night doctor (уже было утром) ✅ I had a quick handover. 📌 I've got = «у меня есть СЕЙЧАС», не «я получил тогда».", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "Ловушка 2 — Past Perfect без второй точки ❌ I had talked to the family last night → ✅ I talked to the family last night. 📌 Past Perfect нужен ТОЛЬКО когда есть вторая, более поздняя точка в прошлом: ✅ By the time he crashed, I had already talked to the family. Нет второй точки → нет Past Perfect.", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "Ловушка 3 — русское «уже» тянет не туда «Я уже говорил вчера» → yesterday побеждает: I talked , не I've already talked .", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "💎 Тонкая пара — смысл меняется формой", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "I' ve worked here for three years. — и работаю сейчас I worked there for three years. — и ушёл", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "📌 Бонус: as vs like", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "as = «в качестве»: I work as a doctor. like = «похоже на»: I slept like a baby. · like a log", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "1. Считаем или не считаем?", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "Вся тема держится на одном делении:", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "Считаемые (можно посчитать) Несчитаемые (нельзя)", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "patients, beds, calls, doctors blood, urine, oxygen, time, sleep", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "many patients much blood", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "few beds little time", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "a lot of ← работает с обоими a lot of", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "⚠️ Ловушка: ❌ the sleep was all right — sleep несчитаемое, артикль не берёт. ✅ Slept all right.", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "2. some vs any", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "some → утверждения · any → отрицания и вопросы", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "I need some help. · Do you have any questions? · He doesn't have any family here.", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "💡 Исключение (важное): в предложении и просьбе — some , не any : ✅ Would you like some coffee? ← предлагаю ✅ Can I have some water? ← прошу ❌ Would you like any coffee? — прозвучит холодно", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "📌 any в утверждении = «любой»: Call me any time.", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "3. ⚠️ Главная ловушка: much в утверждении", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "Much почти не используется в УТВЕРДИТЕЛЬНЫХ предложениях — только в вопросах и отрицаниях:", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "✅ I don't have much time. — отрицание ✅ Do you have much experience? — вопрос ❌ I have much time — так не говорят", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "В утверждении: ✅ I have a lot of time. · plenty of time", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "📌 То же с many — в утверждении разговорнее a lot of : We have a lot of patients today.", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "4. few / a few — разница в одном артикле", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "Меняет смысл на противоположный:", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "Форма Смысл Пример", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "a few несколько (достаточно) I have a few minutes. — есть время", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "few мало (недостаточно) I have few minutes. — почти нет", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "a little немного There's a little hope. — надежда есть", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "little мало There's little hope. ⚠️ — надежды почти нет", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "📌 Клинически важно. «There's little chance» и «there's a little chance» — разные разговоры с семьёй .", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "5. no / not any / none", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "He has no family here. = He doesn't have any family here. — How many beds do we have? — None . ← отдельно стоящее «ни одного»", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "💡 No сильнее и короче. Врачи говорят: No fever. No allergies. No response.", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "🩺 Где это живёт у врача", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "He's had a few episodes overnight. — несколько There's not much urine output. · Output's low. We don't have any beds. = We have no beds. Do you have any allergies? She's lost a lot of blood. ← не much blood в утверждении! There's little we can do. ⚠️ — «почти ничего», тяжёлая фраза", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "📌 Бонус: статичные глаголы", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "know, want, need, believe, own, understand — не идут в Continuous : ❌ How long have you been knowing him? → ✅ Have you known him long?", "s": "💊 Грамматика", "ti": "Тема 16. some / any / much / many / few — сколько чего", "u": "grammar.html#t16"}, {"t": "Две формы объяснения. Сначала — короткая для запоминания (3 правила + 4 пары). Ниже — полная с группами глаголов . Проходи по обеим несколько раз.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "Списки учить не надо. Есть три правила, которые покрывают 90%. Остальное — четыре пары, которые запоминаются как картинки.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "1️⃣ Правило предлога — самое надёжное", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "Thanks for coming . I'm interested in learning more. He left without saying anything. Before starting antibiotics, take cultures. She's good at handling families. What about calling the consultant? Instead of waiting , we transferred him. He apologized for being late.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "⚠️ Ловушка: `to` бывает предлогом. Как отличить за секунду:", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "Проверка Вывод", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "look forward to it ✅ предлог → looking forward to seeing you", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "I'm used to it ✅ предлог → used to working nights", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "I want it ✅, но I want to it ❌ частица → want to work", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "📌 Три главных, где `to` — предлог: look forward to · be used to · get used to", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "I'm looking forward to seeing you. ← не to see I'm used to working nights. — привык You'll get used to living here. — привыкнешь We're committed to improving this. I'm not used to being home at six.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "2️⃣ Правило времени — покрывает почти все глаголы", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "`to` = того, чего ещё нет — want, need, decide, hope, plan, promise, agree, refuse, offer, learn, manage 📌 Все про будущее действие : хочешь → потом делаешь. Решил → потом делаешь.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "I decided to leave at seven. He refused to sign the consent. She promised to call back. We agreed to wait for the labs. I managed to get home by eight. They offered to help . He's learning to speak Hebrew.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "`-ing` = то, что уже есть или идёт — enjoy, finish, avoid, mind, keep, consider, practice, miss, suggest 📌 Все про сам процесс : наслаждаешься процессом, заканчиваешь то, что шло, избегаешь того, что уже существует.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "I finished writing the discharge summary. He avoided answering my question. She kept asking the same thing. Do you mind waiting a minute? We considered transferring him. I miss working with her. He suggested calling the family first.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "Пример Логика", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "I decided to leave . решение → уход впереди", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "I finished writing . писал → процесс позади", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "He refused to sign . подпись впереди (не состоялась)", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "He avoided answering . ответ уже был на столе", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "💡 Не помнишь глагол — спроси себя: действие впереди или уже идёт? Работает почти всегда.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "3️⃣ После прилагательного и существительного → to", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "I'm happy to help . · We're ready to go . · He was the first to arrive . It's hard to say . · I'm glad to hear that. · She's easy to work with. a chance to talk · time to leave · the right to refuse · no reason to worry", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "⚠️ ЧЕТЫРЕ ПАРЫ, где смысл меняется", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "Их всего четыре. Учи как истории, не как правила.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "💡 Картинка: -ing — то, что ты бросил. to — то, ради чего встал.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "He stopped taking his meds three weeks ago. — перестал принимать He stopped to take his meds. — остановился, чтобы принять She stopped working after the baby. — ушла с работы I stopped to catch my breath. — встал отдышаться 📌 Клинически это разные вещи — следи в передаче смены.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "💡 Та же логика правила 2: -ing назад, to вперёд.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "I remember calling the family. — помню, что звонил Remember to call the family. — не забудь позвонить I remember seeing that rash before. Remember to check the labs. I forgot to tell you. — забыл сказать (и не сказал) I'll never forget telling her. — никогда не забуду, как говорил ей", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "💡 Картинка: try + -ing — «а давай так попробуем». try to — «я старался».", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "Try turning him on his side first. — попробуй так Try giving him fluids. I tried to reach you all morning. — пытался дозвониться He tried to explain , but she wasn't listening.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "I need to change the dressing. The dressing needs changing . = needs to be changed, только короче The wound needs cleaning . This needs sorting out today.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "📋 Одна таблица — на телефон", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "Хочу сказать Форма Пример", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "после предлога -ing thanks for coming", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "после look forward to / used to -ing used to working", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "действие впереди to decided to go", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "процесс / уже было -ing finished writing", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "после прилагательного to ready to go", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "кто-то должен что-то сделать кого + to asked me to stay", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "make / let без to made him wait", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "Группа А — только -ing", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "enjoy · finish · avoid · mind · suggest · keep · consider · practice · miss · deny · admit · risk · imagine", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "I enjoy working nights. He avoided answering the question. Do you mind waiting outside? She kept calling all evening. We considered discharging him. He denied taking anything. I can't imagine doing this for thirty years.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинити e to stay. · They told her to wait. I'd like you to meet Sarah. · The nurse reminded me to sign it.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "⚠️ Кроме make и let — без to: They made him wait two hours. · She let me go early. · Let me know .", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "🩺 20 фраз из твоей работы — учи их, а не правила", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "📌 Не заучивай группы. Заучи готовые фразы — конструкция придёт вместе с ними.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "Фраза Что тренирует", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "I enjoy working nights. группа А", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "He refuses to be intubated. группа Б", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "We considered transferring him. группа А", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "She kept asking the same thing. группа А", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "I managed to get out by seven. группа Б", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "The wound needs cleaning . пара need", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "He stopped taking his meds. ⚠️ пара stop", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "He stopped to catch his breath. ⚠️ пара stop", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "Remember to check the labs. ⚠️ пара remember", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "I remember seeing that rash. ⚠️ пара remember", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "Try turning him first. ⚠️ пара try", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "I tried to call the family. ⚠️ пара try", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "Thanks for letting me know. предлог", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "I'm used to working nights. to-предлог", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "Looking forward to meeting you. to-предлог", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "He left without saying anything. предлог", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "We decided to hold the transfer. вперёд", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "She avoided answering me. процесс", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "They made him wait . без to", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "She let me go early. без to", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "💡 Как этим пользоваться", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "Не пытайся вспомнить правило в разговоре — не успеешь.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "1. Правило предлога — единственное, что стоит держать активно. Оно железное и часто встречается. 2. Четыре пары — выучи как четыре картинки. 3. Остальное придёт из фраз. Двадцать штук выше — их и повторяй.", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "📌 Через неделю-две конструкция начнёт вставать сама, потому что будешь помнить не правило, а звучание фразы .", "s": "💊 Грамматика", "ti": "Тема 17. Герундий vs инфинитив (-ing или to)", "u": "grammar.html#t17"}, {"t": "Правила простые, но ошибки здесь — самые заметные для носителя. Хорошая новость: всё логично .", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "1. Время: принцип матрёшки", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "Чем МЕНЬШЕ отрезок — тем «острее» предлог:", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "Предлог Отрезок Примеры", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "at точка at 3 p.m. · at midnight · at noon · at night", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "on день on Monday · on Thursday morning · on May 5th · on my birthday", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "in период in September · in 2026 · in the morning · in autumn · in an hour", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "📌 Картинка: at — точка на часах → on — квадратик в календаре → in — целая страница календаря.", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "⚠️ Три ловушки времени", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "Ловушка 1 — утро: in the morning (утром вообще), но on Thursday morning — как только появился день недели, предлог всегда on .", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "Ловушка 2 — ночь: at night (не in the night ) · in the middle of the night — посреди ночи.", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "Ловушка 3 — нулевой предлог: ❌ during this week · on last Monday · in tomorrow ✅ this week · last Monday · next month · today · tomorrow · yesterday 📌 this / last / next / every убивают предлог. Всегда.", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "2. Место: та же матрёшка", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "Предлог Смысл Примеры", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "at точка на карте at work · at school · at the hospital · at the gate · at the door", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "on поверхность / линия on the table · on the wall · on the third floor · on the way", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "in внутри объёма in the room · in the ICU · in bed · in the car · in Israel", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "🩺 He's in bed four. · She's at the nurses' station. · The chart's on the desk. · on the third floor · in the OR · at the bedside", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "⚠️ Пары, где легко перепутать", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "Форма Смысл", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "in the hospital внутри здания (🇺🇸 или лежит в больнице)", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "at the hospital на работе / на территории", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "in the car в машине (сидишь)", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "on the bus / train / plane ⚠️ транспорт, где можно ходить → on", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "at the corner у угла (точка встречи)", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "in the corner в углу комнаты", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "3. Движение: to / into / out of", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "go to work · come to the hospital ← направление walk into the room ← пересёк границу get out of the car · step out of the room", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "⚠️ home — без to: go home · get home · I'll be home in an hour ← ❌ go to home", "s": "💊 Грамматика", "ti": "Тема 18. Предлоги времени и места: at / on / in", "u": "grammar.html#t18"}, {"t": "Система проще, чем выглядит: четыре этажа по степени реальности .", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "🏢 Четыре этажа", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "Этаж Реальность Формула Пример", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "0 всегда так if + Present → Present If the pressure drops, the alarm goes off.", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "1 реально, будущее if + Present → will If he spikes a fever, we'll start antibiotics.", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "2 нереально, сейчас if + Past → would If I had more staff, I would take it.", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "3 не случилось, прошлое if + had + V3 → would have + V3 If we had intubated earlier, he would have survived.", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "1️⃣ Этаж 1 — реальное будущее", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "If the labs come back bad, I'll call you. If she doesn't improve by morning, we'll transfer her. If the family agrees, we'll switch to comfort care.", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "⚠️ Главная ловушка: после if — НИКОГДА will: ❌ If it will happen again → ✅ If it happens again", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "💡 unless = if not: We'll extubate tomorrow unless something changes.", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "2️⃣ Этаж 2 — фантазия о настоящем", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "If I had more time, I would read more. ← времени нет If we had an ICU bed, we would take him. ← койки нет What would you do if it were your father? ← вопрос семьи врачу, классика", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "📌 were для всех лиц: If I were you... · If he were younger... (разговорно was тоже говорят, но were — стандарт)", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "⚠️ Past здесь — не прошлое! If I had = «если бы у меня было СЕЙЧАС». Форма прошедшая — смысл настоящий.", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "3️⃣ Этаж 3 — упущенное прошлое", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "Самый тяжёлый — и самый нужный: разборы, M&M, «а если бы» .", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "If we had scanned him earlier, we would have caught it. If she had come in a day sooner, it would have been operable. He would have died if the nurse hadn't noticed . If I had known , I would have come in .", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "📌 Это грамматика сожаления — из той же семьи, что «I shouldn't have transferred him» (т.9, урок 16).", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "💡 Короткая форма в речи: Had we known... = If we had known...", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "🔀 Смешанный — прошлое ударило по настоящему", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "If we had operated then, he would be walking now. ← операция в прошлом (этаж 3) → результат сейчас (этаж 2). Очень частый в медицине — просто склей этажи по смыслу.", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "🩺 Десять рабочих", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "If it happens again, come straight to me. If he spikes, call me. I don't care what time it is. If I were you, I'd get a second opinion. What would you do if it were your mother? If we'd caught it earlier, we'd have had options. Unless something changes, we extubate tomorrow. If you're not sure — ask. Always. He wouldn't be here if the neighbor hadn't called 911. ← смешанный If I had known, I would", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "Следующие капли (по одной за сессию): 20 — модальные глаголы (must/have to/should); 21 — пассивный залог.", "s": "💊 Грамматика", "ti": "Тема 19. Условные предложения: четыре if", "u": "grammar.html#t19"}, {"t": "How's it going? — Как дела? (в ежедневном употреблении)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Not bad, can't complain. — Неплохо, грех жаловаться", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "What have you been up to? — Чем занимался? ✓✓✓ 10.08 после отпуска", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Same old, same old. — Всё по-старому ✓ 7d сдано", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Long time no see! — Сколько лет, сколько зим! ✓ 7d сдано", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'd better get going. — Мне пора (GET на месте!) ✓✓ 10.08", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It was great catching up! — Здорово было поболтать! ✓✓ обе формы раздельно — гибрид повержен 20.07!", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Take care! — Береги себя! (в ежедневном употреблении)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Say hi TO ... for me. — Передавай привет... (hi TO кому, FOR от кого) ✓", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "How come? — Как так? / Почему это?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Likewise! — Взаимно!", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "right now / at the moment — прямо сейчас (не just now!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "practice (a skill) — тренировать навык (не train!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Could you do me a favor? — Можешь оказать мне услугу?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Do you mind if I...? — Ты не против, если я...? ✓ 10.08", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "No, go ahead. — (ответ: не против) Давай, пожалуйста", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Would you mind closing...? — Не могли бы вы закрыть...?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I was wondering if you could... — Я хотел спросить... (утверждение, без «?») ✓", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Can I get a coffee, please? — Можно мне кофе? (заказ)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Is it okay if I sit here? — Ничего, если я сяду здесь?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Sure, no problem. — Конечно, без проблем", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'd appreciate it. — Буду признателен", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Sorry TO bother you, but... — Извините, что беспокою ✓", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Never mind. — Неважно / Проехали", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "enjoy (≠ join!) — наслаждаться: enjoy our coffee", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "the Wi-Fi password here — пароль от Wi-Fi (без \"of this place\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Nice to meet you! — You too! — Приятно познакомиться! — Взаимно! (не Me too!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Where are you from originally? — Откуда вы родом? ✓✓", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "What do you do (for A living)? — Кем работаешь? ✓✓ артикль взят", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I work as... / I work in... — Я работаю (кем) / (в сфере)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I've been living here for ... years — Я живу здесь ... лет ✓✓", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Do you have any kids? — У вас есть дети? ✓✓", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "What do you do in your free time? — Чем занимаешься в свободное время?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm really into... — Я увлекаюсь... ✓✓ (sports)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Small world! — Мир тесен!", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "No way! — Да ладно! / Не может быть!", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I don't have enough time — У меня нет времени (не I haven't!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It was nice meeting you! — Приятно было познакомиться ✓✓", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It's a great place TO LIVE — Место для жизни = place TO live", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "To be honest, ... — Честно говоря, ...", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "If you ask me, ... — По-моему / как по мне, ...", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That makes sense. — Логично / понятно", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I see your point, but... — Понимаю тебя, но...", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm not so sure about that. — Я в этом не уверен (мягкое несогласие)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's a good point. — Дельное замечание (только как реакция!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It depends on THE price — Зависит ОТ цены (on + артикль!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Sounds good! — Годится! / Отличный план!", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I couldn't agree more. — Полностью согласен", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "No offense, but... — None taken! — Без обид, но... — Не обиделся! ✓", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "too ≠ so — СЛИШКОМ = too ✓", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Sorry, I didn't catch that. — Извините, я не расслышал ✓✓ 10.08", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Could you say that again? — Не могли бы вы повторить?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Could you slow down a bit? — Чуть помедленнее (целиком!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Could you speak up a little? — Чуть погромче, пожалуйста", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "What do you mean by...? — Что вы имеете в виду под...?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "How do you spell that? — Как это пишется (по буквам)? ✓", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "What's the word for...? — Как называется...? (bottles! 🍾)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Come again? — Чего-чего? (неформ.; вежливо: Sorry? / Pardon?) ✓", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Did you say ten or two? — Вы сказали 10 или 2? (SAY, не mean!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Got it! — Понял! (не «I catch that»)", "s": "🃏 Карточка", "ti": "Колода", "u": " s seems\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Easier said than done. — Легче сказать, чем сделать", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Go with the flow. — Плыть по течению / не париться", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'd move there tomorrow. — Хоть завтра бы переехал (would = мечта!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "stuck in the nineties — застряли в девяностых", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "my folks — мои РОДИТЕЛИ (не «родня»!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Good to see you. — Рад видеть (другу, не \"What brings you in\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It was great catching up. — Здорово было пообщаться", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Say hi to ... for me. — Передавай привет", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "wrecked — разбитый, вымотанный (you look wrecked)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to watch out for — остерегаться, следить за", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That said, ... — Хотя, с другой стороны (вместо However)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm in. — Я в деле (ответ на приглашение)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "a hunch — чутьё, догадка без доказательств (Just a hunch)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Not great. — Так себе (мягкий негатив на \"how was it?\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I got a call from... — Мне позвонил... (НЕ \"telephone call\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm working this weekend. — Я работаю в выходные (Present Cont. = расписание)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I couldn't get back to sleep. — Не смог снова заснуть", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I don't know where he is. — Порядок слов: вопрос внутри = НЕ вопрос", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He asked why I was calling. — Прошлое снаружи → прошлое внутри", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "How come? — А почему? (живее и мягче, чем Why?)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Sorry? / Come again? — Не расслышал — переспрос", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Like what? / Such as? — Например? (просишь детали)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "In what sense? / Meaning? — В каком смысле?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "bedside manner — манера общения с пациентом (у постели больного)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to run late — опаздывать, задерживаться", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to pull through — выкарабкаться, выжить (о пациенте)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "khop khun krap / ka — спасибо по-тайски (krap — м.р., ka — ж.р.)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Sawasdee krap / ka — здравствуйте по-тайски", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Just a hunch. — Просто чутьё (клиническое ощущение без цифр)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "What's there to hate about...? — А что там может быть плохого? (НЕ \"what would be bad\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Bad? In Thailand? — Эхо-возражение — живая разговорная реакция", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'd stay there forever. — Остался бы навсегда (НЕ \"for life\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "every vacation (не each) — every = все вообще; each = поштучно", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "the best (артикль!) — превосходная степень требует the", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I don't mind. — Мне всё равно (нейтрально — вместо грубого I don't care)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "He's not in pain. — Он не страдает (⚠️ НЕ \"a pain\" = зануда!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'd be angry too. — Я бы тоже злился (валидация гнева семьи)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Both things are true. — И то и другое правда (объяснить противоречие)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm glad you looked into it. — Хорошо, что вы поискали (семье с Google)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I wish I could tell you it was. — Хотел бы я сказать, что это так", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's completely fair. — Это справедливо (о ЧУЖОЙ просьбе — не fair enough!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "You're entitled to that. — Вы имеете на это право", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Nothing has been missed. — Ничего не упущено", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "just let us know — просто скажите нам (⚠️ НЕ \"say to us\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "You're not doing this alone. — Вы не одни в этом", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "We'll be with you the whole way. — Мы будем рядом до конца", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "What's going through your head? — Что у тебя в голове? (молчащему родственнику)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "The stroke made this decision. — Решение принял инсульт, не вы (снять вину с семьи)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'm not asking you to decide. — Я не прошу вас решать — это моя работа", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Can you live with it? — Сможете с этим жить? (вместо \"вы согласны?\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "below the level of the injury — ниже уровня поражения (про рефлекс)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "escalating pressors / drips — наращивание вазопрессоров/инфузий", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "We were slammed. — Нас завалили (= swamped)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "back-to-back admissions — поступления одно за другим", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "get this — ... — и прикинь... (ввод удивительного факта)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I didn't get around to... — не дошли руки до...", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "You know how it is. — Ну ты знаешь, как оно (точка, без продолжения!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to work weekends — работать по выходным (регулярно — без \"on the\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Working weekends kills me. — Выходные меня убивают (герундий-подлежащее!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It makes me want to... — Из-за этого хочется... (НЕ \"causes me to\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I have to (не need to) — вынужден — жалоба; need to = мне нужно", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "If he gets worse... — Если ухудшится (⚠️ нет глагола \"to worse\"!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "If I had known, I'd have told you. — Знал бы — сказал (3-й тип: had + V3 → would have + V3)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "If I were you, I'd... — На твоём месте я бы... (were, не was!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It's not the first time. — Не в первый раз (без \"for\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to watch out for — остерегаться, следить за (≠ go with the flow)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to cover for someone — подменить кого-то (НЕ \"work instead of you\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Rain check? — Давай перенесём?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "same old, same old — всё то же самое", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "more or less — более-менее (абстрактно; give or take — с цифрами)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I wish I could. — Я бы рад, но не могу (мягкий отказ)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "in a row — подряд (two weekends in a row)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "short-staffed — не хватает персонала", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I've got you. / I gotchu. — Я тебя прикрою (НЕ \"я обещаю\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I need a clear head. — Мне нужна ясная голова", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to present a case TO — докладывать случай кому-то (не \"before\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I get asked that a lot. — Меня часто об этом спрашивают (пассив!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Some days are hard. — Бывают тяжёлые дни (НЕ \"may be complex\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "It gets to you. — Это цепляет, задевает", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "You're not made of stone. — Ты не каменный", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "a pressure cooker — скороварка (о стрессовой работе)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "You're not out of line. — Ты не переходишь границу", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Want me to put you in touch? — Хочешь, я вас свяжу?", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Just say when. — Просто скажи когда", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's a lot to worry about. — Есть о чём беспокоиться", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I'll TRY to... = скорее нет — try ослабляет обещание! Нужно \"Let's do it\"", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to recommend A cardiologist — ⚠️ НЕ \"recommend YOU a cardiologist\"", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "mother-in-law — тёща/свекровь (не mother!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "have to (внешнее) — вынужден — давят обстоятельства", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "must (внутреннее) — я сам решил + предположение (You must be tired)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "You don't have to. — Ты не обязан (можешь, если хочешь)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "You mustn't. — ЗАПРЕЩЕНО (≠ don't have to!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I should have called. — Надо было позвонить (сожаление о прошлом)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I had to stay. — Мне пришлось остаться (прошедшее от have to)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Nothing was out of the ordinary. — Ничего необычного (⚠️ НЕ \"anything was different\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Nothing stood out. — Ничего не бросилось в глаза", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "per our protocol — согласно нашему протоколу (не \"by our protocol\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to go into septic shock — впасть в септический шок (не \"deteriorate TO\")", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Looking back, ... — Оглядываясь назад", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "In hindsight, ... — Задним числом", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "the gap was 18 hours — разрыв составил 18 часов", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Nobody flagged it. — Никто не забил тревогу", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to flag abnormal labs — сигналить об отклонениях в анализах", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "That's on us. — Это наша вина (закрывает тему признания)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Fair question. — Справедливый вопрос (вместо Good question на критику)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "I can't disagree. — Не могу не согласиться", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "a blind spot — слепое пятно (в протоколе, в системе)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "Three is a pattern. — Три случая — уже система", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "he was already tipping — он уже валился, срывался", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to escalate (therapy) — эскалировать, усиливать терапию", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "We should have escalated. — Надо было эскалировать (should have = не сделали!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "it might not have happened — этого могло бы не случиться (might, не would!)", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "should + голый глагол — ⚠️ НИКОГДА \"should TO change\"", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"}, {"t": "to run into someone — случайно встретить, столкнуться", "s": "🃏 Карточка", "ti": "Колода", "u": "index.html"},
