Что у тебя в голове? (молчащему родственнику)", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "to buy time with tests тянуть время назначениями", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "below the level of the injury ниже уровня поражения", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "escalating pressors / drips наращивание вазопрессоров/инфузий", "s": "Модуль 4 · Работа/Медицина · урок 14", "u": "lesson-04-14.html", "ti": "Урок 14 (Модуль 4) — 🔥 Family meeting: конфликтная семья (17.08)"}, {"t": "Сцена: двор дома, 15:30, после смены. Mike — сосед снизу, американец, три года в Израиле, хайтек. Здороваетесь, но толком не общались.", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Задача урока: small talk с малознакомым + вежливый отказ (просьба посмотреть документы тёщи).", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Итог: 3 фразы Everyday English ✅ · главная находка — пропуск вопросов собеседника .", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "🎬 Полный диалог — как он прошёл", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "✍️ Тот же диалог — как сказал бы носитель", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "🎯 ГЛАВНАЯ НАХОДКА: ты не отвечаешь на вопросы собеседника", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Майк задал 6 прямых вопросов и реплик, требующих реакции. Без ответа осталось 4 :", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Майк сказал Реакция", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Eduard, right? You're the doctor upstairs? ⬜ пропущено", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Just getting home? ⬜ пропущено", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Tell me if I'm out of line here ⬜ пропущено ( он давал выход из неловкости! )", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Doesn't it get to you? ✅ ответил", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Nobody dies if my code breaks ✅ I love it", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "We should grab a beer ✅ принял", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Это не языковая проблема. Это привычка отвечать по существу и пропускать «лишнее». В медицине правильно: важен главный вопрос. В small talk наоборот — «лишнее» и есть разговор .", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "⚠️ Тот же паттерн три урока подряд: Luis (урок 14), Дан (урок 13), Майк (урок 15).", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "📌 Правило small talk: отвечай на последний вопрос обязательно, на предыдущие — по возможности. Никогда не оставляй оба без ответа. На личный вопрос отвечай и возвращай мяч — иначе разговор умирает.", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "⚠️ Три ошибки, меняющие смысл", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Сказал Что услышал Майк ✅ Надо", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "It sounds good. (в ответ на «тёща 78 лет, аритмия, жена в панике») «отлично, что она больная приезжает» 😅 That's a lot to worry about. · That's nice — how long is she staying?", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "That is a common question I asked . «я сам всем задаю этот вопрос» That's a question I get a lot. · I get asked that a lot.", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "We'll try to do something. «скорее всего, нет» — вежливый отказ! Let's do it. · Just say when.", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "📌 Когда в реплике и хорошее, и тревожное — реагируй на тревожное. Иначе выглядишь глухим.", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "📌 try ослабляет обещание. I'll try to come = скорее не приду.", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "🔧 Языковые правки", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "❌ Сказал ✅ Правильно Почему", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "I can't help with your mother your mother-in-law отправил его маму вместо тёщи 😄", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "I'd recommend you a cardiologist I'd recommend a cardiologist · I can point you to a good cardiologist recommend не берёт человека сразу после себя (как say to us )", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "it's maybe serious it might be serious порядок слов", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Sometimes it may be complex Sometimes it can be rough · Some days are hard may → can; complex = «сложно устроенный», не про тяжесть", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "I am trying not to think about it I try not to think about it привычка = простое настоящее", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Grab a beer is a good idea Grabbing a beer sounds good · A beer sounds great герундий-подлежащее (тема 5)", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "I couldn't agree more Yeah, definitely · For sure · I'm in регистр: это из переговорной, не из двора", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "it was a busy day (день ещё идёт) it's been a long one · rough day", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "I'd tell you more, (обрыв) Here's the thing — · And honestly... фраза повисла", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "✅ Что сработало", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Ход Почему", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "I love it. живая реакция на шутку — впервые появилась сама", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "You get used to it. просто, честно, без пафоса", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "It depends. к месту", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Say hi to your wife for me. фирменная фраза, стабильно в активе", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Стратегия отказа отказал и предложил альтернативу — правильно", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "💬 Как отказывать, не обижая", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Соседу с медицинской просьбой", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "📌 Три предложения на отказ, и всё. Длинное объяснение выдаёт неуверенность.", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "На личный вопрос («как ты это выдерживаешь?»)", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "💡 Подхватывай формулировку собеседника. Майк сказал «Doesn't it get to you?» → отвечай «Yeah, sometimes it does get to me» . Самый естественный ход в разговоре.", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "🔄 «Скажи это трижды» — отказ («не могу, уже есть планы»)", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "1️⃣ Начальнику (просит выйти в выходной)", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "💡 Предложи помощь другим способом — это отказ, который не портит отношений.", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "⚠️ Ошибки: I know well about your problem → I know you're in a tough spot / you're short-staffed · two weekends continuously → two weekends in a row · I think you will agree with me → убрать (давление на начальника)", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "2️⃣ Коллеге (просит подменить)", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "⚠️ It's impossible → I really can't today / I wish I could · work instead of you → cover for you · I've promised → I promised", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "3️⃣ Другу (зовёт в бар)", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "⚠️ No way! здесь опасно — прозвучит как резкий отказ («ещё чего!»). Нужно Can't tonight · Ah, I wish · report the case before doctors → present a case to", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "🎯 Наблюдение по упражнению", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Самая слабая версия — не самая казуальная, а самая неудобная . Вчера поломалась версия для друга, сегодня — для начальника: речь раздулась в оправдание там, где хватило бы одной фразы.", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "📌 Правило: чем неудобнее сказать — тем короче фраза. Носитель в неловкой ситуации сокращает , а не объясняет.", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "📌 Новые фразы урока", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Фраза Перевод", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "to cover for someone подменить кого-то (не work instead of )", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "rain check? давай перенесём?", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "same old, same old всё то же самое", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "more or less более-менее (абстрактное; give or take — с цифрами)", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "I wish I could. Я бы рад, но не могу", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "in a row подряд", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "short-staffed не хватает персонала", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "I've got you. / I gotchu. Я тебя прикрою / рассчитывай на меня", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Can't let her down. Не могу её подвести", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "I need a clear head. Мне нужна ясная голова", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "to present a case to докладывать случай (кому — to )", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "I get asked that a lot. Меня часто об этом спрашивают", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Some days are hard. Бывают тяжёлые дни", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "It gets to you. Это цепляет, задевает", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "You're not made of stone. Ты не каменный", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "a pressure cooker скороварка (о стрессовой работе)", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "You're not out of line. Ты не переходишь границу (просьба уместна)", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Want me to put you in touch? Хочешь, я вас свяжу?", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Just say when. Просто скажи когда", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "That's a lot to worry about. Есть о чём беспокоиться", "s": "Модуль 4 · Работа/Медицина · урок 15", "u": "lesson-04-15.html", "ti": "Урок 15 (Модуль 4) — 🏠 Разговор с соседом (casual, 19.08)"}, {"t": "Сцена: утренняя конференция, 20 врачей. Ты докладываешь свой случай: мужчина 58 лет, острый панкреатит, на третий день — септический шок, ИВЛ. Ретроспективно: антибиотики начали на 18 часов позже , чем следовало.", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "Задача урока: признать ошибку профессионально — не оправдываясь и не занимаясь самобичеванием. Грамматика в бою: should have + V3 , третий тип условных.", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "Оппоненты: Dr. Weiss (заведующий, ведёт конференцию), Dr. Patel (из зала, резко).", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "🎬 Полный диалог — как он прошёл", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "✍️ Тот же доклад — как сказал бы носитель", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "💡 Последняя фраза превращает критика в соавтора . Самый сильный ход на M&M.", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "🎯 ГЛАВНАЯ ЛИНИЯ УРОКА: уход от прямых вопросов в общие формулировки", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "Спросили Ответил", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "What was his lactate on day two? «lactate was overlooked» — цифра не названа", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "Did anything change overnight? ⬜ пропущено", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "Was anyone watching, or picked up on the round? ⬜ пропущено", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "What changes from Monday? «we have to change our protocol» — без сроков", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "Цифры и моменты не названы ни разу. В M&M это читается хуже самой ошибки — коллеги видят не ошибку, а нежелание её конкретизировать.", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "📌 Правило: называй цифру и называй момент. «Мы недосмотрели» = размывание. «2.1 на поступлении, 4.6 к полуночи, заметили утром» = профессионал.", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "⚠️ Это та же линия, что и в small talk (уроки 13–15): там пропускались «лишние» вопросы, здесь — неудобные. Механизм один: отвечать только на то, что сам считаешь главным.", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "🎯 Вторая находка: риторический вопрос вместо признания", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "В докладе ни разу не прозвучало «we should have» — хотя это была прямая заготовка. Вместо этого — риторический вопрос: «if we had started antibiotics earlier, would we have prevented...?»", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "Вопрос безопаснее — он не требует признания.", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "📌 Формула для M&M:", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "Не «мы следовали правилам», а «правила не спасли конкретно его».", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "⚠️ И might , не would : this might have gone differently . В M&M категоричность = слабость позиции.", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "✅ Что получилось — заметный сдвиг", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "Ход Почему сильно", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "Lactate was overlooked. прямое признание, пассив уместен (не сваливаешь на конкретного человека)", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "We should have paid more attention. грамматика т.9 в ок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "the protocol said for us not to give the protocol doesn't recommend antibiotics in this setting калька — протокол не «говорит кому-то»", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "deteriorated to septic shock deteriorated into · went into septic shock", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "We had to pay more attention We should have paid more attention had to = вынужден И СДЕЛАЛ; should have = надо было, но не сделали", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "checked it often checked it more often сравнение", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "on antibiotics, it wouldn't happen it might not have happened прошлое + might , не would", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "its importance cannot be minimized and that mattered · and it shouldn't have been книжная конструкция из статьи", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "We should to change it We should change it ⚠️ после модального НИКОГДА нет to", "s": "Модуль 4 · Работа/Медицина · урок 16", "u": "lesson-04-16.html", "ti": "Урок 16 (Модуль 4) — ⚕️ Morning report: разбор осложнения (M&M, 20.08)"}, {"t": "I'll try to find something I'll bring a proposal to next week's meeting try ослабляет ых идей. Не для чужого болезненного вывода и не для двора (урок 15). Регистр: переговорная.", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "✅ Сильные ходы — их много", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Ход Почему сильно", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "I get it (первой фразой) снял неловкость сразу", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Only 1 or 2% of startups succeed снял с друга стыд , превратив провал в статистику", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "I've got you применил ровно по назначению (двумя днями раньше переводил неверно!)", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "5 000 вместо 15 000 + Does that work for you? честно, конкретно, без вранья, не оставил гадать", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "That's a million-dollar question идиома, которой я не давал — вытащил сам", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Не бросился давать план понял, что другу нужно выговориться, а не решение", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "You're not stupid прямо, без обходов", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Отреагировал на признание про жену (следующим ходом) подхватил то, что пропустил", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "🔧 Языковые правки", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "❌ Сказал ✅ Правильно Почему", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "I see how many times you put in your baby I know how much you put into it · how much you poured into that thing how many times = сколько раз", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "I wanna be fair with you I want to be straight with you · I'll be honest with you fair to someone; «начистоту» = straight with", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "We are in 2026 It's 2026, not 2005. калька", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "dot com, everyone succeded Back in the dot-com days , everybody made it телеграфно + опечатка (succeeded)", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "There is no right answer? There's no right answer. утверждение, не вопрос", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Don't leave her without answers Don't leave her in the dark · Don't make her guess калька, звучит юридически", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "I was surprised to hear it I had no idea. · I didn't know things were that bad. отстранённо", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "It's what I can do now That's what I can do right now", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "your startup went well your startup was going well оно провалилось → Continuous", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "What about me? Me? Same old, same old. Дан уже спросил — повтор лишний", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Don't give up You don't have to figure it out tonight. конкретнее и теплее", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "💊 Фразовые глаголы (грамматика т.11) — в бою", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Принцип: два английских в одном языке. Левая колонка = доклад, правая = разговор.", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Книжный (латинский) Разговорный (фразовый)", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "to postpone to put off", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг про  pick up an infection · to rule out · to follow up · to hold off on · to back off on the pressors · to keep an eye on", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "⚠️ Разделяемые и неразделяемые", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Разделяемые: Let's rule out sepsis = Let's rule sepsis out ✅ оба верны", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Но местоимение — только в середину: Let's rule it out ✅ · rule out it ❌", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Неразделяемые: I ran into him ✅ · ran him into ❌", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "🔄 «Скажи это трижды» — несогласие", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "1️⃣ Заведующему при коллегах ✅ (лучшая версия дня)", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "💡 Лестница вежливого несогласия: признать → согласиться с логикой → мягко усомниться → предложить конкретный следующий шаг .", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "2️⃣ Коллеге-ровеснику", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "⚠️ out of line ≠ «ты неправ»! Это «ты переходишь границы, ведёшь себя неподобающе» — обвинение в поведении . (Ср. урок 15: Майк спрашивал «tell me if I'm out of line» — не наглость ли просьба.)", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "⚠️ in this question → on this · on this one", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "3️⃣ Другу, который несёт чушь", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "⚠️ It's not your thing = «ты в этом не разбираешься» — в баре прозвучит как «молчи, ты тупой».", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "⚠️ HiTech it's not a medicine → Hi-tech isn't medicine (двойное подлежащее — калька)", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "📌 Наблюдение дня: сегодня лучшей была формальная версия, а неформальные съехали — обратно прошлым разам. Причина: точность идиом . Формальный регистр строится из простых слов, ошибиться сложнее. Казуальный держится на идиомах, и каждая — с точным смыслом. Идиому надо знать с ситуацией употребления, а не только с переводом.", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "📌 Новые фразы урока", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Фраза Перевод", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "to lend someone money дать взаймы (≠ borrow!)", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "I want to be straight with you. Скажу начистоту", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Trust your gut. / Go with your gut. Доверяй чутью", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Don't leave her in the dark. Не держи её в неведении", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "She might surprise you. Она может тебя удивить", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "That's a million-dollar question. Вопрос на миллион", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "I had no idea. Я понятия не имел", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Does that work? Тебя устроит?", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "That's what I can do right now. Это всё, что я могу сейчас", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Yeah... maybe it is. Да... возможно (на горькое признание)", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Somebody's got to. Кто-то же должен", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "to make it (о стартапе) добиться успеха", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "to pour into something вложиться во что-то", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "to run out of runway кончились деньги/время (стартап-сленг)", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "to burn through savings проедать сбережения", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "I was on call. Я был на дежурстве (не on call duty )", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "My phone didn't ring once. Ни одного звонка", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "the Q-word (quiet) «тихая смена» — плохая примета в ICU 😄", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "I think you're wrong on this one. Думаю, тут ты неправ", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "That's not how it works. Это так не работает", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Let me get back to you. Вернусь с ответом", "s": "Модуль 4 · Работа/Медицина · урок 17", "u": "lesson-04-17.html", "ti": "Урок 17 (Модуль 4) — 💸 Друг просит денег (casual, 21.08)"}, {"t": "Сцена: мистер Harrison , 64, тяжёлая пневмония, сатурация падает, нужна интубация в ближайшие часы. В сознании, полностью адекватен — и отказывается. Бывший инженер, живёт один, сын в Канаде, не общаются.", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "Задача урока: уговорить, не давя . Автономия пациента — его право. Понять почему , прежде чем убеждать.", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "🎬 Полный диалог — как он прошёл", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "✍️ Тот же разговор — как сказал бы носитель", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "🎯 ГЛАВНАЯ ЛИНИЯ: на прямой вопрос — прямой ответ", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "Харрисон спросил: «And if I say stop — you stop? Even if you think I'm wrong?» — односложный вопрос о власти : кто решает.", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "Ответ прозвучал: «I'll do all my best. I promise you» — про усилия , а не про власть.", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "📌 Правило: чем прямее вопрос, тем короче должен быть ответ. «Yes» — полноценный ответ. «Я сделаю всё возможное» — уклонение. На вопрос об автономии любая мягкость читается как «нет».", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "⚠️ Та же линия, что в уроке 16 (M&M): там не назвал цифру лактата, здесь не сказал «да». Уход от конкретного в общее.", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "⚠️ Три критических места", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "Сказал Как услышал Харрисон ✅ Надо", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "I understand your fears and worries «вы просто испугались, я вас переубежу» — а он только что сказал «I'm not confused, I'm not depressed» I hear you. And I'm not going to give you the speech. · You've clearly thought about it.", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "I'm not familiar with your father's case отца назвали «случаем» — медицинский термин про близкого человека I didn't know your father, and I'm not going to pretend I did.", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "I'll do all my best . I promise you. ровно то, что говорили его матери шесть недель подряд Yes. Even if I think you're wrong.", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "📌 Правило: не называй чужие чувства, пока он сам их не назвал. Особенно если он их только что отрицал.", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "🎯 Вторая находка: страх не додуман до конца", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "Харрисон боится не трубки . Он боится трёх конкретных вещей:", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "Страх Инструмент", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "«это навсегда» (у отца — шесть недель) time-limited trial — терапия с оговорённым сроком, записанным в карту", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "«будут врать: ещё пару дней» обещание говорить правду первым, даже плохую", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "«не смогу сказать хватит» advance directive , оформленный сегодня, пока он говорит", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "На каждый страх есть точный ответ. Общие слова о шансах («you have a good chance to survive») их не закрывают.", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "⚠️ Рискованный ход: предложение позвонить сыну — до того, как выяснена причина отказа. Они не общаются; для Харрисона это может прозвучать как «раз вы неразумны, я позову родственника надавить». Возможно, сын и есть часть причины.", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "✅ Сначала: Help me understand — what's behind the \"no\"? Позже, если уместно: Is there anyone you'd want here?", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "✅ Сильные ходы", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "Ход Почему", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "Спросил «почему» , а не начал переубеждать правильная тактика при отказе от лечения", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "If I were you, I'd feel the same снял противостояние; грамматика т.8 автоматически", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "The tube is just a tool сняло с трубки статус приговора (хотя он вернул это слово против тебя)", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "It's reversible ключевое слово, которое ему нужно было услышать", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "Не защищал медицину после рассказа об отце естественная реакция «сейчас всё иначе» — сдержана", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "Yes, five days, and it's written down повторил его условие дословно — он услышал своё обратно", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "Среагировал на «nobody asked him» ✅ вчерашняя находка про эмоцио }, {"t": "to put up with терпеть, выносить (≠ справиться!)", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "to deal with справиться, разобраться", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "to cope with справляться с нагрузкой", "s": "Модуль 4 · Работа/Медицина · урок 18", "u": "lesson-04-18.html", "ti": "Урок 18 (Модуль 4) — 🚫 Пациент отказывается от интубации (22.08)"}, {"t": "Сцена: обед у родителей жены. Григорий , 72, бывший инженер, репатриант из Москвы, 30 лет в Израиле, год жил в Штатах — английский хороший. Сегодня в настроении поспорить.", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Задача урока: удержать семейный регистр в споре. Не переходить в лекцию, не защищаться профессионально. Это тесть, а не Dr. Patel.", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "🎬 Полный диалог — как он прошёл", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "✍️ Тот же разговор — как сказал бы носитель", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "🎯 ГЛАВНАЯ ЛИНИЯ — третий день подряд: личный вопрос → общий ответ", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Спросили Ответил", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Should my grandson go to medical school? «медицина не умрёт» — без «почему»", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Is it worth it, Eduard? «если хочешь преуспеть, надо работать» — обобщение вместо «я»", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "My daughter says you work too much ⬜ не отреагировал, что жена жалуется отцу", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "📌 Три дня подряд, один механизм: урок 17 — Дан («жена на пределе»), урок 18 — Харрисон («вы остановитесь?»), урок 19 — тесть.", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "💡 Гипотеза уточняется: это не про эмоции вообще. Это про вопросы о тебе самом . Про пациента, про работу, про деньги — отвечаешь конкретно. Про себя — обобщаешь.", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "⚠️ Отдельно: «My daughter says you work too much» — это не информация, а сигнал : жена жалуется отцу. Нужна была реакция:", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "⚠️ I couldn't agree more — ЧЕТВЁРТЫЙ промах", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Когда Что услышали", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "урок 15 (соседу во дворе) слишком формально для двора", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "урок 17 (Дан: «это и есть проблема») «да, ты и правда виноват»", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "урок 19 (Григорий о своём сожалении) бодрое «отлично сказано!» на чужую боль", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "📌 Фраза — только для энтузиазма : хорошие новости, удачные идеи. Закономерность: она берётся каждый раз, когда собеседник говорит что-то тяжёлое и личное — видимо, как «я тебя услышал». А читается противоположно.", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Чем заменить: That's the part that scares me · I hear that a lot, and it lands · просто Hm. + пауза", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "🔧 Языковые правки", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "❌ Сказал ✅ Правильно Почему", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "this issue comes up in our discussions at work We talk about this at work all the time · It comes up a lot регистр протокола за семейным столом", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "You are absolutely right You're not wrong · That part's true формула совещания", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "about the diagnosing, tiring and mistakes the diagnosis part, the fatigue, the mistakes три разные части речи в одном ряду", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "it'll take at least 5-10 years I'd say we're ten years away from that подлежащее пропало — что займёт?", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "I don't think medicine is going to die medicine's not dying · it's not going anywhere", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "if you want to succeed at what you do if I want to be good at this, it costs ушёл в «человека вообще», когда спросили про НЕГО", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Nothing in life is free Something's got to give · You can't have it all поговорка из учебника", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "You're right about ∅ kids about the kids те самые, его", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "I won't let that happen with my kids to my kids · мягче: I'll try not to make the same mistake предлог + звучит самоуверенно после чужого признания", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "I'm sorry to hear about your son That's rough, Grigory. · Twice a year... that's hard. формально для стола", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "⚠️ Противоречие: сказал «It's not worth it» , а через два предложения — «надо работать, ничего не даётся даром». Если мысль «оно того не стоит, но по-другому не выходит», так и говори:", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "🍷 Тосты — как отвечать", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Григорий произнёс два пожелания: за здоровье и за то, чтобы дети росли с отцом. Ответ «спасибо, л'хаим» принимает, но не возвращает .", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "💡 L'chaim вместо cheers в этой семье — точное попадание по регистру.", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "✅ Сильные ходы", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Ход Почему", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Признал правоту про ИИ , не защищая профессию самая честная позиция — и самая убедительная", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "I'm missing out on a lot ради этого признания тесть и спрашивал", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Не отшутился на «is it worth it» тяжёлую тему принял всерьёз", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Thanks for telling me. I'll talk to her. правильная реакция на переданный сигнал", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "It's not as simple as it seems неделю назад было as seems — конструкция исправлена ✅", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "💊 Косвенная речь (грамматика т.13) — в бою", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Правило: прошлое снаружи → прошлое внутри.", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Прямая речь Косвенная", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "\"I am tired.\" He said he was tired", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "\"We started antibiotics.\" They said they had started antibiotics", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "\"I will call you.\" He said he would call me", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "\"I can do it.\" He said he could do it", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Механика: present → past · past → had + V3 · will → would · can → could · may → might", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Не сдвигаются: would, could, should, might, had — уже сдвинуты.", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "⚠️ Вопрос в косвенной речи теряет вопросительный вид", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Механика: убрать кавычки → добавить if/whether → подлежащее вперёд → сдвинуть время. Знака вопроса в конце нет.", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "⚠️ say vs tell", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "tell someone something (адресат обязателен) · say something ( to someone)", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "✅ He told me he was leaving · ❌ <s>He said me</s>", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Указатели времени", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "today → that day · yesterday → the day before · tomorrow → the next day · now → then · here → there", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "✅ Когда сдвиг не нужен", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Если факт всё ещё верен : He said the ICU is full · The nurse said the patient is refusing the tube ✅", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "📌 Новые фразы урока", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Фраза Перевод", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "You're not wrong. Ты не то чтобы неправ (согласие с зазором)", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "That's the part that scares me. Вот это меня и пугает", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "Something's got to give. Чем-то приходится жертвовать", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "You can't have it all. Всего сразу не бывает", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "I'll drink to that. За это выпью", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t": "That's rough. Тяжело (короткое сочувствие)", "s": "Модуль 4 · Работа/Медицина · урок 19", "u": "lesson-04-19.html", "ti": "Урок 19 (Модуль 4) — 🍷 Воскресный обед с тестем (casual, 23.08)"}, {"t":  "My door is open. Always. Моя дверь всегда открыта", "s": "Модуль 4 · Работа/Медицина · урок 20", "u": "lesson-04-20.html", "ti": "Урок 20 (Модуль 4) — 👩‍⚕️ Медсестра приходит с претензией (24.08)"}, {"t": "I'd rather be woken up for nothing. Лучше зря разбудите", "s": "Модуль 4 · Работа/Медицина · урок 20", "u": "lesson-04-20.html", "ti": "Урок 20 (Модуль 4) — 👩‍⚕️ Медсестра приходит с претензией (24.08)"}, {"t": "I'd push back on one thing. Тут я поспорю", "s": "Модуль 4 · Работа/Медицина · урок 20", "u": "lesson-04-20.html", "ti": "Урок 20 (Модуль 4) — 👩‍⚕️ Медсестра приходит с претензией (24.08)"}, {"t": "For what it's worth... Как бы то ни было", "s": "Модуль 4 · Работа/Медицина · урок 20", "u": "lesson-04-20.html", "ti": "Урок 20 (Модуль 4) — 👩‍⚕️ Медсестра приходит с претензией (24.08)"}, {"t": "Life is passing me by. Жизнь проходит мимо", "s": "Модуль 4 · Работа/Медицина · урок 20", "u": "lesson-04-20.html", "ti": "Урок 20 (Модуль 4) — 👩‍⚕️ Медсестра приходит с претензией (24.08)"}, {"t": "It's been eating at me. Это меня грызёт", "s": "Модуль 4 · Работа/Медицина · урок 20", "u": "lesson-04-20.html", "ti": "Урок 20 (Модуль 4) — 👩‍⚕️ Медсестра приходит с претензией (24.08)"}, {"t": "to recharge перезарядиться", "s": "Модуль 4 · Работа/Медицина · урок 20", "u": "lesson-04-20.html", "ti": "Урок 20 (Модуль 4) — 👩‍⚕️ Медсестра приходит с претензией (24.08)"}, {"t": "take it from there дальше по ситуации", "s": "Модуль 4 · Работа/Медицина · урок 20", "u": "lesson-04-20.html", "ti": "Урок 20 (Модуль 4) — 👩‍⚕️ Медсестра приходит с претензией (24.08)"}, {"t": "It would make a real difference. Это бы серьёзно помогло", "s": "Модуль 4 · Работа/Медицина · урок 20", "u": "lesson-04-20.html", "ti": "Урок 20 (Модуль 4) — 👩‍⚕️ Медсестра приходит с претензией (24.08)"}, {"t": "Сцена: пятница, 19:30. Вышел вовремя. Tom , сосед (тот же, что в уроке 15), стоит у машины с открытым капотом и не понимает, что делает.", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Задача урока: держать лёгкий регистр . Никаких пациентов, никакой ответственности. Разговор двух мужиков у подъезда.", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Контекст: после четырёх тяжёлых дней подряд (M&M, деньги, отказ от интубации, тесть, медсестра) — разгрузка.", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "🎬 Полный диалог", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "✅ ЛУЧШИЙ ДЕНЬ ПО РЕГИСТРУ", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Ход Почему", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Less than you, probably. I'm a doctor, Tom — I break things. самоирония + шутка, сразу в тон", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "It is what it is 💎 вытащил САМ , не из подсказки", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "I'm in. Just say when. 💎 лучший блок диалога — коротко, тепло, без вежливой воды", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Say hi to your wife for me предлог for на месте (многие теряют)", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Easier said than done идиома к месту", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "What about you? 🔄 мяч вернул САМ — второй раз без напоминания", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Nothing out of the ordinary (разминка) уже не B2", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Can't complain (разминка) с выкинутым «I»", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "📌 ГЛАВНЫЙ СДВИГ: в начале диалога давал советы («take it to the auto shop»), к середине начал спрашивать. Переключение произошло внутри одного разговора.", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "⚠️ ЛИНИЯ ДНЯ: «решать» вместо «разговаривать»", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Ход 1: Том пошутил над собой → ты дал инструкцию («don't touch anything, take it to the auto shop»).", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Он не приносил проблему. Он завязывал разговор.", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "📌 Это зеркало уроков 17–20. Там — уход от личного в общее. Здесь — из лёгкого в деловое. Один механизм: разговор без ясной задачи → надо придать ему задачу.", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "⚠️ И он тебя об этом не просил. Ты сам предложил решение — ровно то, за что критикуют дома.", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "💡 Что сказал бы носитель:", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Один встречный вопрос — и разговор поехал. Никаких советов.", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Или ещё легче: So what's the plan, you just stare at it till it feels bad?", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "⚠️ ВТОРАЯ ЛИНИЯ — «we» вместо «I», ПЯТЫЙ ДЕНЬ", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Том: «Я сказал жене, что справлюсь. Стою полтора часа.»", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Ты: «Sometimes we have to listen to our wives.»", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Он про себя — ты про всех мужей . Плюс have to превратило шутку в мораль.", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "💡 Как отвечают на такое (он подставился под подкол — присоединяйся, а не поучай):", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "📌 Формула: `I` или `you`, но не `we` в смысле «все мужчины».", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "💡 А `we` в шутке работает: «are we pretending» — это «мы двое, прямо сейчас».", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Тот же уход на прямой вопрос", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Том: «Чья была идея — твоя или жены?»", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Ты: both → that's not so simple → easier said than done — три уклончивые фразы подряд, ни одной детали.", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "⚠️ Это была самая безопасная точка недели. Пиво, двор, пятница, он сам сказал «мне всегда было интересно». И она тоже закрылась.", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "💡 Одна деталь всё меняла:", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Это не исповедь . Это одна конкретная фраза вместо трёх общих.", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "⚠️ ТРЕТЬЯ — вопросительный порядок слов", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "Дважды за день: ❌ When she admitted? (блиц) · ❌ You could do it? (диалог)", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "В вопросе глагол выходит вперёд. Пока не автоматически.", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "When she admitted? When was she admitted? (пассив: её госпитализировали)", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "You could do it? Could you do it? · Could you see yourself doing it?", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "📌 Сравни: When did she arrive ? (активный — пришла сама) vs When was she admitted ? (пассив — её положили).", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "🔧 Языковые правки", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "❌ Сказал ✅ Правильно Почему", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "As you always know As you know · Same as always калька; always лишнее", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "I'm sitting and learning English I sit in my office and do my English привычка = Simple, не Continuous", "s": "Модуль 4 · Работа/Медицина · урок 21", "u": "lesson-04-21.html", "ti": "Урок 21 (Модуль 4) — 🍺 Сосед у машины: пиво в пятницу (26.08)"}, {"t": "learning English doing/practicing my English learning = «изучаю с нуля»", "s": "Мод
