-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Guess what? Знаешь что? / Угадай! заводит историю — как «прикинь!»", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Seriously? / Are you sure? Серьёзно? / Ты уверен?", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "I'm serious. Я серьёзно", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "That's crazy. С ума сойти не «безумие» — просто «ничего себе»", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "That's weird. Это странно", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "That's awesome. / That's great. Это круто / здорово ⚠️ awesome = потрясающий (не «ужасный»!) — твоя ошибка 15.08", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "That's funny. Смешно / забавно", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "That's interesting. Интересно", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Here we go again. Ну опять двадцать пять с лёгким раздражением", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Lucky you! Везёт тебе!", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Good for you. Молодец / рад за тебя ⚠️ тоном решает всё : искренне — похвала, сухо — сарказм", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "It happens. Бывает", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "That's life. Такова жизнь", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "It is what it is. Ну, как есть смирение с тем, что не изменить", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "4. Извинения и утешение", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Фраза Перевод ⚠️ Нюанс", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "My bad. Моя вина, каюсь очень неформально — с друзьями, не с начальством", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "No worries. Не переживай / Да ничего", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "No big deal. / It's not a big deal. Ничего страшного", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Don't worry about it. Не переживай об этом", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Never mind. Неважно / Забудь ✅ знаешь", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Forget it. Забудь / Проехали чуть резче", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "You're welcome. Пожалуйста (в ответ на спасибо)", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "You got this. Ты справишься! поддержка перед трудным", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Keep going. Продолжай, не сдавайся", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "5. Связки в речи — самые полезные для тебя", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Фраза Перевод ⚠️ Нюанс", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "I mean... В смысле... / Я имею в виду 💡 связка №1 — даёт секунду подумать и переформулировать", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "By the way... Кстати ✅ знаешь", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "To be honest... Честно говоря ✅ знаешь", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "As far as I know... Насколько я знаю осторожное утверждение", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Believe me. / Trust me. Поверь мне", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "That's the point. В том-то и дело", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Kind of. / Sort of. Вроде того / Типа 💡 в речи звучит «kinda / sorta»", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "I suppose so. Наверное, да", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "You never know. Как знать / Мало ли", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Let's see. Посмотрим", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Time will tell. Время покажет", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "At least... По крайней мере", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "That's enough. Хватит / Достаточно ⚠️ резко, если про поведение", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "6. Паузы и переспрос", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Фраза Перевод ⚠️ Нюанс", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Hang on. / Hold on. Погоди / Секунду hang on — чуть неформальнее", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "I get it. Понял, дошло = я уловил мысль (не «я согласен»)", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Not yet. Ещё нет", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Right now. Прямо сейчас", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "7. Прощание и вежливость", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Фраза Перевод", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Take care. Береги себя ✅", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Keep in touch. Будем на связи ✅", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Long time no see. Сколько лет, сколько зим ✅", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Better late than never. Лучше поздно, чем никогда", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Easier said than done. Легче сказать, чем сделать", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "I can't wait. Не могу дождаться", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "I hope so. Надеюсь", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "8. Осторожно! Три фразы с подвохом", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Фраза Что кажется Что на самом деле", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "I don't care. «Мне всё равно» (нейтрально) ⚠️ звучит грубо — «плевать». Нейтрально: I don't mind / It doesn't matter to me", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Whatever. «Как угодно» ⚠️ пренебрежение, почти «отвяжись»", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Why would I? «Зачем мне?» ⚠️ вызов , звучит враждебно. Нейтрально: Why should I? / What for?", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "🎯 Твои 10 приоритетных (бери в речь первыми)", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Эти закроют больше всего «письменных» мест в твоём разговоре:", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "1. I mean... — переформулировать на ходу", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "2. Kind of / sort of — смягчить утверждение («вроде того»)", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "3. Fair enough. — принять чужой аргумент", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "4. Not really. — мягко не согласиться", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "5. No worries. — вместо формального «that's all right»", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "6. I get it. — вместо «I understand» в неформальной беседе", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "7. Works for me. — вместо «that's suitable for me»", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "8. It is what it is. — вместо длинного объяснения смирения", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "9. You've got a point. — частичное согласие в споре", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "10. Guess what? — начать историю (вместо «I want to tell you that...»)", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "💡 Как их осваивать", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Не зубрить — вставлять . Правило: в каждой нашей сессии употреби минимум 3 фразы из этого списка . Я буду отмечать, какие ты применил, и подсказывать, где просилась ещё одна.", "s": "Модуль Everyday English 💬 · урок 1", "u": "lesson-06-01.html", "ti": "💬 Модуль Everyday English — Урок 1: 90 коротких реакций"}, {"t": "Правила — не из учебника, а «как это чувствует носитель». Каждая тема — 3 минуты. Примеры — из моей собственной речи (и моих ошибок 😄). Страница растёт: одна капля за сессию.", "s": "💊 Грамматика", "ti": "Грамматика", "u": "grammar.html"}, {"t": "В русском одно прошедшее время. В английском — три «камеры», которые смотрят на прошлое по-разному.", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "📷 Камера 1: went — «точка на линии времени»", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "Что-то случилось ТОГДА. Есть (или подразумевается) слово «когда»: ago, yesterday, last year, in 2024.", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "I went to Thailand two years ago. — съездил тогда", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "We arrived in Phuket on Monday. — прибыли в понедельник", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "Yesterday his condition deteriorated. — ухудшилось вчера", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "📷 Камера 2: have been / have done — «что у меня в рюкзаке к этому моменту»", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "Не «когда это было», а «что я имею СЕЙЧАС»: опыт, результат, счёт в игре. Слово «когда» НЕ называется — иначе см. камеру 1!", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "I've been to Thailand before. — у меня в рюкзаке есть опыт Таиланда (когда — неважно)", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "I've finished the book. — результат: книга дочитана", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "My bag hasn't arrived. — результата нет ДО СИХ ПОР", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "⚠️ Моя упрямица: I have been to Thailand two years ago — нельзя! «two years ago» включает камеру 1: I WENT to Thailand two years ago. Perfect и ago несовместимы: ago прибивает событие к точке, а Perfect принципиально «без точки».", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "📷 Камера 3: have been doing — «плёнка ещё крутится»", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "Процесс начался в прошлом и ТЯНЕТСЯ до сих пор. Часто с for (уже сколько) и since (с какого момента).", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "I've been waiting for this trip for a long time. — ждал и вот дождался", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "We've been living in Israel for a few years. — жили и живём", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "I've been practicing English since July. — начал и продолжаю", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "Тройка been — выучить блоком (мой отпускной трофей 🏆)", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "Фраза Смысл", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "I've been TO Thailand (before) съездил, бывал — опыт в рюкзаке", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "We've been IN Thailand for a week находимся тут уже неделю", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "I went to Thailand two years ago точка в прошлом", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "Мини-шпаргалка «3-я форма» (для камеры 2 и пассива)", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "go → went → gone · be → was/were → been · see → saw → seen · take → took → taken · steal → stole → stolen (my phone was stolen!) · give → gave → given · do → did → done · eat → ate → eaten", "s": "💊 Грамматика", "ti": "Тема 1. Три способа говорить о прошлом (went / have been / have been doing)", "u": "grammar.html#t1"}, {"t": "Настоящее время в английском — это два режима + один стоп-лист.", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "⚙️ Режим 1: I do — «настройки по умолчанию»", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "Привычки, расписания, факты. Маркеры: every day, usually, always, never, «вообще».", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "I work out every day. — привычка", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "I don't like watching TV. — факт обо мне", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "The restaurant opens at seven. — расписание", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "Thai drivers try to talk to me. — так происходит всегда (моя фраза ✓!)", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "📺 Режим 2: I'm doing — «прямой эфир»", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "Происходит прямо сейчас — или временно «в эти дни». И ещё: близкие планы!", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "My wife and son are still sleeping. — прямо сейчас (моя фраза ✓!)", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "We're staying at a hotel near the beach. — временно, в эти дни", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "I'm reading a great book. — «в этот период» (не обязательно в эту секунду)", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "Tomorrow we're going island hopping. — план уже в календаре", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "⚠️ Мои реванши: We don't give up → We're not giving up (борьба идёт прямо сейчас!); we do our best → we're doing our best .", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "📸 Стоп-лист: глаголы-фотографии — НИКОГДА в -ing", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "Это не действия, а состояния. Действие можно «снимать на видео», состояние — только сфотографировать:", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "understand · know · believe · like · love · hate · want · need · remember · mean · seem", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "I understand you. (не I'm understanding — мой реванш из family meeting!)", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "I know. / I want. / I need. / I remember.", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "🎭 Два хитрых глагола — меняют смысл с -ing", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "Без -ing (состояние) С -ing (процесс)", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "I think it's the right decision. — считаю I'm thinking about your offer. — обдумываю сейчас", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "I have a car. — владею (никогда -ing!) I'm having dinner / a great time. — процесс", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "Поэтому «I'm having a great time in Phuket» — правильно, хотя have. А McDonald's «I'm loving it» — намеренное нарушение ради сленга 😄", "s": "💊 Грамматика", "ti": "Тема 2. «-ing или не -ing» (I do / I'm doing / I understand)", "u": "grammar.html#t2"}, {"t": "Одна идея: пассив — когда важно ЧТО случилось, а не КТО сделал. Виновник неизвестен, неинтересен или очевиден.", "s": "💊 Грамматика", "ti": "Тема 3. Пассив без страха (was stolen / was discharged)", "u": "grammar.html#t3"}, {"t": "Формула: be (в нужном времени) + 3-я форма.", "s": "💊 Грамматика", "ti": "Тема 3. Пассив без страха (was stolen / was discharged)", "u": "grammar.html#t3"}, {"t": "Активный (кто сделал) Пассивный (что случилось)", "s": "💊 Грамматика", "ti": "Тема 3. Пассив без страха (was stolen / was discharged)", "u": "grammar.html#t3"}, {"t": "Someone stole my phone My phone was stolen. ← кто украл — неизвестно", "s": "💊 Грамматика", "ti": "Тема 3. Пассив без страха (was stolen / was discharged)", "u": "grammar.html#t3"}, {"t": "The doctor discharged her She was discharged. ← врач очевиден", "s": "💊 Грамматика", "ti": "Тема 3. Пассив без страха (was stolen / was discharged)", "u": "grammar.html#t3"}, {"t": "They overcharged me I was overcharged. ← кто в кассе — неважно", "s": "💊 Грамматика", "ti": "Тема 3. Пассив без страха (was stolen / was discharged)", "u": "grammar.html#t3"}, {"t": "The airline cancelled the flight My flight was cancelled.", "s": "💊 Грамматика", "ti": "Тема 3. Пассив без страха (was stolen / was discharged)", "u": "grammar.html#t3"}, {"t": "Набор «be» по временам", "s": "💊 Грамматика", "ti": "Тема 3. Пассив без страха (was stolen / was discharged)", "u": "grammar.html#t3"}, {"t": "сейчас: is/are — Breakfast is served from 7 to 10", "s": "💊 Грамматика", "ti": "Тема 3. Пассив без страха (was stolen / was discharged)", "u": "grammar.html#t3"}, {"t": "прошлое: was/were — My bag was lost", "s": "💊 Грамматика", "ti": "Тема 3. Пассив без страха (was stolen / was discharged)", "u": "grammar.html#t3"}, {"t": "рюкзак 📷: has been — He has been admitted to the ICU", "s": "💊 Грамматика", "ti": "Тема 3. Пассив без страха (was stolen / was discharged)", "u": "grammar.html#t3"}, {"t": "будущее: will be — You' ll be contacted tomorrow", "s": "💊 Грамматика", "ti": "Тема 3. Пассив без страха (was stolen / was discharged)", "u": "grammar.html#t3"}, {"t": "⚠️ Моя классика: she discharged → she WAS discharged (иначе «она сама себя выписала» 😄).", "s": "💊 Грамматика", "ti": "Тема 3. Пассив без страха (was stolen / was discharged)", "u": "grammar.html#t3"}, {"t": "💡 Где пассив живёт больше всего: медицина (was intubated, was admitted, was weaned off), сервис (your card was declined, the room is being cleaned), новости и объявления (flights have been delayed).", "s": "💊 Грамматика", "ti": "Тема 3. Пассив без страха (was stolen / was discharged)", "u": "grammar.html#t3"}, {"t": "В русском артиклей нет — поэтому правило одно, и оно про СЛУШАТЕЛЯ.", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "🎯 Главный вопрос: «Слушатель уже знает, о чём я?»", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "Ситуация Артикль Пример", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "Ввожу впервые — один из многих a / an There's a fire show tonight.", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "Уже упомянул / оба знаем / единственный the The show was amazing.", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "Категория вообще (мн.ч./неисчисляемое) ∅ ничего I like ∅ biographies. ∅ Traffic is heavy.", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "🧭 Три теста", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "«Один из многих»? → a (I'm a doctor · a Thai tradition)", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "«Тот самый / единственный»? → the ( the sun · the ICU · the patient)", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "«Вообще, как класс»? → ∅ (I like coffee · Doctors work hard)", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "⚠️ Мои реальные ошибки", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "Было Правильно Тест", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "in new country in a new country одна из многих", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "a right decision the right decision оно одно", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "Haggling is the Thai tradition a Thai tradition одна из многих", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "a patient was admitted (тот самый) THE patient оба знаем, о ком речь", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "we put a project on hold the project наш конкретный", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "the time flies ∅ time flies «время» вообще", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "we had a dinner ∅ dinner приёмы пищи без артикля", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "went to the home went ∅ home home без предлога и артикля!", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "I like histories ∅ history предмет — неисчисляемое", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "💡 Всегда без артикля", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "приёмы пищи (have lunch ) · языки (speak English ) · спорт (play tennis ) · большинство стран ( Israel , Thailand ) · home / work / bed в устойчивых (go home , at work , in bed )", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "🔑 Моя личная слабость (10.08): беру a по привычке там, где нужно the («тот самый»: THE patient, THE project). И забываю ∅ в have dinner / go home.", "s": "💊 Грамматика", "ti": "Тема 4. Артикли a / the за 3 минуты", "u": "grammar.html#t4"}, {"t": "🎯 Правило: действие в роли подлежащего → -ing", "s": "💊 Грамматика", "ti": "Тема 5. Герундий-подлежащее (Moving here was challenging)", "u": "grammar.html#t5"}, {"t": "Русский ✅ Английский ❌ Не так", "s": "💊 Грамматика", "ti": "Тема 5. Герундий-подлежащее (Moving here was challenging)", "u": "grammar.html#t5"}, {"t": "Переехать сюда было непросто Moving here was challenging To move here was", "s": "💊 Грамматика", "ti": "Тема 5. Герундий-подлежащее (Moving here was challenging)", "u": "grammar.html#t5"}, {"t": "Торговаться — тайская традиция Haggling is a Thai tradition To haggle is", "s": "💊 Грамматика", "ti": "Тема 5. Герундий-подлежащее (Moving here was challenging)", "u": "grammar.html#t5"}, {"t": "Работать в реанимации — стресс Working in the ICU is stressful To work in the ICU is", "s": "💊 Грамматика", "ti": "Тема 5. Герундий-подлежащее (Moving here was challenging)", "u": "grammar.html#t5"}, {"t": "📌 Ещё два места, где всегда -ing", "s": "💊 Грамматика", "ti": "Тема 5. Герундий-подлежащее (Moving here was challenging)", "u": "grammar.html#t5"}, {"t": "1. После предлога — без исключений: Thanks for coming · interested in working here · before making a decision. ⚠️ Ловушка: look forward TO SEEING you — здесь to это предлог!", "s": "💊 Грамматика", "ti": "Тема 5. Герундий-подлежащее (Moving here was challenging)", "u": "grammar.html#t5"}, {"t": "2. После глаголов: enjoy, avoid, finish, keep, mind, suggest, consider, practice — I enjoy reading · Do you mind waiting ? · I suggest holding a meeting.", "s": "💊 Грамматика", "ti": "Тема 5. Герундий-подлежащее (Moving here was challenging)", "u": "grammar.html#t5"}, {"t": "💡 Пара, которую путают все", "s": "💊 Грамматика", "ti": "Тема 5. Герундий-подлежащее (Moving here was challenging)", "u": "grammar.html#t5"}, {"t": "I stopped smoking — бросил курить", "s": "💊 Грамматика", "ti": "Тема 5. Герундий-подлежащее (Moving here was challenging)", "u": "grammar.html#t5"}, {"t": "I stopped to smoke — остановился, ЧТОБЫ покурить 😄", "s": "💊 Грамматика", "ti": "Тема 5. Герундий-подлежащее (Moving here was challenging)", "u": "grammar.html#t5"}, {"t": "1️⃣ will — решение, принятое ПРЯМО СЕЙЧАС", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "Спонтанное решение в момент речи, обещание, предложение помощи:", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "— The phone is ringing. — I'll get it! · I'll book a transfer. · I'll take a look at him.", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "⚠️ Для ПЛАНОВ — не will, а going to / Present Continuous: We' re flying tomorrow · I' m going to present a case.", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "2️⃣ won't — ⚠️ МОЯ ЛОВУШКА: это ОТКАЗ, а не «не буду»", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "Фраза Что слышит собеседник", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "The safe won't open. сейф «отказывается» открываться", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "My car won't start. машина не заводится", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "❌ I won't decide yet «я отказываюсь решать»!", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "✅ I haven't decided yet я ещё не решил", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "❌ I won't help you «не желаю помогать»", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "✅ I can't help you не смогу помочь", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "3️⃣ would — вежливость и воображаемое", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "(а) Вежливые формулы: I' d like to... · Would you mind...? · I' d appreciate it if you could ... 💡 would делает фразу гипотетической, не давит: I want = требование, I'd like = пожелание.", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "(б) Гипотеза: If his heart stopped, CPR would not change the outcome. · I would recommend keeping a close eye on him.", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "(в) Прошлые привычки: In Phuket, we would have breakfast and then head to the beach (= usually did).", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "🔑 Шпаргалка", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "Хочу сказать Говорю", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "Решил прямо сейчас I'll do it", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "План на завтра I'm going to / I' m meeting him", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "Ещё не решил I haven't decided (НЕ I won't decide!)", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "Не могу помочь I can't help (НЕ I won't help!)", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "Вежливая просьба Would you mind...? / I' d like...", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "Мягкая рекомендация I would recommend...", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "Если бы (гипотеза) If it happened, I would ...", "s": "💊 Грамматика", "ti": "Тема 6. will / won't / would — решение, отказ, вежливость", "u": "grammar.html#t6"}, {"t": "Правило одной строкой: вопрос внутри предложения перестаёт быть вопросом.", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "Есть два режима :", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "Режим 1 — прямой вопрос. Глагол вперёд: How did you sleep? · Where is he? · What does he need?", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "Режим 2 — вопрос внутри предложения (после I don't know / Can you tell me / He asked / I wonder ). Порядок становится обычным , как в утверждении:", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "❌ Прямой порядок внутри ✅ Правильно", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "I don't know where is he I don't know where he is .", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "Can you tell me what does he need Can you tell me what he needs ?", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "He asked how did I sleep He asked how I slept .", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "I wonder why did they call I wonder why they called .", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "Механика в 3 шага: 1) убери do/does/did 🗑 · 2) верни глаголу нормальную форму ( did I sleep → I slept ) · 3) подлежащее перед глаголом.", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "⚠️ Ловушка с is/are/was: тут нет do , поэтому просто переставь местами : Where is he ? → I don't know where he is .", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "⚠️ will не выбрасываем! Правило убирает только do/does/did : She wants to know how long it will take .", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "⚠️ Согласование времён: прошлое снаружи → прошлое внутри. He asked me why I was calling (не I am calling ).", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "Короткие вопросы-переспросы", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "Речь звучит письменно ещё и потому, что нет коротких переспросов. Носитель делает так:", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "Ситуация Короткий вопрос", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "Не расслышал Sorry? / Come again?", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "Хочешь деталей Like what? · Such as? · How come?", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "Уточняешь Meaning? · In what sense?", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "Проверяешь You sure? · Really?", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "Эхо-вопрос — He refused. — He did?", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "💡 How come? = «а почему?» — короче и живее, чем Why? , и звучит менее допросно.", "s": "💊 Грамматика", "ti": "Тема 7. Вопрос внутри предложения — и короткие переспросы", "u": "grammar.html#t7"}, {"t": "Три ситуации, три конструкции. Логика одна: чем нереальнее — тем дальше в прошлое уходит глагол.", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "1. Реально может случиться → if + настоящее, потом will", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "If he deteriorates , I 'll call you. — Если ухудшится, позвоню. If you 're late, we 'll start without you.", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "⚠️ Главная ловушка: после if — никогда will! ❌ If he will deteriorate → ✅ If he deteriorates", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "💡 Если в главной части приказ, а не будущее — will не нужен вообще: If the pressure drops, call me immediately. (и подлежащее обязательно!)", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "2. Фантазия, сейчас не так → if + прошедшее, потом would", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "If I had more time, I 'd watch Scrubs. — Было бы время, посмотрел бы (времени нет). If I worked in Bangkok, I 'd live on the beach.", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "⚠️ If I were you — здесь were , не was . Фиксированная форма для советов: If I were you, I'd repeat the CT.", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "3. Прошлое, уже не изменить → if + had done, потом would have done", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "Это для сожалений и разбора ошибок (M&M-конференции):", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "If we had started antibiotics earlier, he would have survived . If I had known , I wouldn't have called you at midnight.", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "Формула: If + had + V3 ... would have + V3", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "💡 В речи звучит слитно: If I'd known, I wouldn't've called. — носитель почти не проговаривает эти had/have.", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "Шпаргалка", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "Ситуация if-часть вторая часть", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "Может случиться If he comes I'll tell him", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "Фантазия сейчас If he came I'd tell him", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "Прошлое, поздно If he had come I'd have told him", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "⚠️ Правило-якорь: не смешивай половинки", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "Обе части живут в одном времени . Заглянул в первую — вторая обязана совпасть.", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "❌ If I had more time, I would have watched Scrubs. — первая половина про «сейчас», вторая про «тогда». ✅ Про сейчас: If I had more time, I would watch Scrubs. ✅ Про вчера: If I had had more time, I would have watched Scrubs.", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "Две мелочи из дрилла", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "⚠️ Глагола to worse не существует — worse это прилагательное: ✅ If he gets worse · If he deteriorates ⚠️ I'd not не говорят (звучит как из Диккенса): ✅ I wouldn't transfer him today.", "s": "💊 Грамматика", "ti": "Тема 8. Условные предложения — без «первого-второго-третьего типа»", "u": "grammar.html#t8"}, {"t": "have to — давят обстоятельства (извне)", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "I have to work this weekend. — Вынужден, так вышло. He has to be intubated. — Состояние требует.", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "💡 Самое частое слово в разговорной речи. Сомневаешься — бери have to .", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "must — давлю я сам (изнутри) + предположение", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "I must call his family. — Я решил, это мой долг. You must be exhausted. — Ты, должно быть, вымотан. ← второе значение: уверенное предположение", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "⚠️ В живой речи must про обязанность звучит тяжело и старомодно . Носитель почти всегда скажет have to . Где must реально живёт: в предположениях ( You must be joking ) и в письменных правилах ( Visitors must wear a mask ).", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "should — совет, не обязанность", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "You should get some rest. — Тебе бы отдохнуть. We should repeat the CT. — Стоило бы повторить.", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "⚠️ need to ≠ have to", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "need to = «мне это нужно» — я хочу, это моя потребность. have to = «вынужден» — не хочу, но приходится.", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "❌ I need to work around the clock (жалуешься) → ✅ I have to work around the clock.", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "⚠️ Отрицания — смысл меняется полностью", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "Фраза Значение", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "You mustn't call him. ЗАПРЕЩЕНО! Нельзя ни в коем случае", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "You don't have to call him. Не обязан. Можешь, если хочешь", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "You shouldn't call him. Не советую. Лучше не надо", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "You mustn't stop the drip. — Ни в коем случае не отключай. You don't have to stay late. — Можешь не оставаться.", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "📌 Спутать эти два — как in pain / a pain . Меняет всё.", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "Прошедшее время", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "Must и should прошедшего не имеют — выкручиваемся:", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "Настоящее Прошедшее", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "I have to / I must I had to", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "I should I should have + V3 — сожаление", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "We should have started antibiotics earlier. — Надо было начать раньше. We shouldn't have waited . — Не надо было ждать.", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "💡 В речи слитно: I shoulda called · We shouldn'ta waited .", "s": "💊 Грамматика", "ti": "Тема 9. must / should / have to — три источника давления", "u": "grammar.html#t9"}, {"t": "Всю систему предлогов выучить нельзя — их логика непоследовательна. Но почти все твои ошибки попадают в четыре группы.", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "1. Место и время: in / on / at", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "Предлог Логика Место Время", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "in внутри чего-то большого in the room, in Israel in the morning, in May, in 2026", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "on на поверхности / на дате on the table, on the 5th floor on Monday, on August 20", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "at точка at the door, at work, at home at 7 a.m., at night", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "📌 Правило-якорь: от большого к малому — in → on → at. in Israel → in Tel Aviv → on Herzl Street → at number 5", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "⚠️ Ловушки: точное время всегда at (at 7 a.m.) · in the morning , но at night — исключение · at work , at home — без артикля.", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "2. home — особое слово", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "Home ведёт себя как наречие, предлог не нужен:", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "✅ go home · come home · drive home · get home · on my way home ❌ go to home · on the way to home", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "⚠️ Но когда home = здание, предлог возвращается: at home , the way to my parents' home .", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "3. Предлоги, приклеенные к глаголу — учить «в комплекте»", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "Глагол Предлог Пример", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "to present a case to present a case to the team", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "to be late for late for a meeting (не to )", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "to depend on it depends on the CT", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "to consist of consist of three parts", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "to be responsible for responsible for the ICU", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "to be worried about worried about the results", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "to look at / for / after look at the scan · look for the file · look after a patient", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "to apply for / to apply for a job · apply to a hospital", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "4. Медицинские блоки — просто выучить", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "on dialysis · on antibiotics · on a ventilator · on call in the ICU · in pain · in critical condition at bedside · at the nurses' station to admit to the ICU · to discharge from the hospital · to refer to a specialist to die of/from something · to suffer from something · to respond to treatment", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "📌 on = «подключён к чему-то / под чем-то» — на диализе, на антибиотиках, на ИВЛ, на дежурстве. Одна логика.", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "Бонус: hope vs wish", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "hope — о реальном, может случиться: I hope the traffic isn't bad. wish — о нереальном, сожаление + прошедшее время : I wish the traffic were better.", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "⚠️ После wish никогда не бывает will : ❌ I wish the traffic won't let me down", "s": "💊 Грамматика", "ti": "Тема 10. Предлоги — четыре группы, которые закрывают 80% ошибок", "u": "grammar.html#t10"}, {"t": "Принцип: два английских в одном языке. Носитель почти всегда выберет фразовый глагол (phrasal verb) вместо «умного» латинского.", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "Книжный (латинский) Разговорный (фразовый)", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to postpone to put off", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to tolerate to put up with", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to investigate to look into", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to continue to keep going / carry on", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to discover to find out", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to deteriorate to go downhill", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to encounter to run into", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to review to go over / go through", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to reduce to cut back on", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to resolve to sort out", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "💡 Оба варианта верны. Но левая колонка = доклад, правая = разговор.", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "Как понять значение — предлог задаёт направление", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "up = завершённость, до конца: finish up, eat up, use up down = вниз, уменьшение: cut down, calm down, go downhill out = наружу, выяснение: find out, figure out, check out over = целиком, ещё раз: go over, think over through = насквозь: go through, pull through", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "⚠️ Но логика работает не всегда — put up with никак не выводится. Такие учат целиком.", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "Медицинские фразовые", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "Фразовый Значение", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to pull through выкарабкаться", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to go downhill ухудшаться (= deteriorate, но живее)", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to come around / come to прийти в себя после наркоза", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to pass out потерять сознание", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to throw up вырвать (так говорят все, не vomit )", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to pick up (an infection) подхватить инфекцию", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to rule out исключить", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to follow up наблюдать в динамике", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to hold off on повременить", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to back off (on the pressors) снизить дозу", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "to keep an eye on приглядывать за", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "⚠️ Разделяемые и неразделяемые", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "Разделяемые — объект можно вставить в середину: Let's rule out sepsis = Let's rule sepsis out ✅ оба верны Но местоимение — только в середину: Let's rule it out ✅ · rule out it ❌", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "Неразделяемые — объект только после: He pulled through ✅ · I ran into him ✅ · ran him into ❌", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "⚠️ Близкие, но разные", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "I'll look into it — разберусь в вопросе I'll go through the chart — просмотрю карту", "s": "💊 Грамматика", "ti": "Тема 11. Фразовые глаголы (phrasal verbs) — почему речь звучит книжно", "u": "grammar.html#t11"}, {"t": "Главный вопрос: «мы оба знаем, о чём речь?»", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "a/an — я ввожу новое, ты этого ещё не знаешь the — мы оба знаем, о чём именно ∅ (ничего) — понятие вообще, не конкретный предмет", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "We went to a restaurant. (какой-то, впервые) · The restaurant was great. (тот самый) · I love ∅ Italian food. (еда вообще)", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "1. Профессия после «as» — без артикля", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "✅ He works as head of neurosurgery. (не as the head ) ✅ I work as an intensivist. ← но профессия из многих — a/an нужен!", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "Разница: as head of X (должность, единственная) — без артикля. As a doctor (профессия из многих) — с артиклем.", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "2. Отделения и места", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "✅ the ICU · the OR · the ER — всегда the ✅ ∅ surgery · ∅ cardiology — специальность как область, без артикля ✅ He's in ∅ surgery right now. (на операции) · He's in the OR. (в операционной)", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "3. Абстрактное vs конкретное — самая частая ошибка", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "✅ ∅ Sepsis is dangerous. — сепсис вообще ✅ The sepsis resolved after 48 hours. — тот самый, у этого пациента ✅ ∅ Antibiotics save lives. — вообще ✅ The antibiotics weren't working. — те, что мы давали", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "💡 Правило-якорь: можешь подставить «этот конкретный» — ставь the . «Вообще, как явление» — ничего.", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "4. Устойчивые блоки — запомнить", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "С артиклем Без артикля", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "in the morning at ∅ night", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "the next day ∅ tomorrow", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "go to the doctor go to ∅ work / ∅ bed / ∅ school", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "play the piano play ∅ football", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "5. Имена и должности", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "✅ ∅ Dr. Novak — имя без артикля ✅ The head of cardiology told me... — должность вместо имени → the ✅ I ran into the head of cardiology.", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "⚠️ Ловушка «второе упоминание»", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "Первый раз — a, дальше — the.", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "A 58-year-old man was admitted. The patient had pancreatitis. The CT showed...", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "📌 В докладах это работает автоматически. В разговорной речи сбивается: ❌ You remember a cardiologist? — он уже упомянут, значит the .", "s": "💊 Грамматика", "ti": "Тема 12. Артикли — второй заход, тонкие места", "u": "grammar.html#t12"}, {"t": "Правило одной строки: прошлое снаружи → прошлое внутри.", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "После he said / she told me / I asked глагол внутри сдвигается на шаг назад:", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "Прямая речь Косвенная", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "\"I am tired.\" He said he was tired.", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "\"I work here.\" She said she worked there.", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "\"We started antibiotics.\" They said they had started antibiotics.", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "\"I will call you.\" He said he would call me.", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "\"I can do it.\" He said he could do it.", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "📌 Механика: present → past · past → had + V3 · will → would · can → could · may → might", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "⚠️ Не сдвигаются: would, could, should, might, had — они уже сдвинуты, дальше некуда.", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "⚠️ Вопрос в косвенной речи перестаёт быть вопросом", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "❌ She asked, \"Did I check the lactate?\" ✅ She asked if I had checked the lactate.", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "❌ She asked, \"Was the discharge summary ready?\" ✅ She asked if the discharge summary was ready.", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "Механика: убрать кавычки → добавить if / whether → подлежащее вперёд → сдвинуть время. Знака вопроса в конце нет.", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "С вопросительным словом — то же самое, без if : \"Why are you calling?\" → He asked why I was calling.", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "⚠️ say vs tell — разные конструкции", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "Глагол Как работает", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "tell tell someone something — адресат обязателен", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "say say something ( to someone) — адресат необязателен", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "✅ He told me he was leaving. · ❌ He said me · ✅ He said he was leaving.", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "Указатели времени и места меняются", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "Прямая Косвенная", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "today that day", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "yesterday the day before", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "tomorrow the next day", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "now / here / this then / there / that", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "✅ Когда сдвиг НЕ нужен", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "Если факт всё ещё верен сейчас , настоящее можно оставить:", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "He said the ICU is full. (и она до сих пор полна) · The nurse said the patient is refusing the tube.", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "💡 В разговорной речи носители часто не сдвигают, когда речь о неизменившемся. В докладе и на письме — сдвигай.", "s": "💊 Грамматика", "ti": "Тема 13. Косвенная речь — пересказать чужие слова", "u": "grammar.html#t13"}, {"t": "1. -er / more — сравнение двух", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "Правило Пример", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "Короткие слова (1 слог) fast er , high er , sick er", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "На -y eas ier , health ier", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "Длинные (2+ слога) more stable, more aggressive", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "His lactate is higher than yesterday.", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "⚠️ Всегда нужно «чем» — явно ( than X ) или из контекста. ❌ it's a worse sign — хуже чего ? Сравнение повисает.", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "2. as ... as — одинаковость", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "He's as stable as he was yesterday. · It's not as simple as it seems.", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "📌 Формула: as + прилагательное + as . Между ними ничего не вставляется.", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "3. the -est / the most — превосходная", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "the sickest patient in the unit · the most complicated case", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "⚠️ Всегда с the : ❌ the beaches are best → the best", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "4. the ..., the ... — «чем..., тем...»", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "The sooner we start, the better . · The more you wait, the harder it gets.", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "⚠️ Две ловушки: сравнительная форма (не превосходная!) + подлежащее обязательно : ❌ The longer we wait, the worst gets → ✅ The longer we wait, the worse it gets.", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "Практичные конструкции", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "Конструкция Значение", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "the sooner, the better чем раньше, тем лучше", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "twice as long as вдвое дольше, чем", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "not nearly as bad далеко не так плохо", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "just as good ничуть не хуже", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "worse than I thought хуже, чем я думал", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "better than nothing лучше, чем ничего", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "⚠️ Неправильные формы", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "Сравнительная Превосходная", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "good better the best", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "bad worse the worst", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "far further / farther the furthest", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "little less the least", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "much / many more the most", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "💡 Никогда: more better , more worse — двойное сравнение.", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "🩺 Медицинские сравнения", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "He's doing better today. — ему лучше He's getting worse . — ухудшается No better, no worse . — без динамики His pressure is running lower than I'd like. — держится ниже, чем хотелось бы She's the best doctor I've ever worked with . — перфект + ever", "s": "💊 Грамматика", "ti": "Тема 14. Сравнения — -er, as...as, the most", "u": "grammar.html#t14"}, {"t": "Самая частая ошибка за 20 уроков. Разбор не по учебнику, а по одному вопросу.", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "🔑 Один вопрос решает всё", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "Пример Почему", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "I talked to the family last night . когда → есть", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "I' ve talked to the family. когда → неважно, важен факт", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "He arrived three hours ago. когда → есть", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "He' s just arrived . важно, что уже здесь", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "📌 Как только в предложении есть точное время в прошлом — Present Perfect запрещён. Без исключений.", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "⛔ Слова-ВЫКЛЮЧАТЕЛИ Present Perfect", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "Увидел любое → Past Simple , автоматически:", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t": "yesterday · last night / last week · ... ago · in 2015 · at 3 p.m. · when I was a resident · this morning (если утро прошло)", "s": "💊 Грамматика", "ti": "Тема 15. Present Perfect vs Past Simple — где проходит граница", "u": "grammar.html#t15"}, {"t
