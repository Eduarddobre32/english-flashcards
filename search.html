<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔎 Поиск по курсу</title><style>
:root{--bg:#eef2f7;--card:#fff;--ink:#1a2733;--accent:#2c5f8a;--soft:#cbd8e4;--head:#e8eff5;--zebra:#f6f9fb;--muted:#6b7f92}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#1a2632;--ink:#e8eef4;--accent:#5b9bd5;--soft:#2c3e4f;--head:#243240;--zebra:#1e2b38;--muted:#8fa3b5}}
*{box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);
max-width:820px;margin:0 auto;padding:18px 16px 60px;line-height:1.5;font-size:15px}
h1{font-size:23px;border-bottom:3px solid var(--accent);padding-bottom:6px;color:var(--accent)}
h2{font-size:18px;color:var(--accent);border-bottom:1px solid var(--soft);padding-bottom:4px;margin-top:26px}
h3{font-size:15.5px;margin-top:18px}
table{border-collapse:collapse;width:100%;margin:12px 0;display:block;overflow-x:auto}
th,td{border:1px solid var(--soft);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--head)}
tr:nth-child(even) td{background:var(--zebra)}
blockquote{border-left:3px solid var(--accent);margin:10px 0;padding:6px 14px;background:var(--zebra);border-radius:0 8px 8px 0;color:var(--ink)}
hr{border:none;border-top:2px solid var(--soft);margin:22px 0}
a{color:var(--accent)}
.nav{display:inline-block;margin-bottom:14px;font-size:14px;padding:8px 14px;border:1.5px solid var(--accent);
border-radius:10px;text-decoration:none;color:var(--accent);font-weight:600}
.foot{margin-top:40px;font-size:13px;color:var(--muted);text-align:center}

#q{width:100%;font-size:17px;padding:13px 15px;border:2px solid var(--accent);border-radius:12px;
background:var(--card);color:var(--ink);outline:none}
.hint{color:var(--muted);font-size:13px;margin:8px 0 14px}
.res{background:var(--card);border:1px solid var(--soft);border-radius:10px;padding:11px 14px;margin:9px 0}
.res .src{font-size:12.5px;color:var(--accent);font-weight:600;margin-bottom:4px}
.res .txt{font-size:14.5px;line-height:1.45}
.res a{font-size:12.5px;text-decoration:none;font-weight:600}
mark{background:#ffe27a;color:#1a2733;border-radius:3px;padding:0 2px}
@media(prefers-color-scheme:dark){mark{background:#7a6520;color:#fff}}
.count{color:var(--muted);font-size:13px;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{font-size:12.5px;padding:5px 11px;border:1px solid var(--soft);border-radius:20px;
background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
</style></head><body>
<a class="nav" href="lessons.html">← ко всем урокам</a>
<h1>🔎 Поиск по курсу</h1>
<input id="q" placeholder="Введите слово или фразу: handover, pull through, артикль..." autocomplete="off" autofocus>
<div class="hint">Ищет по всем урокам, грамматике и карточкам. Работает и без интернета.</div>
<div class="chips" id="chips"></div>
<div class="count" id="count"></div>
<div id="out"></div>
<script>
const DATA=[{"t": "Тема: как реально здороваются, спрашивают «как дела» и прощаются. Не «Hello, how are you? — I'm fine, thank you» — так почти никто не говорит.", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Фразы дня", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Формат: фраза → произношение (упрощённо) → перевод → регистр.", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "How's it going? /хаус ит гОуин/ — «Как дела?» — универсальное, подходит почти везде. Ответа по сути не ждут, как и в иврите «ма нишма».", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Not bad, can't complain. /нот бэд, кант комплЭйн/ — «Неплохо, грех жаловаться» — самый естественный ответ вместо «I'm fine».", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "What have you been up to? /уот хэв ю бин Ап ту/ — «Чем занимался?» — при встрече со знакомым. Ответ: «Not much» или коротко о делах.", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Same old, same old. /сейм оулд/ — «Всё по-старому» — неформальное.", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Long time no see! /лон тайм ноу си/ — «Сколько лет, сколько зим!» — да, грамматически «неправильно», и это нормально.", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "How come? /хау кам/ — «Как так? Почему?» — разговорная замена «why»: How come you're here? — заметьте, порядок слов прямой, без инверсии.", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "I'd better get going. /айд бэтэ гет гОуин/ — «Мне пора» — вежливый способ закончить разговор.", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "It was great catching up! /кЭчин ап/ — «Здорово было поболтать!» — при прощании со знакомым. Catch up = обменяться новостями.", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Take care! /тейк кэа/ — «Давай, береги себя!» — стандартное тёплое прощание.", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Say hi to Anna for me. — «Передавай привет Анне» — заметьте: say hi TO someone , как в иврите «тимсор ла-...», а не как в русском «передай кому-то».", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Мини-диалог (прочитайте вслух 2–3 раза)", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "I hear you = «понимаю тебя, знакомо» — бонусная фраза.", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Ловушки для русскоговорящих", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Не отвечайте на «How's it going?» подробным рассказом о делах — это ритуал, как «ма нишма». Ответ: 2–4 слова + вернуть вопрос.", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "«Normal» ≠ «нормально». Ответ «I'm normal» звучит как «я психически здоров». Говорите «Not bad» или «Pretty good» .", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "«How do you do?» — устаревшее, не используйте.", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Разбор диалогов 04–10.07 — твои поправки", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Этот урок ты отыгрывал многократно (встреча со знакомым, финал модуля). Сильно: can't complain , say hi to... for me , разные прощания для знакомой/незнакомой, возврат вопросов. Вот сквозные ошибки:", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Было у тебя Правильно Почему", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "just now (= сейчас) right now / at the moment just now = «только что» (прошлое!), не «прямо сейчас»", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "I'm training (навык) I'm practicing train = тренировать тело/команду; навык — practice", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "(молчал в ответ на) it was great catching up Likewise! / Same here! / You too! на «здорово поболтали» — короткий отклик", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "I'd better going / I'd better going back I'd better get going 🔴 GET на месте! Терял его несколько раз", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "say hi Anna / say hi for Anna say hi TO Anna for me hi TO кому, FOR от кого", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "catch up (с Майком, новым!) It was nice meeting you 🔴 catch up — только со старыми знакомыми!", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "How it's going? How's it going? 🔴 порядок слов: How is it going (ошибка 3 раза, 08–10.07!)", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "I spent a good time I had a good time «провести время» = have, не spend", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "🔴 Две упорные темы: (1) How's it going — порядок слов (How is it going), билась 3 занятия; (2) catch up только со старыми знакомыми, с новыми — nice meeting you .", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Задание", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Прочитайте фразы вслух 2 раза.", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Напишите мне «диалог» — отыграем сцену: вы встречаете старого знакомого на улице.", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Завтра фразы появятся в повторении.", "s": "Модуль 1 · Общение · урок 1", "u": "lesson-01-01.html", "ti": "Урок 1 — Приветствия и small talk (неделя 1)"}, {"t": "Тема: как просить по-английски, чтобы звучать вежливо, а не требовательно. Главное правило: англоязычный мир просит «вопросом», а не повелительным наклонением. Русское «Дайте мне кофе» → по-английски звучит грубо даже с please .", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Фразы дня", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Could you do me a favor? /куд ю ду ми э фЭйвэ/ — «Можешь оказать услугу?» — стандартное начало просьбы. Could вежливее, чем can .", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Do you mind if I open the window? /ду ю майнд иф ай/ — «Ты не против, если я открою окно?» — ⚠️ Ловушка: разрешение здесь — «No, go ahead» («нет, не против»). Ответ Yes значит «против»!", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Would you mind closing the door? — «Не могли бы вы закрыть дверь?» — после mind глагол с -ing : mind closing, mind helping .", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "I was wondering if you could help me. /ай уоз уАндэрин/ — «Я хотел спросить, не могли бы вы мне помочь» — самая вежливая форма, для незнакомцев и официальных ситуаций.", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Can I get a coffee, please? — «Можно мне кофе?» — стандарт заказа в кафе. Как ивритское «эфшар кафе?» — та же логика «можно...?» вместо «дайте». Не говорите give me !", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Is it okay if I sit here? — «Ничего, если я сяду здесь?» — в транспорте, в кафе.", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Sure, no problem. — «Конечно, без проблем» — универсальный ответ согласия на просьбу.", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "I'd appreciate it. /айд эпрИшиэйт ит/ — «Буду признателен» — добавляется в конец просьбы.", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Sorry to bother you, but... /сОри ту бОðэ ю/ — «Извините за беспокойство, но...» — как «слиха» при обращении к незнакомцу на улице.", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Never mind. — «Неважно / проехали» — если передумали или человек не расслышал дважды.", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Мини-диалог", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Not at all = «совсем не против»; sure thing = «конечно» (неформ.); a bit = «немного» — чаще, чем a little , в живой речи.", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Ловушки для русскоговорящих", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Please не спасает императив. «Give me the menu, please» звучит как приказ официанту. Правильно: «Can I get the menu, please?» или «Could you bring the menu?»", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Ответ на «Do you mind...?» — если вы НЕ против, отвечайте No / Not at all / Go ahead . Русское «да, конечно (можно)» тянет сказать yes — и получается отказ.", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Модальные — только Could/Would для незнакомцев. Can you... — для друзей, Could you... — для всех остальных.", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Разбор диалога 05.07 — твои поправки (оценка 4/5)", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Диалог в кафе прошёл сильно: 7 фраз урока в деле, вежливые просьбы через Could . Ловушка Do you mind...? (ответ No = «не против») пройдена. Вот что доработать:", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Было у тебя Правильно Почему", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "join our coffee enjoy our coffee 🔴 join = присоединиться; enjoy = наслаждаться (ошибка 2 раза, 04 и 05.07!)", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "the password of this place the Wi-Fi password here место = here , не «of this place»", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "I wondering if... I was wondering if... не терять was : I was wondering", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "🔴 Главная ошибка урока: join ≠ enjoy — спутал дважды подряд. Join = присоединиться (к столу), enjoy = наслаждаться (кофе). Исправлено 06.07 ✓.", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Задание", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Прочитайте фразы вслух 2 раза.", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Напишите «диалог» — сцена: вы в кафе, нужно занять место, заказать и попросить Wi-Fi пароль.", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Фразы уйдут в повторение завтра.", "s": "Модуль 1 · Общение · урок 2", "u": "lesson-01-02.html", "ti": "Урок 2 — Вежливые просьбы (неделя 1)"}, {"t": "Тема: познакомиться, рассказать о себе и расспросить собеседника — живыми фразами, которые звучат на вечеринках, в поездах и на конференциях.", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "Фразы дня", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "Nice to meet you! /найс ту мит ю/ — «Приятно познакомиться!» Ответ: «Nice to meet you too!» или короче — «You too!»", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "Where are you from originally? /ориджинэли/ — «Откуда вы родом?» — вежливее, чем просто Where are you from , особенно если у собеседника акцент.", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "What do you do? — «Кем работаешь?» — ⚠️ именно так, НЕ «What is your job?» (звучит как анкета). Как ивритское «ма ата осэ?» — дословно то же самое!", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "I work as an engineer. / I work in medicine. — «Работаю инженером / в сфере медицины» — as + профессия, in + сфера.", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "I've been living here for five years. /айв бин лИвин/ — «Я живу здесь пять лет» — ⚠️ не I live here five years ! Для «как долго» — has/have been + -ing... for/since.", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "Do you have any kids? — «Дети есть?» — kids в разговоре, children — формально.", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "What do you do in your free time? — «Чем занимаешься в свободное время?»", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "I'm really into hiking. /айм рИли Инту/ — «Я увлекаюсь походами» — самый живой способ сказать о хобби. Be into something = увлекаться.", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "Small world! — «Мир тесен!» — когда нашлись общие знакомые или места.", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "No way! — «Да ладно! Не может быть!» — универсальная реакция удивления (позитивная).", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "Мини-диалог", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "What about you? = «а ты?» — возвращает вопрос, король small talk. You? — ещё короче, тоже норм.", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "Ловушки для русскоговорящих", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "«I live here 5 years» — калька с русского «живу здесь 5 лет». Нужен Present Perfect Continuous: I've been living here FOR five years (или since 2021 ). For = «в течение», since = «с момента».", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "What do you do? без контекста = «кем работаешь?», а не «что ты делаешь (сейчас)?». «Что делаешь сейчас?» = What are you doing? — разница только во времени глагола.", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "Рассказ о себе держите коротким: 2–3 предложения + вернуть вопрос ( What about you? ). Монолог о себе на 2 минуты — коммуникативная ошибка в английской культуре.", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "Разбор диалога 06.07 — твои поправки (оценка 4/5)", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "Диалог «новый сосед» прошёл сильно: 6 фраз урока, ловушка I've been living пройдена (Present Perfect Continuous — сложная тема!). Вот что доработать:", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "Было у тебя Правильно Почему", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "Me too (на Nice to meet you) You too! 🔴 отвечают You too , не Me too (иначе «мне тоже приятно от себя»)", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "I haven't enough time I don't have enough time 🔴 калька «у меня нет»: I don't have + существительное, не I haven't", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "catch up (с незнакомцем) It was nice meeting you catch up — только со старыми знакомыми", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "a place for live / to living a place to live место для жизни = place TO live (инфинитив)", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "sport (мн.) sports виды спорта — во множественном: I'm into sports", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "🔴 Две системные кальки: (1) You too ≠ Me too при знакомстве; (2) I don't have ≠ I haven't (русское «у меня нет» тянет на I haven't ).", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "Задание", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "Прочитайте фразы вслух 2 раза.", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "Подготовьте свой мини-рассказ о себе (3–4 предложения) — работа, откуда, сколько лет где живёте, хобби.", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "Напишите «диалог» — сцена: вы разговорились с попутчиком в поезде.", "s": "Модуль 1 · Общение · урок 3", "u": "lesson-01-03.html", "ti": "Урок 3 — Знакомство и рассказ о себе (неделя 1)"}, {"t": "Тема: как высказать мнение, согласиться и не согласиться — не обрывая беседу. По-английски прямое «You are wrong» звучит грубо почти всегда; несогласие упаковывают в смягчители.", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "Фразы дня", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "To be honest, ... /ту би Онэст/ — «Честно говоря, ...» — вводка для личного мнения: To be honest, I didn't like the movie. В переписке сокращают до TBH .", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "If you ask me, ... — «Как по мне, ...» — вводка мнения, даже если вас не спрашивали 🙂", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "That makes sense. /ðэт мейкс сенс/ — «Логично / теперь понятно» — реакция на объяснение. Суперчастотная фраза!", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "I see your point, but... — «Понимаю твою мысль, но...» — вежливое несогласие, шаг 1: сначала признать, потом возразить.", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "I'm not so sure about that. — «Я в этом не уверен» — самый мягкий способ сказать «нет, ты неправ».", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "That's a good point. — «Дельное замечание» — когда собеседник вас убедил (или почти).", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "It depends. /ит дипЕндз/ — «Смотря как / зависит» — универсальный ответ на вопросы без однозначного ответа: It depends on the price.", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "Sounds good! — «Годится! Отличный план!» — согласие с предложением: Lunch at one? — Sounds good!", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "I couldn't agree more. — «Полностью согласен» — ⚠️ буквально «не мог бы согласиться больше». Не путать: I couldn't agree без more = «не мог согласиться»!", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "No offense, but... /ноу офЕнс/ — «Без обид, но...» — смягчитель перед критикой. Ответ: None taken («не обиделся»).", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "Мини-диалог", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "...actually — «вообще-то, кстати» — смягчает и оживляет реплику; I guess — «наверное, пожалуй».", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "Ловушки для русскоговорящих", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "Русский спор начинается с «Нет, ...» — даже при частичном согласии. По-английски No, ... в начале реплики звучит резко. Начинайте с I see your point / That's a good point , потом but...", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "«I agree with you» — правильно, но помните: agree — глагол, не прилагательное. Не I am agree — суперчастая ошибка русскоговорящих!", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "It depends употребляется и одиночно, и с on : It depends ON the weather (не from ! — калька с «зависит от»).", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "Разбор диалога 07.07 — твои поправки (оценка 4/5)", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "Спор «горы vs море» ты выиграл 🙂 Сильно: from my perspective — сам исправил прошлую ошибку! Вводки мнения к месту. Вот что доработать:", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "Было у тебя Правильно Почему", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "so risky too risky 🔴 «слишком» = too, не so (so = «так/настолько»)", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "the idea to hiking the idea of hiking idea OF + -ing (of hiking)", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "the next year next year next year / next week — без артикля", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "that's a good point (как своё мнение) (только как реакция!) это отклик на слова собеседника, не вводка своего", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "on one side... on other side on the one hand... on the other hand устойчивая пара: hand, с the", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "🔴 Тонкость дня: too vs so . Too = слишком (перебор, негатив): too risky, too expensive . So = так/настолько: so nice .", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "Задание", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "Прочитайте фразы вслух 2 раза.", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "Напишите «диалог» — сцена-спор: мы с вами коллеги, я предлагаю провести отпуск компании в горах, вы за море. Убедите меня!", "s": "Модуль 1 · Общение · урок 4", "u": "lesson-01-04.html", "ti": "Урок 4 — Мнения и реакции (неделя 1)"}, {"t": "Тема: что говорить, когда НЕ понял. Самый важный урок для реального общения: носители говорят быстро, и умение красиво переспросить — это суперсила, а не слабость. Хуже всего — кивать, не поняв.", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Фразы дня", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Sorry, I didn't catch that. /ай дИднт кэч ðэт/ — «Извините, не расслышал» — фраза №1 этого урока. Catch здесь = «уловить».", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Could you say that again? — «Повторите, пожалуйста» — нейтрально-вежливое. НЕ «Repeat!» — это командный тон.", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Could you slow down a bit? — «Чуть помедленнее» — когда говорят быстро. Slow down — как про машину.", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Could you speak up a little? /спик ап/ — «Погромче, пожалуйста» — speak up = говорить громче.", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "What do you mean by \"deposit\"? — «Что вы имеете в виду под...?» — когда слово услышал, но не понял смысл.", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "How do you spell that? — «Как это пишется?» — имена, адреса, названия. Вам продиктуют по буквам.", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "What's the word for... the thing that opens bottles? — «Как называется... штука, которая открывает бутылки?» — спасение, когда забыли слово. Умение описать слово другими словами — навык важнее словарного запаса!", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Come again? — «Чего-чего?» — неформальный переспрос, с друзьями.", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Did you say ten or two? — «Вы сказали ten или two?» — уточнение конкретного слова. Критично в аэропорту и банке: fifteen/fifty, ten/two .", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Got it! — «Понял!» — короткое подтверждение, что теперь всё ясно.", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Мини-диалог", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "B as in Boston — так уточняют буквы (как русское «Б — Борис»). Полезно знать свои: имя Eddie — E as in Echo, D as in David...", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Ловушки для русскоговорящих", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "«Repeat, please» — так говорит учитель ученику. В жизни → Could you say that again? или Sorry? с вопросительной интонацией.", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "«I don't understand» без смягчения звучит как претензия. Мягче: Sorry, I'm not sure I understand или I didn't quite get that .", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Просто «What?» — грубовато (как «Чё?»). Вежливый мгновенный переспрос: «Sorry?» или «Pardon?»", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Разбор диалогов 08–16.07 — твои поправки (оценка 4,5/5)", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "«Дорога к вокзалу» и последующие тесты прошли блестяще: ни одного молчаливого кивка! Сильно: разобрал незнакомые слова через What does X mean? , уточнял конкретику. Вот что доработать:", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Было у тебя Правильно Почему", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "to catching up (catch up — без to в этой форме) 🔴 лишнее to перед -ing (повтор 09.07)", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "What \"tops\" does mean? What does \"tops\" mean? порядок: What does X mean (does впереди)", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "(молчал, не переспросил) swamped / whirlwind What does \"swamped\" mean? не кивать молча — это и есть навык урока!", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Did you say it again? (гибрид) Did you say that again? / Could you say that again? 🔴 не смешивать say that again и did you say — гибрид (побеждён 17.07!)", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "🔴 Главный смысл урока и твоя тема: переспрашивать, а не кивать. Дважды был молчаливый кивок на swamped/whirlwind — цель урока именно в том, чтобы вместо этого сказать What does that mean? . И следи за гибридом did you say that again — одна фраза целиком.", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Задание", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Прочитайте фразы вслух 2 раза.", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Напишите «диалог» — я буду говорить быстро, с сокращениями и парой незнакомых слов (как реальный носитель). Ваша задача — НЕ понять всё, а красиво переспрашивать, пока не поймёте. Это тренировка именно навыка переспроса!", "s": "Модуль 1 · Общение · урок 5", "u": "lesson-01-05.html", "ti": "Урок 5 — Переспросить и уточнить (неделя 1)"}, {"t": "Тема: весь путь через аэропорт: регистрация → досмотр → паспортный контроль → посадка → борт → выдача багажа. Здесь важно не только говорить, но и ПОНИМАТЬ вопросы персонала — они всегда одни и те же.", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Фразы дня", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Регистрация (check-in)", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "I'd like to check in for flight LY008. — «Хочу зарегистрироваться на рейс LY008»", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Aisle or window? /айл ор уИндоу/ — «У прохода или у окна?» — ответ: «An aisle seat, please» (aisle — s не читается!)", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Do you have any bags to check? — «Есть багаж в сдачу?» — ответ: «One carry-on and one checked bag» (ручная кладь + чемодан)", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "I have a connecting flight to Boston. — «У меня стыковочный рейс» — скажите это, чтобы багаж отправили до конечной точки. Layover = сама пересадка: a three-hour layover .", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Here you go. — «Вот, пожалуйста» — передавая паспорт/билет. Универсальная фраза!", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Досмотр (security)", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Do I need to take out my laptop? — «Ноутбук вынимать?» Понимать на слух: Take off your shoes (снимите обувь), Empty your pockets (выложите всё из карманов), Step through, please (проходите).", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Паспортный контроль (граница!)", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "What's the purpose of your visit? — «Цель визита?» — ответ: «I'm here on vacation» / «on business» (в командировке) / «visiting family»", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "How long are you staying? — ответ: «I'm staying for two weeks.»", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Where will you be staying? — ответ: «At a hotel in Manhattan» / «At my friend's place»", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "⚠️ Правило границы: отвечать коротко, по делу, не шутить. Пограничники не оценят small talk 🙂", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "На борту и после", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Excuse me, I think that's my seat. — «Кажется, это моё место» — вежливая формула конфликта за кресло", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Could I get some water, please? — бортпроводнику (та же схема, что в кафе!)", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Is the flight on time? — «Рейс по расписанию?» — delayed = задержан, cancelled = отменён, boarding = посадка", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Which gate is it? — «Какой гейт?»", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Where's the baggage claim? — «Где выдача багажа?»", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "My bag didn't arrive. — «Багаж не прилетел» — для стойки Lost & Found", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Мини-диалог (паспортный контроль)", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Ловушки для русскоговорящих", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "«Я приехал НА две недели» = for two weeks — но «Я здесь УЖЕ две недели» = I've been here FOR two weeks . Русские «на» и «уже» — одно английское for .", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Registration ≠ check-in. Регистрация на рейс — только check-in . Registration — это регистрация машины или на конференцию.", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Control ≠ контроль. «Паспортный контроль» = passport control — ок, но «досмотр» = security , не control .", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Числа критичны: fifteen /фифтИн/ vs fifty /фИфти/ — ударение! Гейт, время, место — переспрашивайте: Did you say fifteen or fifty?", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Разбор диалога 11.07 — твои поправки (оценка 4,5/5)", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Марафон «аэропорт» (регистрация → граница → Lost & Found) прошёл сильно: уточнил B/D и fifteen/fifty, here you go , layover , I'd appreciate it . Вот что доработать:", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Было у тебя Правильно Почему", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "I've been here (на границе) I'm staying for two weeks 🔴 ловушка урока! I've been here = «я уже здесь Х времени»; на въезде — I'm staying (планы). Исправился сам после реакции офицера", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "with a connection I have a connecting flight / a layover нужное слово — connecting flight или layover", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "did you mean B or D? did you say B or D? say = что прозвучало; mean = что имел в виду", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "What does it look like? (как вопрос от тебя) (это офицер тебя спрашивает про багаж) ты переспрашивал не той фразой — про чемодан отвечают It's a large black suitcase", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "🔴 Ключевая ловушка урока: I'm staying (на въезде — планы на будущее) vs I've been here (уже провёл здесь время). Пограничнику всегда — I'm staying for two weeks .", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Задание", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Прочитайте фразы вслух 2 раза, диалог — 3 раза.", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Напишите «диалог» — сыграем полный путь: стойка регистрации → паспортный контроль (я строгий офицер!) → место в самолёте занято.", "s": "Модуль 2 · Путешествия · урок 6", "u": "lesson-02-06.html", "ti": "Урок 6 — Аэропорт и самолёт (Модуль 2 «Путешествия»)"}, {"t": "Тема: заселение, просьбы, проблемы в номере, выселение. Отель — то место, где вы КЛИЕНТ: вежливость + твёрдость. Все просьбы — через знакомые Could I / Could you.", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Фразы дня", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Заселение (check-in)", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "I have a reservation under the name Smith. — «У меня бронь на фамилию Смит» — ключевая формула: under the name !", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "What time is breakfast? Is it included? — «Во сколько завтрак? Он включён?»", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "What's the Wi-Fi password? — уже знаете 😉", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Could I get a room with a view? — «Можно номер с видом?» — попытка не пытка: Any chance of an upgrade?", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Просьбы (front desk = ресепшн!)", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Could I get an extra pillow and some towels? /тАуэлз/ — «Можно дополнительную подушку и полотенца?»", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Could you send someone to fix it? — «Пришлите кого-нибудь починить» — универсальная фраза для любой поломки", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Could you call me a taxi for 7 a.m.? — «Закажите такси на 7 утра»", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Can I leave my luggage here after check-out? — «Можно оставить багаж после выселения?» — камера хранения = luggage storage", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Проблемы в номере 🔧", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "The air conditioning isn't working. — «Кондиционер не работает» — шаблон: The [X] isn't working (Wi-Fi, TV, shower, key card)", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "There's no hot water in my room. — «Нет горячей воды» — шаблон: There's no [X] (towels → there are no towels )", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "The room is too noisy. I'd like to change rooms. — «Слишком шумно, хочу поменять номер» — ⚠️ change roomS — всегда мн.ч. (меняете один на другой)!", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "This is not what I booked. — «Это не то, что я бронировал» — твёрдо, но без грубости", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Выселение (check-out)", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "I'm checking out. Could I get the bill, please? — «Я выселяюсь, можно счёт?»", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Could I get a late check-out? — «Можно поздний выезд?»", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "I think there's a mistake on the bill. — «Кажется, в счёте ошибка» — мини-бар, которого не было 🙂", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Мини-диалог", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "(Ночью, звонок на ресепшн)", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Ловушки для русскоговорящих", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Reception поймут, но в США говорят front desk : Call the front desk .", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "«Номер» = room , не number! My room number is 612 — но сам номер-комната всегда room .", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "change roomS — множественное число (обмен подразумевает два номера).", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "«Заказать такси» = call a taxi / get me a taxi . Классика юмора: «Call me a taxi!» — «Okay, you're a taxi!» («назови меня такси») — реальная шутка носителей, не удивляйтесь 🙂", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Жалуетесь — жалуйтесь на вещь, не на человека: The room is noisy , а не Your hotel is bad .", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Разбор диалога 12.07 — твои поправки (оценка 4,5/5)", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Диалог в 3 акта (заселение с торгом → ночные поломки → счёт с ошибками) прошёл сильно: under the name , оба шаблона поломок, mistake on the bill , спор о счёте, late check-out , торг за апгрейд! Вот что доработать:", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Было у тебя Правильно Почему", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Could you take it care? Could you take care of it ? порядок: take care OF it — единая формула", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Could you change rooms? Could I change rooms? менять номер хочешь ты → Could I (или I'd like to change rooms )", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "The room 508 with a view? Does the room have a view? 🔴 вопрос без глагола! Нужен does : Does the room have a view?", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "(не переспросил) incidentals / hold What are incidentals? / Is it a charge or a hold? 2 подсказки ушло — не молчи, переспрашивай незнакомое!", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "перепутал суммы в счёте — считай внимательно, проговаривай цифры вслух", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "🔴 Системная тема: вопрос без глагола ( The room with a view? ). Английскому вопросу нужен does / is / are : Does the room have a view? Тот же почерк — выпадающий глагол.", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Задание", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Прочитайте фразы вслух 2 раза, диалог — 3 раза.", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Напишите «диалог» — сценарий: заселение (я портье) → ночью проблема в номере → утром поздний выезд и ошибка в счёте!", "s": "Модуль 2 · Путешествия · урок 7", "u": "lesson-02-07.html", "ti": "Урок 7 — Отель (Модуль 2 «Путешествия»)"}, {"t": "Тема: передвижение по чужой стране. Четыре мини-блока — от такси до проката.", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Фразы дня", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Такси / Uber 🚕", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Could you take me to the airport? — «Отвезите меня в аэропорт» — или просто назвать адрес: The Hilton on Fifth Avenue, please.", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "How much is it to downtown? — «Сколько до центра?» — downtown = центр города (амер.); плата за проезд = fare /фэа/", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Could you pull over here? — «Остановите здесь» — pull over = прижаться к обочине. Именно так, не stop here !", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Keep the change! — «Сдачи не надо» — если платите наличными", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Поезд / метро 🚆", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "A one-way ticket to Boston, please. — «Билет в одну сторону» — туда-обратно = round-trip (НЕ there and back !)", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Which platform is it? — «С какой платформы?»", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Is this the right train to Boston? — «Этот поезд до Бостона?» — вопрос, который спасает от поездки не туда 🙂", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Does this train stop at Central Station? — «Этот поезд останавливается на...?»", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Where do I transfer? — «Где мне пересесть?» — пересадка = transfer", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Is this seat taken? — «Это место занято?» — в поезде/автобусе; ответ: No, go ahead!", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Аренда машины 🚗", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "I'd like to rent a car for three days. — «Хочу арендовать машину на три дня»", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Is insurance included? /иншУранс/ — «Страховка включена?» — + помните вчерашнее: Is it a charge or just a hold? — при аренде заморозки большие!", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Do I need to return it with a full tank? — «Возвращать с полным баком?»", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Where can I fill up around here? — «Где здесь заправиться?» — заправить машину = fill up", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Мини-диалог (билетная касса)", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Ловушки для русскоговорящих", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "«Туда и обратно» = round-trip (амер.) / return ticket (брит.). Дословное there and back — поймут, но улыбнутся.", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "«Остановите здесь» = pull over — а stop the car! звучит как крик при ограблении 🙂", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Fare ≠ fine! Fare = плата за проезд, fine = штраф. «What's the fare?» — «сколько стоит проезд».", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Rent vs hire: в США машину rent , людей hire . (В Британии машину тоже hire — но начните с американского.)", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Downtown без предлога-артикля: I'm going downtown (не to the downtown ).", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Разбор диалога 13.07 — твои поправки (оценка 4,5/5)", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Цепочка «такси → касса → занятое место» прошла сильно: тройное уточнение у кассира ($76/26, 15/50, transfer), pull over , keep the change , it's my fault , и I've been here — в верном контексте! Вот что доработать:", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Было у тебя Правильно Почему", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "How much is Ø to downtown? How much is it to downtown? 🔴 главный дрилл: it не выпадает!", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "What's a platform? Which platform is it? «с какой платформы» = Which platform , не what's a", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "(недопонял) what do you do back home? I work as... / I'm a... back home = «у тебя на родине»; таксист спросил про работу", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Hi bro, do you hear me? Excuse me, can you hear me? 🔴 регистр! bro — только близким друзьям; с незнакомцем — Excuse me", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "🔴 Две сквозные темы: (1) How much is it — маленькое it не выпадает (твой главный дрилл, взят позже 15.07!); (2) регистр — bro / do you hear me звучит панибратски, с незнакомцами Excuse me, can you hear me?", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Задание", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Прочитайте фразы вслух 2 раза, диалог — 3 раза.", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Напишите «диалог» — сценарий-цепочка: такси до вокзала (я болтливый таксист!) → билетная касса → в поезде занято ваше место.", "s": "Модуль 2 · Путешествия · урок 8", "u": "lesson-02-08.html", "ti": "Урок 8 — Транспорт: такси, поезд, метро, аренда машины (Модуль 2)"}, {"t": "Тема: от «столик на двоих» до чаевых: заказ, аллергии, жалобы, счёт. Плюс главная культурная разница — как жаловаться и сколько оставлять на чай.", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Фразы дня", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Приход и заказ", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "A table for two, please. — «Столик на двоих» — на входе; вас спросят: Did you have a reservation?", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Could we see the menu? — «Можно меню?»", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "What do you recommend? — «Что порекомендуете?» — официанты любят этот вопрос!", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "I'll have the steak, please. — «Мне стейк» — ⚠️ формула заказа: I'll have... (не I want — грубовато, и не I will eat 🙂)", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "How would you like it cooked? — «Какой прожарки?» — ответы: rare / medium-rare / medium / well-done", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Could I get that without onions? — «Можно без лука?» — кастомизация — это нормально, США это любит", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "I'm allergic to nuts. /элЁрджик/ — «У меня аллергия на орехи» — критичная фраза! + Does it have any dairy? — «Тут есть молочное?»", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Во время еды", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "How is everything? — официант ВСЕГДА подойдёт с этим — ответ: «Everything's great, thanks!»", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Could I get a refill? — «Можно долить?» — кофе и газировка в США часто бесплатно доливаются!", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Excuse me, this isn't what I ordered. — «Это не то, что я заказывал» — спокойно и уверенно", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "I ordered it medium-rare, but this is well-done. — конкретика жалобы: что заказал vs что принесли", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Счёт и чаевые", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Could we get the check, please? — «Счёт, пожалуйста» — в США check , в Британии bill (в отеле — bill везде)", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Could you split the check? — «Разделите счёт» — на компанию; поровну = split it evenly", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Is service included? — «Обслуживание включено?» — в США почти никогда: чаевые 15–20% обязательны (это зарплата официанта!)", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "To go, please. / For here. — «Навынос / здесь» — в кафе спросят: For here or to go?", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "I'm stuffed! — «Я объелся!» — неформальное, после хорошего ужина 🙂", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Мини-диалог", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Ловушки для русскоговорящих", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "«I want a steak» — по-русски нормально, по-английски капризно. Заказ = I'll have... / Could I get...", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Check ≠ чек! В ресторане США check = счёт. Кассовый чек = receipt /рисИт/.", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Чаевые — не опция. 15% = норм, 18–20% = хорошее обслуживание, меньше 10% = вы оскорбили официанта. Считайте от суммы ДО налога.", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Entrée /Антрей/ в США = основное блюдо (не закуска!). Закуска = appetizer .", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Жалоба — это нормально: this isn't what I ordered говорят спокойно, без извинений и без агрессии. Вам заменят блюдо, часто бесплатный десерт сверху.", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Разбор диалога 14.07 — твои поправки (оценка 4,5/5)", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Ужин с женой (бронь → аллергия → жалоба на стейк → счёт) прошёл сильно: жалоба по формуле ( this isn't what we ordered + ordered medium / this is well-done , адаптировал под «we»!), аллергия заранее, keep the change . Вот что доработать:", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Было у тебя Правильно Почему", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "our reservation Ø under the name our reservation is under the name 🔴 выпал глагол be : reservation IS under...", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Could you recommend to us ? Could you recommend Ø? recommend — БЕЗ to us / me", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "to still waters two still waters two (2) ≠ to (предлог); still water = без газа", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "🔴 Твоя сквозная тема — потерянные маленькие слова. В этот день (и в блице 14.07) выпадали: is (reservation is under), it (How much is it ), I'm ( I'm swamped). Русский их опускает, английский — нет. Проговаривай служебные слова вслух.", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Задание", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Прочитайте фразы вслух 2 раза, диалог — 3 раза.", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Напишите «диалог» — ужин с женой в нью-йоркском ресторане: бронь, заказ с аллергией, принесут не то (!), счёт и чаевые. Я — официант, который очень старается 🙂", "s": "Модуль 2 · Путешествия · урок 9", "u": "lesson-02-09.html", "ti": "Урок 9 — Ресторан и кафе (Модуль 2)"}, {"t": "Тема: шопинг (размеры, примерка, возврат) и уличные вопросы (дорога, рекомендации). Последний «городской» урок перед финалом модуля!", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Фразы дня", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "В магазине 🛍️", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "I'm just looking, thanks. — «Я просто смотрю» — ответ на Can I help you? , снимает продавца с хвоста 🙂", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Do you have this in a medium? — «Есть это в размере M?» — или in size 42 / in black / in a larger size", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Can I try it on? — «Можно примерить?» — обязательно с on ! + Where are the fitting rooms? — «Где примерочные?»", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "How much is IT? — «Сколько стоит?» — да-да, ваш дрилл: it никуда не девается! 😄", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "It doesn't fit. It's too tight. — «Не подходит по размеру. Жмёт» — tight = тесно, loose = свободно", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Do you take credit cards? — «Карты принимаете?» — глагол take !", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "I'd like to return this. — «Хочу вернуть» — вас спросят: Do you have the receipt? /рисИт/ — чек!", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Can I get a refund? — «Можно возврат денег?» — или обмен: Can I exchange it?", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "What time do you close? — «До скольки работаете?»", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "На улице 🗺️", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Excuse me, how do I get to Central Park? — «Как пройти к...?» — главная уличная формула: How do I get to X?", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Is it within walking distance? — «Туда можно дойти пешком?» — или короче: Can I walk there?", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "I'm looking for a pharmacy. — «Я ищу аптеку» — формула поиска: I'm looking for...", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Could you recommend a good place to eat around here? — «Посоветуете, где поесть поблизости?» — around here = поблизости", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Мини-диалог (магазин)", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Ловушки для русскоговорящих", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Magazine ≠ магазин! Ложный друг №1: magazine = журнал. Магазин = store (США) / shop .", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Fit vs suit: It doesn't fit = не подходит ПО РАЗМЕРУ. It doesn't suit me = не идёт (по стилю/цвету). Продавцу важна разница!", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Try ON, не try: Can I try it on? — без on значит «попробовать» (еду). Примерка одежды — всегда с on .", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Чек = receipt /рисИт/ (p не читается!). Помните: check — счёт в ресторане.", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "«How do I get to...» — не «Where is...» : носители спрашивают дорогу через «как мне попасть», а не «где находится».", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Разбор диалога 15.07 — твои поправки (оценка 4,5/5)", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Двойная сцена (подарок жене → аптека → рекомендация ресторана) прошла сильно: 🎉 HOW MUCH IS IT — с it , в живой речи (главный дрилл взят!), торг за скидку смело, все уличные формулы. Вот что доработать:", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Было у тебя Правильно Почему", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "for Ø bag for a bag пропущен артикль a", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "any chance to discount any chance of a discount any chance OF + существительное (of a discount)", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "recommend me a place recommend Ø a place recommend — БЕЗ me / to us", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "I'd appreciate it (после помощи) I appreciate it 🔴 I'd appreciate — ПРИ просьбе (заранее); I appreciate it — ПОСЛЕ помощи (спасибо)", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "🔴 Тонкость дня: I'd appreciate it (условное — когда просишь заранее) vs I appreciate it (спасибо, когда уже помогли). Тебе помогли → I appreciate it .", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Задание", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Прочитайте фразы вслух 2 раза, диалог — 3 раза.", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Напишите «диалог» — двойная сцена: купить подарок жене (я продавец) → на улице найти дорогу к аптеке и месту для ужина.", "s": "Модуль 2 · Путешествия · урок 10", "u": "lesson-02-10.html", "ti": "Урок 10 — Магазины и улица (Модуль 2)"}, {"t": "Тема: самый сложный формат общения — нет лица, жестов и субтитров, только голос. Хорошая новость: телефонные разговоры — самые шаблонные в языке. Выучите каркас — и 80% любого звонка предсказуемо.", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Фразы дня", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Начало звонка", "s": "Модуль 3 · Быт за границей · урок 11", "u": "lesson-03-11.html", "ti": "Урок 11 — Телефонные разговоры (Модуль 3 «Быт за границей»)"}, {"t": "Hello, this is Alex Smith. — «Здравствуйте, это Алекс Смит» — ⚠️ по телефону this is , НЕ I am ! Спрашивают вас: Is this Mr. Smith? — ответ: «Speaking!» («это я»).", "s": "Модуль 3 · Быт за границей · ур
