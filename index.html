:root{

*{box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg);

.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.bar button{font-size:15px;padding:9px 16px;border:1.5px solid var(--accent);background:var(--card);
 color:var(--accent);border-radius:10px;cursor:pointer;font-weight:600;transition:.15s}
.bar button.on{background:var(--accent);color:#fff}
.bar button:active{transform:scale(.96)}
.progress{width:min(600px,96vw);height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:6px}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0;transition:.3s}
.count{font-size:14px;color:var(--muted);margin:2px 0 6px}
.scene{perspective:1400px;width:min(600px,96vw);margin:8px 0 16px}
.card{position:relative;width:100%;min-height:280px;cursor:pointer;user-select:none;
 transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border-radius:22px;
 box-shadow:var(--shadow);padding:30px 26px;display:flex;flex-direction:column;justify-content:center;
 align-items:center;text-align:center}
.face.back{transform:rotateY(180deg)}
.tag{position:absolute;top:16px;left:0;right:0;font-size:12px;color:var(--muted);
 text-transform:uppercase;letter-spacing:1px}
.front-text{font-size:27px;font-weight:600;line-height:1.35}
.back-text{font-size:26px;font-weight:600;color:var(--good);line-height:1.35}
.hint{position:absolute;bottom:16px;left:0;right:0;font-size:13px;color:var(--muted)}
.rate{display:flex;gap:12px;width:min(600px,96vw);margin-top:2px}
.rate button{flex:1;font-size:17px;font-weight:700;padding:16px;border:none;border-radius:14px;cursor:pointer;transition:.15s}
.rate button:active{transform:scale(.97)}
.know{background:var(--good-bg);color:var(--good)}
.dunno{background:var(--bad-bg);color:var(--bad)}
.rate.hidden{visibility:hidden}
.nav{display:flex;gap:10px;margin-top:12px}
.nav button{font-size:15px;padding:11px 20px;border:1.5px solid var(--soft);background:var(--card);
 color:var(--muted);border-radius:10px;cursor:pointer}
.done{text-align:center;padding:40px 20px}
.done h2{color:var(--accent);font-size:26px}
.done .big{font-size:60px;margin:10px}
.stat{font-size:18px;margin:8px}
.stat b.g{color:var(--good)}.stat b.b{color:var(--bad)}

const SAVE='englishFlashcardsProgress_v1';
let mode='all',queue=[],cur=null,flipped=false,know=0,dunno=0,total0=0,again=[];
function base(){return ALL.filter(c=>mode==='all'||c.hard);}
function shuf(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
// --- сохранение/восстановление прогресса ---
function save(){try{localStorage.setItem(SAVE,JSON.stringify(
 {mode,know,dunno,total0,cur,queue,again}));}catch(e){}}
function load(){try{const r=localStorage.getItem(SAVE);return r?JSON.parse(r):null;}catch(e){return null;}}
function clearSave(){try{localStorage.removeItem(SAVE);}catch(e){}}
function setMode(m){mode=m;document.getElementById('mAll').className=m==='all'?'on':'';
 document.getElementById('mHard').className=m==='hard'?'on':'';restart(true);}
function restart(reshuffle){clearSave();queue=shuf(base().slice());again=[];know=0;dunno=0;total0=queue.length;
 document.getElementById('finish').style.display='none';document.getElementById('study').style.display='';next();}
function resume(s){mode=s.mode||'all';know=s.know||0;dunno=s.dunno||0;total0=s.total0||0;
 queue=s.queue||[];again=s.again||[];cur=s.cur||null;
 document.getElementById('mAll').className=mode==='all'?'on':'';
 document.getElementById('mHard').className=mode==='hard'?'on':'';
 document.getElementById('finish').style.display='none';document.getElementById('study').style.display='';
 flipped=false;document.getElementById('card').classList.remove('flipped');
 document.getElementById('rate').classList.add('hidden');
 if(cur){render();}else{next();}}
function render(){
 if(!cur)return;
 document.getElementById('tagF').textContent=cur.tag+(cur.hard?' • 🔴':'');
 document.getElementById('tagB').textContent=cur.tag+(cur.hard?' • 🔴':'');
 document.getElementById('frontT').textContent=cur.front;
 document.getElementById('backT').textContent=cur.back;
 const done=total0-queue.length-1;
 document.getElementById('count').textContent='осталось '+(queue.length+1)+' · ✓'+know+' ✗'+dunno;
 document.getElementById('pbar').style.width=total0?((done<0?0:done)/total0*100)+'%':'0';
}
function next(){
 flipped=false;document.getElementById('card').classList.remove('flipped');
 document.getElementById('rate').classList.add('hidden');
 if(queue.length===0){
  if(again.length){queue=shuf(again);again=[];total0=queue.length;} // второй проход по ошибкам
  else return finish();
 }
 cur=queue.shift();render();save();
}
function flip(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped',flipped);
 document.getElementById('rate').classList.toggle('hidden',!flipped);}
function rate(ok){if(ok)know++;else{dunno++;again.push(cur);}next();}
function skip(){queue.push(cur);next();}
function finish(){
 clearSave();
 document.getElementById('study').style.display='none';
 const f=document.getElementById('finish');f.style.display='';
 const emo=dunno===0?'🏆':know>=dunno?'👍':'💪';
 f.innerHTML='<div class="big">'+emo+'</div><h2>Готово!</h2>'+
  '<div class="stat">Знал: <b class="g">'+know+'</b> · Не знал: <b class="b">'+dunno+'</b></div>'+
  '<div class="stat">'+(dunno===0?'Идеально — вся колода взята!':'Ошибки повторились в конце — так они запоминаются.')+'</div>'+
  '<div class="nav" style="justify-content:center"><button onclick="restart(true)">🔁 Ещё раз</button></div>';
 document.getElementById('pbar').style.width='100%';
 document.getElementById('count').textContent='';
}
// клавиши
document.addEventListener('keydown',e=>{
 if(e.code==='Space'){e.preventDefault();flip();}
 else if(flipped&&(e.key==='ArrowRight'||e.key==='k'))rate(true);
 else if(flipped&&(e.key==='ArrowLeft'||e.key==='d'))rate(false);
});
// свайпы (телефон)
let sx=0,sy=0;const card=document.getElementById('card');
card.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
card.addEventListener('touchend',e=>{
 const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)<40&&Math.abs(dy)<40){return;} // тап обрабатывает onclick
 e.preventDefault();
 if(!flipped){flip();return;}
 if(dx>40)rate(true);else if(dx<-40)rate(false);
},{passive:false});
// при загрузке: продолжить сохранённую сессию, иначе начать новую
const saved=load();
if(saved&&(saved.queue&&saved.queue.length||saved.cur)){resume(saved);}
else{restart(true);}
